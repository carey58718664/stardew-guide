行动台ok版本

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>星露谷 · 田间决策手册</title>
<style>
:root{
  --bg:#f7efd9;
  --paper:#fffaf0;
  --paper-2:#f1e3c4;
  --paper-3:#ead7ae;
  --ink:#30271d;
  --muted:#746858;
  --faint:#9a8b74;
  --line:#d7bd86;
  --wood:#6f4728;
  --wood-2:#8a5b32;
  --gold:#c8952d;
  --green:#4e845a;
  --blue:#426f93;
  --red:#bd4b39;
  --purple:#705c91;
  --shadow:0 12px 30px rgba(81,55,27,.10);
  --shadow-sm:0 4px 14px rgba(81,55,27,.08);
  --radius:18px;
  --radius-sm:12px;
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  min-height:100vh;
  color:var(--ink);
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;
  background:
    radial-gradient(circle at 15% 20%,rgba(214,170,82,.18) 0 2px,transparent 2px 44px),
    radial-gradient(circle at 85% 15%,rgba(86,132,91,.12) 0 2px,transparent 2px 54px),
    linear-gradient(180deg,#fbf4e2 0%,var(--bg) 100%);
  padding-bottom:calc(86px + var(--safe-bottom));
}
button,input,select,textarea{font:inherit}
button{cursor:pointer;touch-action:manipulation}
.header{
  background:linear-gradient(135deg,#3a2719,#704725 64%,#8b5d34);
  color:#fff4d6;
  border-bottom:4px solid var(--gold);
  box-shadow:0 4px 20px rgba(0,0,0,.18);
}
.header-inner{max-width:1120px;margin:0 auto;padding:18px 16px 16px}
.eyebrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#e7bd68;margin-bottom:7px}
.header h1{font-size:clamp(24px,6vw,38px);line-height:1.08;letter-spacing:.02em}
.header p{color:rgba(255,244,214,.78);font-size:14px;margin-top:8px}
.app{width:min(1120px,100%);margin:0 auto;padding:14px}
.top-card{
  background:rgba(255,250,240,.92);
  border:1px solid rgba(215,189,134,.78);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:12px;
  position:sticky;
  top:0;
  z-index:10;
  backdrop-filter:blur(12px);
}
.today-state-card{
  background:rgba(255,250,240,.96);
  border:1px solid rgba(215,189,134,.78);
  border-radius:var(--radius);
  box-shadow:var(--shadow-sm);
  padding:12px;
  margin-bottom:14px;
}
.search-panel-view{margin-top:14px;}
.search-row{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center}
.search-box{position:relative}
.search-box span{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--faint)}
.search-box input{
  width:100%;
  border:2px solid var(--line);
  border-radius:999px;
  padding:12px 14px 12px 42px;
  background:white;
  color:var(--ink);
  outline:none;
  box-shadow:var(--shadow-sm);
}
.search-box input:focus{border-color:var(--wood-2);box-shadow:0 0 0 4px rgba(138,91,50,.16),var(--shadow-sm)}
.icon-btn{border:0;color:white;background:var(--wood);min-width:46px;height:46px;border-radius:999px;box-shadow:var(--shadow-sm);font-size:22px}
.search-submit-btn{border:0;color:#fff4d6;background:var(--wood-2);height:46px;border-radius:999px;padding:0 15px;box-shadow:var(--shadow-sm);font-size:14px;font-weight:900;white-space:nowrap}
.state-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.field{background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px}
.field label{display:block;font-size:11px;color:var(--faint);margin-bottom:4px}
.field select,.field input{width:100%;border:0;outline:0;background:transparent;color:var(--ink);font-weight:700}
.quick-chips{display:none;gap:7px;overflow:auto;padding-top:10px;scrollbar-width:none}
.quick-chips::-webkit-scrollbar{display:none}
.chip{
  border:1px solid var(--line);
  background:#fff8e7;
  color:var(--wood);
  border-radius:999px;
  padding:7px 11px;
  font-size:13px;
  white-space:nowrap;
}
.chip.hot{background:#fff0e8;border-color:#e3a18f;color:var(--red)}
.view{display:none;margin-top:14px}
.view.active{display:block}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:18px 2px 10px}
.section-head h2{font-size:20px}
.section-head p{color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}
.card{
  background:rgba(255,250,240,.96);
  border:1px solid rgba(215,189,134,.92);
  border-radius:var(--radius);
  box-shadow:var(--shadow-sm);
  padding:14px;
  overflow:hidden;
}
.card h3{display:flex;align-items:center;flex-wrap:wrap;gap:8px;font-size:17px;margin-bottom:8px}
.card p,.meta{color:var(--muted);font-size:14px;line-height:1.55}
.span-4{grid-column:span 4}
.span-6{grid-column:span 6}
.span-8{grid-column:span 8}
.span-12{grid-column:span 12}
.priority-list{display:grid;gap:8px}
.task{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:flex-start;padding:10px;border-radius:14px;background:white;border:1px solid rgba(215,189,134,.72)}
.task-icon{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;background:#f5e8cc}
.task strong{display:block;font-size:14px}
.task small{display:block;color:var(--muted);font-size:12px;line-height:1.45;margin-top:3px}
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 8px;background:#eee1c4;color:var(--wood);font-size:11px;font-weight:800;white-space:nowrap}
.badge.green{background:rgba(78,132,90,.14);color:var(--green)}
.badge.red{background:rgba(189,75,57,.14);color:var(--red)}
.badge.blue{background:rgba(66,111,147,.14);color:var(--blue)}
.badge.gold{background:rgba(200,149,45,.18);color:#9a6d17}
.badge.purple{background:rgba(112,92,145,.14);color:var(--purple)}
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:#fff;border:1px solid rgba(215,189,134,.72);border-radius:15px;padding:10px}
.stat b{font-size:20px}
.stat span{display:block;color:var(--muted);font-size:12px}
.card-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.item-card{
  background:white;
  border:1px solid rgba(215,189,134,.9);
  border-radius:var(--radius);
  box-shadow:var(--shadow-sm);
  padding:14px;
  transition:transform .18s,box-shadow .18s,border-color .18s;
}
.item-card:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:#c39148}
.item-title{display:flex;align-items:center;flex-wrap:wrap;gap:7px;margin-bottom:8px}
.item-title h3{font-size:17px;margin-right:auto}
.line{height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent);margin:10px 0}
.detail-block{display:grid;gap:6px;margin-top:8px}
.detail{display:grid;grid-template-columns:72px 1fr;gap:8px;font-size:13px;line-height:1.5}
.detail .k{color:var(--faint)}
.detail .v{color:var(--ink)}
.action-bar{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.link-btn{border:1px solid var(--line);background:#fff8e7;color:var(--blue);border-radius:999px;padding:6px 10px;font-size:12px}
.library-tabs{display:flex;gap:8px;overflow:auto;scrollbar-width:none;padding:2px 0 10px}
.library-tabs::-webkit-scrollbar{display:none}
.library-major-tabs{padding-bottom:8px}
.library-sub-tabs{border-top:1px solid rgba(215,189,134,.62);padding-top:10px;margin-bottom:10px}
.library-sub-tabs .tab{font-size:13px;padding:7px 11px}
.library-context{background:#fff8e7;border:1px solid rgba(215,189,134,.82);border-radius:16px;padding:12px;margin:0 0 12px;color:var(--muted);font-size:13px;line-height:1.55}
.library-context b{color:var(--ink)}
.taxonomy-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(286px,1fr));gap:12px;align-items:start}
.taxonomy-card{position:relative;background:linear-gradient(180deg,#fff 0%,#fffaf0 100%);border:1px solid rgba(215,189,134,.9);border-radius:var(--radius);box-shadow:var(--shadow-sm);padding:14px;overflow:hidden}
.taxonomy-card::before{content:"";position:absolute;inset:0 0 auto;height:4px;background:linear-gradient(90deg,var(--green),var(--gold),var(--blue));opacity:.82}
.taxonomy-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:8px}
.taxonomy-head h3{font-size:17px;line-height:1.28;margin:0}
.taxonomy-badges{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:5px;min-width:86px}
.taxonomy-badge{display:inline-flex;align-items:center;border-radius:999px;padding:3px 7px;background:rgba(66,111,147,.12);color:var(--blue);font-size:11px;font-weight:900;white-space:nowrap}
.taxonomy-summary{color:var(--muted);font-size:13px;line-height:1.55;margin:4px 0 9px}
.taxonomy-rows{display:grid;gap:6px;margin:8px 0 10px}
.taxonomy-row{display:grid;grid-template-columns:72px 1fr;gap:8px;align-items:start;border-top:1px dashed rgba(215,189,134,.72);padding-top:6px;font-size:12px;line-height:1.45}
.taxonomy-row span{color:var(--faint)}
.taxonomy-row b{color:var(--ink);font-weight:800}
.taxonomy-list{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 10px}
.taxonomy-pill{display:inline-flex;align-items:center;border:1px solid rgba(215,189,134,.82);border-radius:999px;background:#fff;color:var(--wood);padding:4px 8px;font-size:12px;font-weight:800}
.logic-note{border-top:1px solid rgba(215,189,134,.7);padding-top:8px;color:var(--muted);font-size:12px;line-height:1.5}
.logic-note b{color:var(--wood)}
.tab{border:1px solid var(--line);background:white;color:var(--wood);border-radius:999px;padding:8px 12px;font-weight:800;white-space:nowrap}
.tab.active{background:var(--wood);color:white;border-color:var(--wood)}
.room-card{background:white;border:1px solid rgba(215,189,134,.9);border-radius:var(--radius);box-shadow:var(--shadow-sm);overflow:hidden}
.room-head{padding:14px;background:linear-gradient(135deg,#fff8e7,#f1dfb7);display:flex;justify-content:space-between;gap:12px;align-items:center}
.room-title b{font-size:17px}
.room-title span{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.progress{width:116px;height:9px;border-radius:999px;background:#e8d3a9;overflow:hidden}
.progress i{display:block;height:100%;width:0%;background:linear-gradient(90deg,var(--green),#8eb36e);border-radius:inherit}
.bundle-row{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:12px 14px;border-top:1px dashed rgba(215,189,134,.86)}
.check{width:24px;height:24px;border-radius:8px;border:2px solid var(--line);background:#fffaf0;color:white;display:grid;place-items:center;font-size:14px;font-weight:900}
.check.done{background:var(--green);border-color:var(--green)}
.bundle-main b{font-size:14px}
.bundle-main.done b{color:var(--faint);text-decoration:line-through}
.bundle-main p{color:var(--muted);font-size:13px;line-height:1.5;margin-top:4px}
.bundle-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.search-empty{text-align:center;padding:40px 12px;color:var(--muted)}
.notice{padding:10px 12px;border-radius:14px;background:#fff5df;border:1px solid var(--line);color:var(--muted);font-size:13px;line-height:1.5}
.planner-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:12px}
.action-note{background:#fff8e7;border:1px solid rgba(215,189,134,.82);border-radius:16px;padding:10px 12px;color:var(--muted);font-size:13px;line-height:1.55;margin-bottom:10px}
.action-note b{color:var(--ink)}
.action-mini-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
.action-mini{background:#fff;border:1px solid rgba(215,189,134,.72);border-radius:14px;padding:9px}
.action-mini b{display:block;font-size:15px}
.action-mini span{display:block;color:var(--muted);font-size:12px;line-height:1.35;margin-top:2px}

.action-state-card{position:relative;overflow:hidden}
.action-status-bar{display:flex;gap:7px;overflow:auto;scrollbar-width:none;margin-top:10px;padding-top:9px;border-top:1px dashed rgba(215,189,134,.82)}
.action-status-bar::-webkit-scrollbar{display:none}
.action-status-bar span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;border:1px solid rgba(215,189,134,.78);background:#fff8e7;color:var(--wood);border-radius:999px;padding:6px 10px;font-size:12px;font-weight:800}
.action-status-bar b{font-size:15px;color:var(--ink)}
.action-title-row{margin-top:14px}
.action-grid{align-items:start}
.card-head-line{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}
.card-head-line h3{margin-bottom:2px}
.card-head-line p{color:var(--muted);font-size:13px;line-height:1.45}
.action-feed{display:grid;gap:9px}
.action-card{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:flex-start;background:#fff;border:1px solid rgba(215,189,134,.86);border-radius:17px;padding:11px;box-shadow:0 4px 12px rgba(81,55,27,.06);transition:opacity .18s,transform .18s,border-color .18s}
.action-card:hover{transform:translateY(-1px);border-color:#c39148}
.action-card.done{opacity:.52}
.action-card.done h4{text-decoration:line-through;color:var(--faint)}
.action-check{width:30px;height:30px;border-radius:11px;border:2px solid var(--line);background:#fffaf0;color:var(--green);font-weight:900;display:grid;place-items:center;flex:0 0 auto}
.action-card.done .action-check{background:rgba(78,132,90,.15);border-color:var(--green)}
.action-card-icon{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;background:#f5e8cc;font-size:18px}
.action-card-main h4{font-size:15px;line-height:1.25;margin-bottom:3px}
.action-card-main p{font-size:13px;color:var(--muted);line-height:1.45}
.action-card-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.action-tag{display:inline-flex;border-radius:999px;padding:3px 7px;font-size:11px;font-weight:900;background:#eee1c4;color:var(--wood)}
.action-tag.red{background:rgba(189,75,57,.13);color:var(--red)}
.action-tag.green{background:rgba(78,132,90,.14);color:var(--green)}
.action-tag.blue{background:rgba(66,111,147,.13);color:var(--blue)}
.action-tag.gold{background:rgba(200,149,45,.16);color:#9a651b}
.action-links{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.bag-lite-card{background:linear-gradient(180deg,rgba(255,250,240,.98),rgba(255,248,231,.9))}
.bag-input-lite{min-height:72px;font-size:14px;box-shadow:none}
.bag-inline-summary{margin-top:9px;color:var(--muted);font-size:13px;line-height:1.45}
.bag-inline-summary .notice{margin-top:0}
.bag-pill-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.bag-pill{display:inline-flex;align-items:center;border:1px solid rgba(215,189,134,.78);border-radius:999px;background:#fff;color:var(--wood);padding:4px 8px;font-size:12px;font-weight:800}
.timeline-list{display:grid;gap:8px}
.timeline-item{display:grid;grid-template-columns:auto 1fr;gap:10px;background:#fff;border:1px solid rgba(215,189,134,.82);border-radius:16px;padding:10px}
.timeline-item .badge{align-self:start}
.timeline-item b{font-size:14px}
.timeline-item p{font-size:13px;color:var(--muted);line-height:1.45;margin-top:3px}
.desk-details{background:transparent;border:0;padding:0;margin:0}
.desk-details summary{cursor:pointer;color:var(--wood);font-weight:900;list-style:none;padding:2px 0 11px;border-bottom:1px dashed rgba(215,189,134,.82)}
.desk-details summary::-webkit-details-marker{display:none}
.desk-pool-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:12px}
.desk-pool-grid section{background:#fff;border:1px solid rgba(215,189,134,.72);border-radius:16px;padding:11px;min-width:0}
.desk-pool-grid h3{font-size:15px;margin-bottom:8px}
.compact-list{grid-template-columns:1fr;gap:8px}
.advice-group{background:#fff;border:1px solid rgba(215,189,134,.82);border-radius:16px;padding:10px;margin-top:9px}
.advice-group-title{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--wood);font-size:13px;font-weight:900;margin-bottom:8px}
.advice-group .advice-card{box-shadow:none;margin-top:7px}
.advice-group .advice-card:first-of-type{margin-top:0}
.bag-input{width:100%;min-height:126px;resize:vertical;border:1.5px solid var(--line);border-radius:16px;padding:12px;outline:0;background:#fff;color:var(--ink);box-shadow:var(--shadow-sm)}
.bag-input:focus{border-color:var(--wood-2);box-shadow:0 0 0 4px rgba(138,91,50,.14),var(--shadow-sm)}
.tip-row{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.advice-list,.risk-list,.checklist{display:grid;gap:8px;margin-top:10px}
.advice-card,.risk-item,.checkline,.machine-card{background:#fff;border:1px solid rgba(215,189,134,.82);border-radius:15px;padding:10px}
.advice-card strong{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:14px}
.advice-card p,.machine-card p{font-size:13px;color:var(--muted);line-height:1.5;margin-top:4px}
.risk-item{display:grid;grid-template-columns:auto 1fr auto;gap:9px;align-items:center}
.risk-item small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.checkline{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:start}
.checkline b{font-size:13px}
.checkline p{font-size:12px;color:var(--muted);line-height:1.45;margin-top:2px}
.crop-card-host{
  background:rgba(255,250,240,.96);
  border:1px solid rgba(215,189,134,.92);
  border-radius:var(--radius);
  box-shadow:var(--shadow-sm);
  overflow:hidden;
}
.crop-card-toolbar{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:center;
  flex-wrap:wrap;
  padding:12px;
  background:linear-gradient(135deg,#fff8e7,#f1dfb7);
  border-bottom:1px solid var(--line);
}
.crop-card-toolbar b{font-size:16px}
.crop-card-frame{
  width:100%;
  height:min(78vh,920px);
  border:0;
  display:block;
  background:#fbf3dc;
}
.bottom-nav{
  position:fixed;
  left:50%;
  bottom:calc(10px + var(--safe-bottom));
  transform:translateX(-50%);
  z-index:50;
  width:min(620px,calc(100% - 20px));
  background:rgba(48,39,29,.92);
  border:1px solid rgba(255,255,255,.12);
  border-radius:24px;
  box-shadow:0 10px 32px rgba(0,0,0,.28);
  backdrop-filter:blur(14px);
  display:grid;
  grid-template-columns:repeat(3,1fr);
  padding:6px;
}
.nav-btn{color:#eadfc8;background:transparent;border:0;border-radius:18px;padding:8px 4px;display:grid;place-items:center;gap:2px;font-size:11px}
.nav-btn b{font-size:18px;line-height:1}
.nav-btn.active{background:#fff4d6;color:var(--wood)}
dialog{width:min(680px,calc(100% - 24px));border:0;border-radius:22px;box-shadow:0 28px 80px rgba(0,0,0,.34);padding:0;background:var(--paper);color:var(--ink)}
dialog::backdrop{background:rgba(30,20,12,.42);backdrop-filter:blur(4px)}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:14px 16px;background:linear-gradient(135deg,#fff8e7,#f1dfb7);border-bottom:1px solid var(--line)}
.page-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.action-status-bar{display:none!important}
.bag-inline-summary{display:none!important}
.modal-back-btn{border:0;background:rgba(111,71,40,.12);color:var(--wood);border-radius:12px;padding:8px 10px;font-weight:900}
.modal-head strong{flex:1;text-align:center}

.modal-body{padding:16px;max-height:76vh;overflow:auto}
.close-btn{border:0;background:rgba(111,71,40,.12);color:var(--wood);border-radius:12px;width:34px;height:34px}
.hidden{display:none!important}
@media (max-width:760px){
  .action-status-bar{padding-bottom:1px}
  .card-head-line{align-items:flex-start}
  .action-card{grid-template-columns:auto 1fr;gap:9px}
  .action-card .action-check{grid-column:1;grid-row:1}
  .action-card-main{grid-column:2;grid-row:1 / span 2}
  .action-card-icon{display:none}
  .desk-pool-grid{grid-template-columns:1fr}
}
@media (max-width:760px){
  .app{padding:10px}
  .search-row{grid-template-columns:1fr auto auto;gap:6px}
  .search-submit-btn{height:44px;padding:0 12px;font-size:13px}
  .icon-btn{min-width:44px;height:44px}
  .top-card{border-radius:0 0 20px 20px;margin:-10px -10px 0}
  .today-state-card{padding:10px}
  .state-grid{grid-template-columns:repeat(2,1fr)}
  .grid{display:block}
  .grid>.card{margin-bottom:10px}
  .stat-row{grid-template-columns:1fr}
  .section-head{align-items:flex-start;flex-direction:column;gap:2px}
  .card-list{grid-template-columns:1fr}
  .planner-grid{grid-template-columns:1fr}
  .task{grid-template-columns:auto 1fr}
  .task .badge{grid-column:2}
  .header-inner{padding:16px 14px}
  .crop-card-frame{height:76vh}
}

/* Action Desk v3: 当前情况 + 待做事项 */
.desk-two-blocks{align-items:start}
.current-context-card,.action-output-card{position:relative}
.context-box-grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(112px,.8fr);gap:8px;margin-top:4px}
.context-box{background:#fff;border:1px solid rgba(215,189,134,.82);border-radius:16px;padding:8px;box-shadow:0 4px 12px rgba(81,55,27,.05)}
.context-box-title{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:6px}
.context-box-title b{font-size:14px;color:var(--ink)}
.context-box-title span{font-size:11px;color:var(--faint);font-weight:800}
.mini-field-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.context-weather .field{height:calc(100% - 25px)}
.resource-panel{margin-top:10px;background:#fff;border:1px solid rgba(215,189,134,.74);border-radius:16px;padding:9px 10px}
.resource-panel summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:10px;align-items:center;color:var(--wood);font-weight:900}
.resource-panel summary::-webkit-details-marker{display:none}
.resource-panel summary em{font-style:normal;color:var(--muted);font-size:12px;font-weight:700;text-align:right}
.resource-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:9px}
.resource-field{display:block;border:1px solid rgba(215,189,134,.72);border-radius:13px;background:#fffaf0;padding:6px}
.resource-field span{display:block;color:var(--faint);font-size:11px;margin-bottom:3px;font-weight:850}
.resource-field textarea{width:100%;height:34px;min-height:34px;max-height:34px;resize:none;overflow:auto;border:0;outline:0;background:transparent;color:var(--ink);font-size:13px;line-height:1.35}
.resource-presets{margin-top:8px}
.resource-presets .chip{font-size:12px;padding:6px 9px}
.current-context-card,.resource-panel{overflow:visible}
.selected-resource-bar{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;min-height:0;align-items:center}
.selected-resource-empty{color:var(--muted);font-size:12px;line-height:1.4}
.selected-resource-chip{border:1px solid rgba(215,189,134,.86);background:#fff8e7;color:var(--wood);border-radius:999px;padding:4px 8px;font-size:12px;font-weight:850}
.selected-resource-chip button{border:0;background:transparent;color:var(--red);font-weight:900;margin-left:4px;padding:0}
.resource-selector-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px;position:relative;overflow:visible}
.resource-picker{position:relative;min-width:0;z-index:1}
.resource-picker.open{z-index:40}
.resource-trigger{width:100%;border:1px solid rgba(215,189,134,.82);background:#fffaf0;color:var(--ink);border-radius:14px;padding:8px 9px;display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:40px;text-align:left;box-shadow:0 3px 10px rgba(81,55,27,.04)}
.resource-trigger b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.resource-trigger span{font-size:11px;color:var(--muted);white-space:nowrap}
.resource-trigger i{font-style:normal;color:var(--wood);font-size:13px}
.resource-menu{display:none;position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:50;background:#fff;border:1px solid rgba(215,189,134,.95);border-radius:16px;box-shadow:0 14px 36px rgba(81,55,27,.20);padding:9px;max-height:280px;overflow:auto}
.resource-picker.open .resource-menu{display:block}
.resource-search{width:100%;border:1px solid rgba(215,189,134,.82);border-radius:999px;padding:7px 10px;margin-bottom:8px;outline:0;background:#fffaf0;color:var(--ink);font-size:13px}
.resource-options{display:grid;gap:5px}
.resource-option{display:flex;align-items:center;gap:7px;border:1px solid rgba(215,189,134,.52);background:#fffaf0;border-radius:12px;padding:6px 7px;font-size:13px;line-height:1.2}
.resource-option input{accent-color:var(--wood)}
.resource-option small{color:var(--muted);font-size:10px;margin-left:auto;white-space:nowrap}
.resource-menu-note{color:var(--muted);font-size:11px;line-height:1.35;margin-top:7px}
.search-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.search-actions .chip{font-size:12px;padding:7px 10px}
.strategy-card{background:linear-gradient(135deg,#fff8e7,#f2e2bd);border:1px solid rgba(215,189,134,.9);border-radius:17px;padding:12px;margin-bottom:10px}
.strategy-card>b{display:block;font-size:15px;margin-bottom:8px;color:var(--ink)}
.strategy-list{display:grid;gap:7px}
.strategy-line{background:rgba(255,255,255,.58);border:1px solid rgba(215,189,134,.55);border-radius:13px;padding:8px 9px;color:var(--muted);font-size:13px;line-height:1.55}
.inline-keyword{display:inline;border:0;background:rgba(54,107,65,.14);color:#2f6b42;border-radius:7px;padding:1px 5px;margin:0 1px;font-size:12px;font-weight:950;vertical-align:baseline;box-shadow:inset 0 -1px 0 rgba(47,107,66,.38)}.inline-keyword:active,.inline-keyword:hover{background:rgba(54,107,65,.22);color:#214d31}
.action-card-tags .action-tag{max-width:100%;overflow:hidden;text-overflow:ellipsis}
.bag-inline-summary{font-size:12px;color:var(--muted);line-height:1.45;margin-top:7px}
@media (max-width:760px){
  .context-box-grid{grid-template-columns:minmax(0,1.55fr) minmax(96px,.75fr);gap:6px}
  .context-box{padding:7px;border-radius:14px}
  .context-box-title{margin-bottom:5px}
  .context-box-title span{display:none}
  .mini-field-row{gap:5px}
  .context-box .field{padding:8px 9px}
  .context-box .field label{font-size:10px;margin-bottom:2px}
  .context-box .field select{font-size:13px}
  .resource-grid{grid-template-columns:repeat(2,1fr);gap:6px}
  .resource-selector-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
  .resource-panel{padding:8px;margin-top:8px}
  .resource-panel summary{align-items:flex-start;gap:4px}
  .resource-field{padding:5px}
  .resource-field span{font-size:10px;margin-bottom:2px}
  .resource-field textarea{height:30px;min-height:30px;max-height:30px;font-size:12px;line-height:1.25}
  .resource-trigger{padding:7px 8px;min-height:38px}
  .resource-trigger b{font-size:12px}
  .resource-trigger span{font-size:10px}
  .resource-menu{max-height:260px}
}

</style>

<body>
<header class="header">
  <div class="header-inner">
    <div class="eyebrow"><span>Stardew Valley 1.6</span><span>·</span><span>Decision Handbook</span></div>
    <h1>🌾 星露谷 · 田间决策手册</h1>
  </div>
</header>

<main class="app">
  <section class="top-card">
    <div class="search-row">
      <div class="search-box">
        <span>🔍</span>
        <input id="globalSearch" placeholder="搜任何东西：鲶鱼、南瓜、小桶、阿比盖尔、温室…" autocomplete="off" />
      </div>
      <button class="search-submit-btn" id="submitSearch" title="搜索">搜索</button>
      <button class="icon-btn" id="clearSearch" title="清空搜索">×</button>
    </div>
    <div class="quick-chips hidden" id="quickChips"></div>
  </section>

  <section id="searchPanel" class="search-panel-view hidden">
    <div class="section-head search-head">
      <div><h2>万能搜索</h2></div>
      <div class="search-actions">
        <button class="chip" data-action="close-search">← 返回行动台</button>
        <span class="badge blue" id="searchCount">0 个结果</span>
      </div>
    </div>
    <div id="searchResults" class="card-list"></div>
  </section>

  <section id="view-today" class="view active">
    <div class="section-head action-title-row">
      <div><h2>行动台</h2><p id="todaySubtitle" class="hidden"></p></div>
    </div>

    <div class="grid action-grid desk-two-blocks">
      <article class="card span-12 current-context-card">
        <div class="card-head-line compact-head">
          <div>
            <h3>当前情况（必填）</h3>
          </div>
        </div>

        <div class="context-box-grid">
          <section class="context-box context-time" aria-label="时间">
            <div class="context-box-title"><b>时间</b></div>
            <div class="mini-field-row">
              <div class="field"><select id="seasonSelect" aria-label="季节"><option value="春">🌸 春</option><option value="夏">☀️ 夏</option><option value="秋">🍂 秋</option><option value="冬">❄️ 冬</option></select></div>
              <div class="field"><select id="dayInput" aria-label="日期"><option value="1">1日</option><option value="2">2日</option><option value="3">3日</option><option value="4">4日</option><option value="5">5日</option><option value="6">6日</option><option value="7">7日</option><option value="8">8日</option><option value="9">9日</option><option value="10">10日</option><option value="11">11日</option><option value="12">12日</option><option value="13">13日</option><option value="14">14日</option><option value="15">15日</option><option value="16">16日</option><option value="17">17日</option><option value="18">18日</option><option value="19">19日</option><option value="20">20日</option><option value="21">21日</option><option value="22">22日</option><option value="23">23日</option><option value="24">24日</option><option value="25">25日</option><option value="26">26日</option><option value="27">27日</option><option value="28">28日</option></select></div>
            </div>
          </section>
          <section class="context-box context-weather" aria-label="天气">
            <div class="context-box-title"><b>天气</b></div>
            <div class="field"><select id="weatherSelect" aria-label="天气"><option value="晴天">☀️ 晴天</option><option value="雨天">🌧️ 雨天</option></select></div>
            <input id="phaseSelect" type="hidden" value="auto" />
          </section>
        </div>

        <div class="action-status-bar" aria-label="行动台概览">
          <span><b id="statAvailable">0</b> 今日可补献祭</span>
          <span><b id="statBirthday">0</b> 今日生日</span>
          <span><b id="statHot">0</b> 本季重点</span>
        </div>

        <details class="resource-panel" open>
          <summary><span>当前资源（选填）</span></summary>
          <div id="selectedResourceBar" class="selected-resource-bar"></div>
          <div id="resourceSelectorGrid" class="resource-selector-grid"></div>
          <div class="tip-row resource-presets hidden"></div>
          <div id="bagResults" class="bag-inline-summary"></div>
        </details>
      </article>

      <article class="card span-12 action-output-card">
        <div class="card-head-line">
          <div>
            <h3>待做事项</h3>
          </div>
        </div>
        <div id="moneyStrategy" class="strategy-card"></div>
        <div class="action-feed" id="todayTasks"></div>
      </article>
    </div>

    <div class="hidden" aria-hidden="true">
      <div id="riskItems"></div>
      <div id="machineAdvice"></div>
      <div id="seasonChecklist"></div>
      <div id="todayBundleItems"></div>
      <div id="seasonMoneyItems"></div>
    </div>
  </section>

  <section id="view-bundles" class="view">
    <div class="section-head"><div><h2>社区中心献祭</h2></div><div class="page-actions"><button class="chip" data-action="back-to-action">← 返回行动台</button><button class="chip" id="resetBundles">重置勾选</button></div></div>
    <div id="bundleRooms" class="card-list"></div>
  </section>

  <section id="view-library" class="view">
    <div class="section-head">
      <div><h2>资料库</h2></div>
      <button class="chip" data-action="back-to-action">← 返回行动台</button>
    </div>
    <div class="library-tabs library-major-tabs" id="libraryTabs"></div>
    <div class="library-tabs library-sub-tabs" id="librarySubTabs"></div>
    <div id="libraryContent" class="card-list"></div>
  </section>
</main>

<nav class="bottom-nav" aria-label="主导航">
  <button class="nav-btn active" data-action="open-view" data-view="today"><b>🌤️</b><span>行动台</span></button>
  <button class="nav-btn" data-action="open-view" data-view="bundles"><b>🎁</b><span>献祭</span></button>
  <button class="nav-btn" data-action="open-view" data-view="library"><b>📚</b><span>资料</span></button>
</nav>

<dialog id="detailModal">

  <div class="modal-body" id="modalBody"></div>
</dialog>

const cropCardsSrcdoc = new TextDecoder("utf-8").decode(Uint8Array.from(atob(cropCardsSrcdocBase64), c => c.charCodeAt(0)));

let cropDocCache = null;
function getCropDoc(){
  if(!cropDocCache){
    cropDocCache = new DOMParser().parseFromString(cropCardsSrcdoc, "text/html");
  }
  return cropDocCache;
}
function getCropArticles(query=""){
  const doc = getCropDoc();
  const q = String(query || "").trim().toLowerCase();
  const articles = [...doc.querySelectorAll(".result-card")];
  if(!q) return articles;
  return articles.filter(card => {
    const hay = [card.dataset.search || "", card.dataset.season || "", card.textContent || ""].join(" ").toLowerCase();
    return hay.includes(q);
  });
}
function getCropMatchCount(query=""){
  return getCropArticles(query).length;
}
function renderCropCardsInto(host, query=""){
  if(!host) return;
  const doc = getCropDoc();
  const q = String(query || "").trim();
  const articles = getCropArticles(q);
  const styleText = doc.querySelector("style")?.textContent || "";
  const devices = doc.querySelector("#devices")?.cloneNode(true);
  const shadow = host.shadowRoot || host.attachShadow({mode:"open"});
  shadow.innerHTML = "";

  const style = document.createElement("style");
  style.textContent = styleText + `
    :host{display:block;width:100%;}
    .app{max-width:900px;margin:0 auto;padding:12px 0 4px;}
    .section-title{margin:8px 3px 10px;}
    .section-title h2{font-size:24px;}
    .result-list{display:grid;gap:14px;}
    .empty-local{background:#fff;border:1px solid var(--line-soft);border-radius:18px;padding:18px;color:var(--muted);}
    .device-card{scroll-margin-bottom:110px;}
    @media(max-width:640px){.app{padding:10px 0 4px}.section-title h2{font-size:22px}.result-card{border-radius:22px}}
  `;
  shadow.appendChild(style);

  const app = document.createElement("div");
  app.className = "app";
  const section = document.createElement("section");
  section.id = "cropResultBlock";
  const title = document.createElement("div");
  title.className = "section-title";
  title.innerHTML = `<h2>🌽 作物</h2><p>${articles.length} 个结果${q ? " · " + escapeHTML(q) : ""}</p>`;
  section.appendChild(title);
  const list = document.createElement("div");
  list.className = "result-list";
  if(articles.length){
    articles.forEach(card => list.appendChild(card.cloneNode(true)));
  } else {
    const empty = document.createElement("div");
    empty.className = "empty-local";
    empty.textContent = "没有找到作物资料。";
    list.appendChild(empty);
  }
  section.appendChild(list);
  app.appendChild(section);
  if(devices){
    const deviceTitle = document.createElement("section");
    deviceTitle.className = "section-title";
    deviceTitle.id = "deviceTitle";
    deviceTitle.innerHTML = `<h2>相关设备 / 建筑</h2><p>收益和用途里的名称可以跳到这里。</p>`;
    app.appendChild(deviceTitle);
    app.appendChild(devices);
  }
  shadow.appendChild(app);
  shadow.onclick = ev => {
    const jump = ev.target.closest?.("[data-jump]");
    if(jump){
      ev.preventDefault();
      const el = shadow.getElementById(jump.dataset.jump);
      if(el){
        el.scrollIntoView({behavior:"smooth", block:"center"});
        el.classList.add("flash");
        setTimeout(()=>el.classList.remove("flash"), 1200);
      }
    }
  };
}

function linkifyActionText(text, keywords=[]){
  let html = escapeHTML(text || "");
  const names = [...new Set((keywords || []).filter(Boolean).map(String))].sort((a,b)=>b.length-a.length);
  names.forEach(name=>{

function itemScore(item,q){
  const query = norm(q);
  if(!query) return item.hot ? 40 : 0;
  let score = 0;
  const itemName = norm(item.name);
  const hay = [item.name,item.type,item.season,item.location,item.time,item.note,item.source].join(" ").toLowerCase();
  if(itemName === query) score += 100; else if(itemName.includes(query) || query.includes(itemName)) score += 70;
  if(hay.includes(query)) score += 20;
  if(score > 0){if(item.hot) score += 10;if(item.sacrifices) score += 6}
  return score;
}
function searchAll(q){

  let results = [];
  allItems.forEach(item=>{const score=itemScore(item,q);if(score>0) results.push({kind:"item",obj:item,score})});
  allNPCs.forEach(n=>{const hay=[n.name,n.loves,n.schedule,n.birthday].join(" ").toLowerCase();if(hay.includes(query)) results.push({kind:"npc",obj:n,score:norm(n.name).includes(query)?90:30})});
  allEquipment.forEach(e=>{const hay=[e.name,e.source,e.recipe,e.desc].join(" ").toLowerCase();if(hay.includes(query)) results.push({kind:"equipment",obj:e,score:norm(e.name).includes(query)?90:25})});
  allBuildings.forEach(b=>{const hay=[b.name,b.source,b.cost,b.desc].join(" ").toLowerCase();if(hay.includes(query)) results.push({kind:"building",obj:b,score:norm(b.name).includes(query)?90:25})});
  [...guides.mining,...guides.cooking].forEach(g=>{const hay=[g.name,g.desc,g.type].join(" ").toLowerCase();if(hay.includes(query)) results.push({kind:"guide",obj:g,score:norm(g.name).includes(query)?80:20})});

}

    const doneCount = room.items.filter((_,bi)=>bundleChecked[bundleKey(ri,bi)]).length;
    const percent = Math.round(doneCount / room.items.length * 100);
    return `<article class="room-card"><div class="room-head"><div class="room-title"><b>${escapeHTML(room.room)}</b><span>奖励：${escapeHTML(room.reward)} · ${doneCount}/${room.items.length}</span></div><div class="progress"><i style="width:${percent}%"></i></div></div><div class="bundle-list">${room.items.map((it,bi)=>{const key=bundleKey(ri,bi);const done=!!bundleChecked[key];return `<div class="bundle-row"><button class="check ${done ? "done" : ""}" data-action="toggle-bundle" data-key="${key}">${done ? "✓" : ""}</button><div class="bundle-main ${done ? "done" : ""}"><b>${escapeHTML(it.name)}</b><p>${escapeHTML(it.need)}</p><div class="bundle-tags">${(it.refs||[]).map(r=>`<button class="link-btn" data-action="search" data-query="${escapeHTML(r)}">${escapeHTML(r)}</button>`).join("")}</div></div></div>`}).join("")}</div></article>`;
  }).join("");
}
function splitBag(text){return String(text||"").split(/[\s,，、。;；\n]+/).map(x=>x.trim()).filter(Boolean)}
function resourcePseudoItem(name){
  const group = RESOURCE_NAME_TO_GROUP[name];
  if(!group) return null;
  const typeMap={crops:"作物",fish:"鱼",items:"物品",machines:"机器",farm:"农场",unlocks:"解锁"};
  return {id:`resource_${group}_${name}`,name,emoji:group==="crops"?"🌾":group==="fish"?"🐟":group==="machines"?"⚙️":group==="farm"?"🏡":group==="unlocks"?"🗺️":"📦",type:typeMap[group]||"物品",season:"任何",note:"当前资源选择项"};
}
function findItemByName(token){const q=norm(token);return allItems.find(i=>norm(i.name)===q) || allItems.find(i=>norm(i.name).includes(q) || q.includes(norm(i.name))) || resourcePseudoItem(token)}
function getInventoryItems(){
  const seen = new Set();
  const items = [];
  splitBag(getResourceText()).forEach(t=>{
    const item = findItemByName(t);
    if(item && !seen.has(item.id)){seen.add(item.id);items.push(item)}
  });
  return items;
}
function bagAdvice(item){
  const best=bestProcess(item);
  const loved=getLovedBy(item.name);
  const birthdayLikes=birthdayNPCs().filter(n=>(n.loves||"").includes(item.name));
  if(item.sacrifices?.length) return {group:"keep",cls:"keep",tag:"先留",text:`要献祭：${item.sacrifices.map(s=>s.room+"·"+s.bundle).join("；")}。先留够献祭数量。`};
  if(birthdayLikes.length) return {group:"today",cls:"gift",tag:"今天送",text:`今天生日可送：${birthdayLikes.map(n=>n.name).join("、")}。生日礼物收益更高。`};
  if(best && item.basePrice && best.p >= item.basePrice*1.6) return {group:"process",cls:"process",tag:"加工",text:`建议加工：${best.m}，约 ${best.p}G。原价 ${item.basePrice}G。`};
  if(loved.length) return {group:"gift",cls:"gift",tag:"送礼",text:`可留作礼物：${loved.slice(0,4).map(n=>n.name).join("、")}最爱。`};
  if(String(item.id||"").startsWith("resource_machines_")) return {group:"process",cls:"process",tag:"机器",text:`已拥有${item.name}，会提高对应加工路线的优先级。`};
  if(String(item.id||"").startsWith("resource_unlocks_")) return {group:"keep",cls:"keep",tag:"解锁",text:`已解锁${item.name}，相关地点和路线会进入判断。`};
  if(String(item.id||"").startsWith("resource_farm_")) return {group:"keep",cls:"keep",tag:"农场",text:`已拥有${item.name}，会影响动物、工具或建筑建议。`};
  return {group:"sell",cls:"",tag:"可卖",text:"没有明显献祭或高收益标记。缺钱可以卖，想稳一点就留一个。"};
}
function renderAdviceCard(item,a){
  return `<div class="advice-card ${a.cls}" data-action="detail" data-kind="item" data-id="${item.id}"><strong>${item.emoji || "📦"} ${escapeHTML(item.name)} <span class="badge">${a.tag}</span></strong><p>${escapeHTML(a.text)}</p></div>`;
}
function renderBagAdvisor(){
  const tokens=splitBag(getResourceText());
  if(!tokens.length){els.bagResults.innerHTML="";return}
  const recognized=[];const misses=[];const seen=new Set();
  tokens.forEach(t=>{
    const item=findItemByName(t);
    if(!item){misses.push(t);return}
    if(seen.has(item.id)) return;
    seen.add(item.id);
    recognized.push(item);
  });
  const miss = misses.length ? `，${misses.length} 个未识别` : "";
  els.bagResults.innerHTML = `已识别 ${recognized.length} 个物品${miss}，建议已并入待做事项。`;
}
function renderPlanner(){
  if(els.bagInput) els.bagInput.value = state.resources?.items || state.inventory || "";
  syncResourceInputs();
  renderBagAdvisor();
  const invItems = getInventoryItems();
  let candidates = invItems.filter(i=>bestProcess(i)).map(i=>({item:i,best:bestProcess(i),gain:bestProcess(i).p-(i.basePrice||0),source:"当前资源"}));
  if(!candidates.length){
    candidates = allItems.filter(i=>bestProcess(i) && isSeasonMatch(i) && (i.type==="作物" || i.type==="动物产品" || i.type==="采集"))
      .map(i=>({item:i,best:bestProcess(i),gain:bestProcess(i).p-(i.basePrice||0),source:"本季"}));
  }
  candidates = candidates.sort((a,b)=>b.gain-a.gain).slice(0,5);
  if(els.machineAdvice) els.machineAdvice.innerHTML = candidates.map(x=>`<div class="machine-card" data-action="detail" data-kind="item" data-id="${x.item.id}"><b>${x.item.emoji || "📦"} ${escapeHTML(x.item.name)} → ${escapeHTML(x.best.m)}</b><p>${x.source}优先级。约 ${x.best.p}G，较原价多 ${Math.max(0,x.gain)}G。</p></div>`).join("");
}
function findLibraryTopBySub(subId){
  return libraryTree.find(top => top.children.some(sub => sub.id === subId));
}
function getCurrentLibraryTop(){
  let top = libraryTree.find(item => item.id === state.libraryTop);
  if(!top && state.library){
    top = findLibraryTopBySub(state.library);
    if(top) state.libraryTop = top.id;
  }
  if(!top){
    top = libraryTree[0];
    state.libraryTop = top.id;
  }
  return top;
}
function getCurrentLibrarySub(){
  const top = getCurrentLibraryTop();
  let sub = top.children.find(item => item.id === state.library);
  if(!sub){
    sub = top.children[0];
    state.library = sub.id;
  }
  return sub;
}
function renderLibraryTabs(){
  const top = getCurrentLibraryTop();
  els.libraryTabs.innerHTML = libraryTree.map(item=>`<button class="tab ${item.id===top.id ? "active" : ""}" data-action="library-top" data-library-top="${item.id}">${item.label}</button>`).join("");
  els.librarySubTabs.innerHTML = top.children.map(item=>`<button class="tab ${item.id===state.library ? "active" : ""}" data-action="library" data-library="${item.id}">${item.label}</button>`).join("");
}
function renderCropCardsLibrary(sub){
  els.libraryContent.className = "";
  els.libraryContent.innerHTML = `<div class="library-context"><b>${escapeHTML(sub.label)}</b>：${escapeHTML(sub.logic)}</div><div class="crop-card-host" id="cropLibraryHost"></div>`;
  renderCropCardsInto(document.getElementById("cropLibraryHost"), "");
}
function renderLibraryContext(top, sub){
  return `<div class="library-context"><b>${escapeHTML(top.label)}</b>：${escapeHTML(top.logic)}<br><b>${escapeHTML(sub.label)}</b>：${escapeHTML(sub.logic || "")}</div>`;
}
function renderTaxonomySections(sub){
  const sections = sub.sections || [];
  if(!sections.length){
    return `<div class="notice">这个分区先作为结构入口保留，后续可以继续补完整资料卡。</div>`;
  }
  return `<div class="taxonomy-grid">${sections.map(sec=>{
    const badges = (sec.badges || []).map(b=>`<span class="taxonomy-badge">${escapeHTML(b)}</span>`).join("");
    const rows = (sec.rows || []).map(row=>`<div class="taxonomy-row"><span>${escapeHTML(row.k || "")}</span><b>${escapeHTML(row.v || "")}</b></div>`).join("");
    const items = (sec.items || []).map(item=>`<span class="taxonomy-pill">${escapeHTML(item)}</span>`).join("");
    return `<article class="taxonomy-card">
      <div class="taxonomy-head"><h3>${escapeHTML(sec.title)}</h3>${badges ? `<div class="taxonomy-badges">${badges}</div>` : ""}</div>
      ${sec.summary ? `<p class="taxonomy-summary">${escapeHTML(sec.summary)}</p>` : ""}
      ${rows ? `<div class="taxonomy-rows">${rows}</div>` : ""}
      ${items ? `<div class="taxonomy-list">${items}</div>` : ""}
      <div class="logic-note"><b>放这里的逻辑：</b>${escapeHTML(sec.logic || "")}</div>
    </article>`;
  }).join("")}</div>`;
}
function datasetForLibrarySub(sub){
  if(sub.data === "animal") return {items:DB.animal, kind:"item"};
  if(sub.data === "fish") return {items:DB.fish, kind:"item"};
  if(sub.data === "equipment") return {items:allEquipment, kind:"equipment"};
  if(sub.data === "npcs") return {items:allNPCs, kind:"npc"};
  if(sub.data === "mining") return {items:guides.mining, kind:"guide"};
  if(sub.data === "cooking") return {items:guides.cooking, kind:"guide"};
  return null;
}
function renderLibraryDataset(top, sub){
  const data = datasetForLibrarySub(sub);
  if(!data) return false;
  els.libraryContent.className = "";
  const cards = data.items.map(obj => data.kind === "item" ? renderMiniItem(obj) : renderGenericCard(obj, data.kind)).join("");
  els.libraryContent.innerHTML = renderLibraryContext(top, sub) + `<div class="card-list">${cards}</div>`;
  return true;
}
function renderLibrary(){
  renderLibraryTabs();
  const top = getCurrentLibraryTop();
  const sub = getCurrentLibrarySub();
  if(sub.mode === "cropCards"){
    renderCropCardsLibrary(sub);
    return;
  }
  if(renderLibraryDataset(top, sub)) return;
  els.libraryContent.className = "";
  els.libraryContent.innerHTML = renderLibraryContext(top, sub) + renderTaxonomySections(sub);
}
function findLibrarySub(subId){
  for(const top of libraryTree){
    const sub = top.children.find(item => item.id === subId);
    if(sub) return {top, sub};
  }
  return null;
}
function renderLibraryResultCard(result){
  return `<article class="item-card" data-action="open-library-sub" data-library-top="${result.top.id}" data-library="${result.sub.id}"><div class="item-title"><h3>${escapeHTML(result.top.label)} · ${escapeHTML(result.sub.label)}</h3><span class="badge blue">资料</span></div><p>${escapeHTML(result.sub.logic || result.top.logic || "")}</p></article>`;
}
function searchLibraryTree(q){
  const query = norm(q);
  if(!query) return [];
  const results = [];
  libraryTree.forEach(top => {
    top.children.forEach(sub => {
      const sectionText = (sub.sections || []).map(sec => [sec.title, sec.logic, ...(sec.items || [])].join(" ")).join(" ");
      const hay = [top.label, top.logic, sub.label, sub.logic, sectionText].join(" ").toLowerCase();
      if(hay.includes(query)){
        let score = 30;
        if(norm(sub.label).includes(query)) score += 60;
        if(norm(top.label).includes(query)) score += 25;
        results.push({top, sub, score});
      }
    });
  });
  return results.sort((a,b)=>b.score-a.score);
}
function renderChips(){
  if(els.chips) els.chips.innerHTML = "";
}
function openView(view){
  if(view === "planner") view = "today";
  state.view=view;
  document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));
  const viewEl = document.getElementById("view-"+view);
  if(viewEl) viewEl.classList.add("active");
  document.querySelectorAll(".nav-btn").forEach(b=>b.classList.toggle("active", b.dataset.view===view));
  saveState();
  if(view==="today"){renderToday();renderPlanner();}
  if(view==="bundles") renderBundles();
  if(view==="library") renderLibrary();
  updateSearchVisibility();
}
function setSearch(q){
  state.query=String(q || "").trim();
  els.search.value=state.query;
  saveState();
  renderSearch();
  window.scrollTo({top:0,behavior:"smooth"});
}
function submitSearch(){
  setSearch(els.search.value || "");
}
function syncInputs(){els.season.value=state.season;els.day.value=state.day;els.weather.value=state.weather;if(els.phase) els.phase.value=state.phase || "auto";els.search.value=state.query;syncResourceInputs()}
function init(){renderChips();syncInputs();renderResourceSelectors();renderToday();renderBundles();renderPlanner();renderLibrary();renderSearch();openView(state.view || "today");updateSearchVisibility()}

document.body.addEventListener("click", e=>{
  const target=e.target.closest("[data-action]");
  if(!target) return;
  const action=target.dataset.action;
  if(action==="open-view") openView(target.dataset.view);
  if(action==="detail") openDetail(target.dataset.kind,target.dataset.id);
  if(action==="search") setSearch(target.dataset.query || "");
  if(action==="close-search"){state.query="";els.search.value="";saveState();renderSearch();openView("today");window.scrollTo({top:0,behavior:"smooth"})}
  if(action==="back-to-action"){openView("today");window.scrollTo({top:0,behavior:"smooth"})}
  if(action==="close-detail"){closeDetail()}
  if(action==="toggle-resource-menu"){
    const picker = target.closest(".resource-picker");
    const wasOpen = picker?.classList.contains("open");
    closeResourceMenus();
    if(picker && !wasOpen) picker.classList.add("open");
  }
  if(action==="toggle-resource-option"){setResourceSelected(target.dataset.group, target.dataset.name, target.checked)}
  if(action==="filter-resource-options"){filterResourceOptions(target.dataset.group, target.value)}
  if(action==="remove-resource"){const name=target.dataset.name;const group=RESOURCE_NAME_TO_GROUP[name] || Object.keys(state.selectedResources||{}).find(k=>(state.selectedResources[k]||[]).includes(name)); if(group) setResourceSelected(group,name,false)}
  if(action==="resource-preset"){String(target.dataset.values||"").split(/[,，、\s]+/).filter(Boolean).forEach(addResourceByName);openView("today");renderResourceSelectors();renderPlanner();renderToday()}
  if(action==="clear-resources"){clearSelectedResources()}
  if(action==="add-resource"){addResourceByName(target.dataset.name || target.dataset.query || "");openView("today");renderResourceSelectors();renderPlanner();renderToday()}
  if(action==="fill-bag"){String(target.dataset.bag || "").split(/[\\s,，、。;；\\n]+/).filter(Boolean).forEach(addResourceByName);openView("today");renderPlanner();renderToday()}
  if(action==="library-top"){
    state.libraryTop = target.dataset.libraryTop;
    const top = libraryTree.find(item => item.id === state.libraryTop) || libraryTree[0];
    state.library = top.children[0].id;
    saveState();
    renderLibrary();
  }
  if(action==="library"){
    state.library=target.dataset.library;
    const found = findLibrarySub(state.library);
    if(found) state.libraryTop = found.top.id;
    saveState();
    renderLibrary();
  }
  if(action==="open-library-sub"){
    state.libraryTop = target.dataset.libraryTop;
    state.library = target.dataset.library;
    saveState();
    openView("library");
  }
  if(action==="toggle-action-done"){const key=target.dataset.key;actionDone[key]=!actionDone[key];safeStore.setItem("sdv_action_done_v1", JSON.stringify(actionDone));renderToday()}
  if(action==="toggle-bundle"){const key=target.dataset.key;bundleChecked[key]=!bundleChecked[key];safeStore.setItem("sdv_bundle_checked_v3", JSON.stringify(bundleChecked));renderBundles()}
});
document.addEventListener("click", e=>{if(!e.target.closest(".resource-picker")) closeResourceMenus()});
document.body.addEventListener("input", e=>{
  const target = e.target.closest("[data-action='filter-resource-options']");
  if(target) filterResourceOptions(target.dataset.group, target.value);
});
els.search.addEventListener("keydown", e=>{if(e.key === "Enter") submitSearch()});
if(els.submitSearch) els.submitSearch.addEventListener("click", submitSearch);
els.clearSearch.addEventListener("click",()=>{state.query="";els.search.value="";saveState();renderSearch()});
[els.season,els.day,els.weather,els.phase].filter(Boolean).forEach(el=>{el.addEventListener("change",()=>{state.season=els.season.value;state.day=Math.min(28,Math.max(1,Number(els.day.value||1)));state.weather=els.weather.value;state.phase=els.phase ? els.phase.value : "auto";saveState();renderToday();renderPlanner()})});
els.resetBundles.addEventListener("click",()=>{if(!confirm("确定要清空献祭勾选吗？")) return;bundleChecked={};safeStore.removeItem("sdv_bundle_checked_v3");renderBundles()});
if(els.bagInput) els.bagInput.addEventListener("input",e=>{state.inventory=e.target.value;state.resources={...(state.resources||{}),items:e.target.value};saveState();renderPlanner();renderToday()});
if(els.resourceInputs) els.resourceInputs.forEach(input=>{if(input.id==="bagInput") return; input.addEventListener("input",e=>{const key=e.target.dataset.resourceInput;state.resources={...(state.resources||{}),[key]:e.target.value};saveState();renderPlanner();renderToday()})});
if(els.analyzeBag) els.analyzeBag.addEventListener("click",()=>renderPlanner());
els.modalClose.addEventListener("click",closeDetail);
els.modal.addEventListener("click",e=>{if(e.target===els.modal) closeDetail()});
init();
</script>
</body>
</html>
