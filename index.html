<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星露谷物语 · 决策型全能攻略手册</title>
<style>
:root{
  --bg:#f8f2e0;
  --card:#fffcf5;
  --accent:#7a5c3a;
  --gold:#c99c2b;
  --green:#5b8c5a;
  --red:#b55b4a;
  --blue:#4a7b9c;
  --border:#d4b896;
  --shadow:0 4px 12px rgba(0,0,0,.06);
  --text:#3e3a35;
  --radius:14px;
  --font:system-ui,-apple-system,'Segoe UI',sans-serif;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font);
  line-height:1.5;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  background-image:
    radial-gradient(circle at 20% 30%,#f3e7cb 1px,transparent 1px),
    radial-gradient(circle at 80% 60%,#eddbb5 1px,transparent 1px);
  background-size:50px 50px;
}

header{
  background:linear-gradient(135deg,#5e3e1c,#8b5d34);
  color:#f7e9c3;
  padding:1.4rem 1.5rem;
  text-align:center;
  box-shadow:0 4px 12px rgba(0,0,0,.2);
  border-bottom:3px solid #c99c2b;
}

header h1{
  font-size:2rem;
  font-weight:800;
  letter-spacing:1px;
}

header p{
  font-size:.9rem;
  opacity:.9;
  margin-top:.2rem;
}

.container{
  width:100%;
  max-width:1300px;
  margin:0 auto;
  padding:.6rem 1.2rem;
  flex:1;
}

.search-wrapper{
  position:relative;
  max-width:680px;
  margin:-30px auto 1.5rem;
  z-index:10;
}

.search-wrapper input{
  width:100%;
  padding:.9rem 3.1rem .9rem 1.5rem;
  font-size:1.1rem;
  border:3px solid var(--border);
  border-radius:50px;
  background:#fff;
  box-shadow:var(--shadow);
  outline:none;
  font-family:var(--font);
  transition:.2s;
}

.search-wrapper input:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 4px rgba(122,92,58,.2);
}

.search-icon{
  position:absolute;
  right:20px;
  top:50%;
  transform:translateY(-50%);
  font-size:1.3rem;
  color:var(--accent);
}

.categories{
  display:flex;
  flex-wrap:wrap;
  gap:.5rem;
  justify-content:center;
  margin-bottom:1.2rem;
}

.category-btn{
  background:#fff;
  border:2px solid var(--border);
  padding:.5rem 1.1rem;
  border-radius:40px;
  font-weight:600;
  cursor:pointer;
  font-size:.85rem;
  transition:.2s;
  color:var(--accent);
  box-shadow:0 2px 6px rgba(0,0,0,.04);
  font-family:var(--font);
  display:flex;
  align-items:center;
  gap:4px;
}

.category-btn:hover,
.category-btn.active{
  background:var(--accent);
  color:white;
  border-color:var(--accent);
  transform:translateY(-2px);
}

.content-area{
  background:var(--card);
  border-radius:var(--radius);
  padding:1rem;
  box-shadow:var(--shadow);
  min-height:400px;
  border:1px solid #e8d8be;
}

.topic-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(170px,1fr));
  gap:.9rem;
}

.topic-card{
  background:#fff;
  border:1px solid #e0cfad;
  border-radius:14px;
  padding:1rem;
  text-align:center;
  font-weight:800;
  color:var(--accent);
  cursor:pointer;
  box-shadow:0 2px 8px rgba(0,0,0,.04);
  transition:.15s;
}

.topic-card:hover{
  transform:translateY(-2px);
  background:#f5ede0;
}

.topic-icon{
  display:block;
  font-size:2rem;
  margin-bottom:.4rem;
}

.season-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
  gap:1rem;
}

.season-block{
  background:#fff;
  border-radius:12px;
  padding:1rem;
  border:1px solid #e0cfad;
}

.season-block h3{
  font-size:1.1rem;
  margin-bottom:.6rem;
  color:var(--accent);
}

.crop-list{
  display:flex;
  flex-wrap:wrap;
  gap:.4rem;
}

.crop-link{
  background:#f5ede0;
  padding:.2rem .7rem;
  border-radius:12px;
  cursor:pointer;
  font-size:.9rem;
  font-weight:500;
  transition:.1s;
  border:1px solid transparent;
  display:inline-flex;
  align-items:center;
  gap:3px;
}

.crop-link:hover{
  background:var(--accent);
  color:white;
  border-color:var(--accent);
}

.crop-link.multi{
  font-style:italic;
  border-color:#c9ad7a;
}

.hot-tag{
  font-size:.65rem;
  background:#e0553d;
  color:white;
  padding:0 4px;
  border-radius:6px;
  margin-left:2px;
}

.search-result-item{
  background:white;
  border-radius:14px;
  padding:1.2rem;
  margin-bottom:1.5rem;
  box-shadow:0 4px 16px rgba(0,0,0,.05);
  border-left:5px solid var(--gold);
}

.item-header{
  display:flex;
  align-items:center;
  gap:.6rem;
  margin-bottom:.2rem;
  flex-wrap:wrap;
}

.item-name{
  font-size:1.7rem;
  font-weight:800;
  color:#3e2b14;
}

.item-type-badge{
  background:var(--accent);
  color:white;
  padding:.15rem .7rem;
  border-radius:20px;
  font-size:.8rem;
  font-weight:600;
}

.core-line{
  margin:.4rem 0 .7rem;
  color:#5d4d38;
  font-weight:700;
}

.decision-flow{
  background:#fdf9f2;
  border-radius:12px;
  padding:.9rem 1.1rem;
  margin:.7rem 0 .8rem;
  border:1px solid #e6d0b3;
}

.flow-step{
  margin-bottom:.65rem;
}

.flow-step:last-child{
  margin-bottom:0;
}

.flow-title{
  font-weight:800;
  font-size:.95rem;
  margin-bottom:.3rem;
  display:flex;
  align-items:center;
  gap:.4rem;
  color:#4b351d;
}

.flow-branch{
  margin-left:.6rem;
  border-left:2px dashed #d0b894;
  padding-left:.9rem;
}

.flow-line{
  padding:.2rem 0;
  font-size:.92rem;
  display:flex;
  align-items:baseline;
  gap:.3rem;
  flex-wrap:wrap;
}

.flow-line .arrow{
  color:#b08968;
}

.price-note{
  font-size:.75rem;
  color:#6b5e4f;
}

.quality-tag{
  font-size:.75rem;
  padding:.1rem .4rem;
  border-radius:6px;
  background:#e5d5bb;
  margin-left:.1rem;
}

.quality-tag.gold{
  background:#fbe5b3;
  color:#7a5800;
}

.link-like{
  color:var(--blue);
  text-decoration:underline;
  cursor:pointer;
  font-weight:600;
}

.info-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:.8rem;
  margin-top:.8rem;
}

.info-card{
  background:#faf6ee;
  border-radius:10px;
  padding:.7rem .8rem;
  border:1px solid #e0cfad;
}

.info-card h4{
  margin-bottom:.3rem;
  color:var(--accent);
  font-size:.9rem;
}

.side-note{
  background:#fff8e9;
  border-left:4px solid var(--gold);
  padding:.65rem .8rem;
  border-radius:10px;
  margin-top:.7rem;
  color:#6a5434;
}

table{
  width:100%;
  border-collapse:collapse;
  background:white;
  border-radius:10px;
  overflow:hidden;
  margin-top:.6rem;
}

th,td{
  border-bottom:1px solid #eadcc5;
  padding:.55rem;
  text-align:left;
  vertical-align:top;
}

th{
  background:#f4e7d1;
  color:#5d4325;
}

tr:last-child td{
  border-bottom:0;
}

footer{
  text-align:center;
  padding:1.2rem;
  color:#7b6e5a;
  font-size:.8rem;
  margin-top:1.5rem;
}

@media(max-width:600px){
  .item-name{font-size:1.4rem}
  header h1{font-size:1.6rem}
  .container{padding:.3rem}
  .content-area{padding:.7rem .5rem}
  .search-wrapper{margin:-24px .25rem 1.2rem}
  .categories{
    justify-content:flex-start;
    overflow-x:auto;
    flex-wrap:nowrap;
    padding-bottom:.2rem;
  }
  .category-btn{
    white-space:nowrap;
  }
}
</style>
</head>

function renderTopics(){
  const ts=[
    {n:"作物种植",i:"🌽",c:"crops"},
    {n:"畜牧产品",i:"🐄",c:"animal"},
    {n:"钓鱼蟹笼",i:"🎣",c:"fish"},
    {n:"矿场冲层",i:"⛏",c:"mining"},
    {n:"工匠设备",i:"🍷",c:"artisan"},
    {n:"献祭收集",i:"🎁",c:"bundles"},
    {n:"食谱料理",i:"🍳",c:"recipes"},
    {n:"NPC社交",i:"💬",c:"npcs"}
  ];
  return '<div class="topic-grid">'+ts.map(t=>`<div class="topic-card" data-category="${t.c}"><span class="topic-icon">${t.i}</span>${t.n}</div>`).join("")+'</div>';
}

function renderSeasonGrid(){
  const seasons=["春季","夏季","秋季"];
  let html='<div class="season-grid">';
  seasons.forEach(season=>{
    const crops=items.filter(i=>(i.type==="crop"||i.type==="flower")&&i.seasons?.includes(season));
    html+=`<div class="season-block"><h3>${season}</h3><div class="crop-list">`;
    crops.forEach(c=>{
      let cls="crop-link"+(c.multiSeason?" multi":"");
      html+=`<span class="${cls}" data-search="${c.name}">${c.name}${c.isHot?'<span class="hot-tag">🔥</span>':''}</span>`;
    });
    html+='</div></div>';
  });
  html+='</div>';
  return html;
}

function renderCatList(cat){
  if(cat==="all") return renderTopics();
  if(cat==="crops") return renderSeasonGrid();

  if(cat==="bundles"){
    return '<h2>🎁 献祭收集包</h2><div class="info-grid">'+bundles.map(b=>`<div class="info-card"><h4>${b.room} · ${b.name}</h4><p>${b.items}</p><p><b>奖励：</b>${b.reward}</p></div>`).join("")+'</div>';
  }

  if(cat==="recipes"){
    return '<h2>🍳 食谱</h2><div class="info-grid">'+recipes.map(r=>`<div class="info-card"><h4>${r.name}</h4><p><b>材料：</b>${r.ingredients}</p><p><b>来源：</b>${r.source}</p><p><b>效果：</b>${r.buff}</p></div>`).join("")+'</div>';
  }

  if(cat==="npcs"){
    return '<h2>💬 NPC 最爱</h2><div class="info-grid">'+npcs.map(n=>`<div class="info-card"><h4>${n.name}</h4><p>❤️ ${n.loves.join("、")}</p></div>`).join("")+'</div>';
  }

  if(cat==="mining"){
    return '<h2>⛏ 矿场行动卡</h2><div class="info-grid">'+guides.filter(g=>g.type==="mining").map(g=>`<div class="info-card"><h4>${g.name}</h4><p>${g.core}</p><ul>${g.steps.map(s=>`<li>${s}</li>`).join("")}</ul></div>`).join("")+'</div>';
  }

  const types=categoryMap[cat]||[];
  const filtered=items.filter(i=>types.includes(i.type));
  if(!filtered.length) return '<p>暂无数据。</p>';

  return `<h2>📋 列表</h2>
  <table>
    <tr><th>物品</th><th>定位</th><th>基础价</th></tr>
    ${filtered.map(i=>`<tr><td><span class="link-like" data-search="${i.name}">${i.name}</span></td><td>${i.core||"—"}</td><td>${i.basePrice?i.basePrice+"G":"—"}</td></tr>`).join("")}
  </table>`;
}

function buildFlow(item){
  if(item.machineInfo){
    const m=item.machineInfo;
    return `<div class="decision-flow">
      <div class="flow-step">
        <div class="flow-title">🧭 定位</div>
        <div class="flow-branch"><div class="flow-line">${m.core}</div></div>
      </div>
      <div class="flow-step">
        <div class="flow-title">🔧 做出来</div>
        <div class="flow-branch">
          <div class="flow-line"><span class="arrow">→</span> ${m.source}</div>
          <div class="flow-line"><span class="arrow">→</span> ${m.materials}</div>
        </div>
      </div>
      <div class="flow-step">
        <div class="flow-title">📦 产出</div>
        <div class="flow-branch">
          <div class="flow-line">${m.effect}</div>
          <div class="flow-line"><span class="price-note">${m.formula} · ${m.time}</span></div>
        </div>
      </div>
    </div>`;
  }

  let html='<div class="decision-flow">';

  if(item.sacrifices?.length){
    const groups={};
    item.sacrifices.forEach(s=>{
      if(!groups[s.room]) groups[s.room]=[];
      groups[s.room].push(s);
    });

    html+='<div class="flow-step"><div class="flow-title">🎯 先留 / 献祭</div><div class="flow-branch">';
    for(const [room,sacs] of Object.entries(groups)){
      sacs.forEach(s=>{
        const q=s.quality==="金星"
          ? ' <span class="quality-tag gold">金星</span>'
          : (s.quality ? ' <span class="quality-tag">'+s.quality+'</span>' : '');
        html+=`<div class="flow-line"><span class="arrow">→</span> <strong>${room}</strong> → ${s.bundle}：留 ${s.need} 个${q}</div>`;
      });
    }
    html+='</div></div>';
  }

  const mainProc=item.processing?.[0];
  if(mainProc){
    html+='<div class="flow-step"><div class="flow-title">⚡ 再处理</div><div class="flow-branch">';
    if(item.goldPrice){
      html+=`<div class="flow-line"><span class="arrow">→</span> ⭐金/铱星 → 直接卖 <span class="price-note">(${item.goldPrice}G起)</span></div>`;
    }
    html+=`<div class="flow-line"><span class="arrow">→</span> 普通/银星 → <span class="link-like" data-search="${mainProc.method}">${mainProc.method}</span> → <strong>${mainProc.product}</strong> <span class="price-note">${mainProc.price?`(${mainProc.price}G)`:""}</span></div>`;
    html+=`<div class="flow-line" style="margin-left:2rem;font-size:.85rem;">↳ 没机器？暂存；急用钱再卖</div>`;
    html+='</div></div>';
  }else if(item.basePrice){
    html+='<div class="flow-step"><div class="flow-title">⚡ 处理</div><div class="flow-branch"><div class="flow-line">不能加工或不建议加工：按用途保留，其他直接出售。</div></div></div>';
  }

  const liked=npcs.filter(n=>n.loves.includes(item.name)).map(n=>n.name);
  if(liked.length){
    html+=`<div class="flow-step"><div class="flow-title">💬 送礼</div><div class="flow-branch"><div class="flow-line">最爱：${liked.join("、")}</div></div></div>`;
  }

  html+='</div>';
  return html;
}

function renderResultItem(item){
  return `<div class="search-result-item">
    <div class="item-header">
      <span class="item-name">${item.name}</span>
      <span class="item-type-badge">${fmtType(item.type)}</span>
    </div>
    <div class="core-line">${item.core||""}</div>
    ${buildFlow(item)}
    ${item.processing?.length>1
      ? `<div class="side-note"><b>旁边看看：</b>${item.processing.slice(1).map(p=>`${p.method} → ${p.product}${p.price?`(${p.price}G)`:""}`).join("；")}</div>`
      : ""}
    <div class="info-grid">
      <div class="info-card">
        <h4>📅 基础</h4>
        <p>季节：${item.seasons?.join("、")||"—"}</p>
        ${item.growthDays?`<p>成熟：${item.growthDays}天</p>`:""}
        ${item.regrowDays?`<p>再收获：${item.regrowDays}天</p>`:""}
        ${item.basePrice?`<p>基础价：${item.basePrice}G</p>`:""}
      </div>
      ${item.machineInfo
        ? `<div class="info-card"><h4>🔧 设备细节</h4><p>${item.machineInfo.effect}</p><p>${item.machineInfo.formula}</p></div>`
        : ""}
    </div>
  </div>`;
}

function performSearch(q){
  if(!q.trim()) return renderCurrent();

  const kw=q.toLowerCase().trim();

  const itemRes=items.filter(i=>
    i.name.toLowerCase().includes(kw) ||
    i.core?.toLowerCase().includes(kw) ||
    i.aliases?.some(a=>a.toLowerCase().includes(kw)) ||
    i.tags?.some(t=>t.toLowerCase().includes(kw))
  );

  const recipeRes=recipes.filter(r=>
    r.name.includes(q) ||
    r.ingredients.includes(q) ||
    r.source.includes(q)
  );

  const guideRes=guides.filter(g=>
    g.name.includes(q) ||
    g.core.includes(q) ||
    g.steps.join("").includes(q)
  );

  let html="";

  if(itemRes.length){
    html+=itemRes.map(renderResultItem).join("");
  }

  if(recipeRes.length){
    html+='<h2>🍳 相关食谱</h2><div class="info-grid">'+recipeRes.map(r=>`
      <div class="info-card">
        <h4>${r.name}</h4>
        <p><b>材料：</b>${r.ingredients}</p>
        <p><b>来源：</b>${r.source}</p>
        <p><b>效果：</b>${r.buff}</p>
      </div>`).join("")+'</div>';
  }

  if(guideRes.length){
    html+='<h2>📌 相关行动卡</h2><div class="info-grid">'+guideRes.map(g=>`
      <div class="info-card">
        <h4>${g.name}</h4>
        <p>${g.core}</p>
        <ul>${g.steps.map(s=>`<li>${s}</li>`).join("")}</ul>
      </div>`).join("")+'</div>';
  }

  contentArea.innerHTML=html||'<p>😕 未找到</p>';
}

function renderCurrent(){
  if(searchQuery.trim()) performSearch(searchQuery);
  else contentArea.innerHTML=renderCatList(currentCat);
}

categoryBtns.forEach(b=>b.addEventListener("click",function(){
  categoryBtns.forEach(x=>x.classList.remove("active"));
  this.classList.add("active");
  currentCat=this.dataset.category;
  searchInput.value="";
  searchQuery="";
  renderCurrent();
}));

searchInput.addEventListener("input",function(){
  searchQuery=this.value;
  if(searchQuery.trim()){
    categoryBtns.forEach(b=>b.classList.remove("active"));
    document.querySelector('[data-category="all"]').classList.add("active");
    currentCat="all";
  }
  renderCurrent();
});

contentArea.addEventListener("click",function(e){
  const card=e.target.closest(".topic-card");
  if(card?.dataset.category){
    document.querySelector(`.category-btn[data-category="${card.dataset.category}"]`).click();
  }

  const link=e.target.closest("[data-search]");
  if(link){
    searchInput.value=link.dataset.search;
    searchQuery=link.dataset.search;
    renderCurrent();
    window.scrollTo({top:0,behavior:"smooth"});
  }
});

renderCurrent();
})();
</script>
</body>
</html>
