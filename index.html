<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>星露谷处理决策助手</title>

  <style>
    :root{
      --bg:#f6efe3;
      --card:#fffaf1;
      --white:#fff;
      --ink:#211b16;
      --muted:#756b5f;
      --line:#eadcc5;
      --soft:#f3e6d0;
      --green:#2f6b45;
      --green2:#4f8a5f;
      --blue:#3f73a8;
      --yellow:#b98428;
      --red:#b3544e;
      --purple:#7d5ca7;
      --shadow:0 16px 42px rgba(76,50,20,.13);
      --r:24px;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
      color:var(--ink);
      background:
        radial-gradient(circle at top left,rgba(255,255,255,.9),transparent 32%),
        linear-gradient(180deg,#fff9ee 0%,var(--bg) 55%,#efe5d4 100%);
      line-height:1.55;
    }

    button,input{
      font:inherit;
    }

    .app{
      max-width:1040px;
      margin:0 auto;
      padding:18px 16px 80px;
    }

    .top{
      position:sticky;
      top:0;
      z-index:20;
      padding:12px 0;
      backdrop-filter:blur(18px);
      background:rgba(246,239,227,.86);
      border-bottom:1px solid rgba(234,220,197,.75);
    }

    .top-inner{
      max-width:1040px;
      margin:auto;
      padding:0 16px;
      display:flex;
      gap:10px;
      align-items:center;
    }

    .logo{
      width:42px;
      height:42px;
      border-radius:15px;
      display:grid;
      place-items:center;
      background:#fff4d8;
      box-shadow:inset 0 0 0 1px var(--line);
      font-size:24px;
      flex:0 0 auto;
    }

    .search{
      flex:1;
      display:flex;
      align-items:center;
      gap:10px;
      background:white;
      border:1px solid var(--line);
      border-radius:999px;
      padding:12px 15px;
      box-shadow:0 8px 22px rgba(70,45,20,.08);
    }

    .search input{
      width:100%;
      border:0;
      outline:0;
      background:transparent;
      font-size:16px;
    }

    .hero{
      margin-top:16px;
      border-radius:32px;
      padding:24px;
      color:white;
      background:linear-gradient(135deg,#2f6b45,#9a7439);
      box-shadow:var(--shadow);
    }

    .hero small{
      display:block;
      letter-spacing:.18em;
      text-transform:uppercase;
      opacity:.82;
      font-weight:800;
      margin-bottom:8px;
    }

    .hero h1{
      margin:0 0 8px;
      font-size:32px;
      line-height:1.12;
    }

    .hero p{
      margin:0;
      opacity:.92;
      max-width:760px;
    }

    .quick{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      margin-top:14px;
    }

    .quick button{
      border:1px solid rgba(255,255,255,.45);
      background:rgba(255,255,255,.14);
      color:white;
      padding:8px 12px;
      border-radius:999px;
      cursor:pointer;
    }

    .layout{
      display:grid;
      grid-template-columns:1fr 300px;
      gap:18px;
      margin-top:18px;
    }

    .main{
      display:grid;
      gap:16px;
    }

    .side{
      display:grid;
      gap:14px;
      align-self:start;
      position:sticky;
      top:82px;
    }

    .panel{
      background:rgba(255,250,241,.92);
      border:1px solid var(--line);
      border-radius:var(--r);
      box-shadow:var(--shadow);
      overflow:hidden;
    }

    .panel-head{
      padding:16px 18px;
      border-bottom:1px solid var(--line);
      display:flex;
      justify-content:space-between;
      gap:12px;
      align-items:center;
    }

    .panel-head h2{
      margin:0;
      font-size:20px;
    }

    .panel-body{
      padding:18px;
    }

    .backbar{
      display:flex;
      align-items:center;
      gap:10px;
      margin-bottom:12px;
    }

    .backbtn{
      border:1px solid var(--line);
      background:white;
      color:var(--ink);
      border-radius:999px;
      padding:8px 12px;
      cursor:pointer;
      box-shadow:0 6px 16px rgba(70,45,20,.06);
    }

    .answer-card{
      background:linear-gradient(135deg,#ffffff,#fff3da);
      border:1px solid var(--line);
      border-radius:28px;
      padding:20px;
      box-shadow:0 12px 28px rgba(75,50,20,.08);
    }

    .entity-title{
      display:flex;
      align-items:center;
      gap:14px;
      margin-bottom:16px;
    }

    .icon{
      width:68px;
      height:68px;
      border-radius:21px;
      background:#f2e2c8;
      border:1px solid var(--line);
      display:grid;
      place-items:center;
      font-size:36px;
      overflow:hidden;
      flex:0 0 auto;
    }

    .icon img{
      width:100%;
      height:100%;
      object-fit:contain;
      padding:8px;
    }

    .entity-title h2{
      margin:0;
      font-size:30px;
      line-height:1.1;
    }

    .meta{
      color:var(--muted);
      font-size:14px;
      margin-top:3px;
    }

    .conclusion{
      border-radius:22px;
      background:linear-gradient(135deg,var(--green),var(--green2));
      color:white;
      padding:18px;
      margin-top:12px;
    }

    .conclusion strong{
      display:block;
      opacity:.84;
      font-size:13px;
      margin-bottom:6px;
    }

    .conclusion h3{
      margin:0;
      font-size:24px;
      line-height:1.22;
    }

    .conclusion p{
      margin:8px 0 0;
      opacity:.92;
    }

    .flow{
      display:grid;
      gap:14px;
    }

    .flow-step{
      background:white;
      border:1px solid var(--line);
      border-radius:24px;
      padding:16px;
      display:grid;
      grid-template-columns:46px 1fr;
      gap:14px;
    }

    .step-num{
      width:40px;
      height:40px;
      border-radius:50%;
      display:grid;
      place-items:center;
      color:white;
      background:var(--green);
      font-weight:900;
      font-size:18px;
    }

    .flow-step:nth-child(2) .step-num{background:var(--blue)}
    .flow-step:nth-child(3) .step-num{background:var(--yellow)}
    .flow-step:nth-child(4) .step-num{background:var(--red)}

    .step-main h3{
      margin:0 0 6px;
      font-size:20px;
      line-height:1.28;
    }

    .step-main p{
      margin:0 0 10px;
      color:var(--muted);
    }

    .step-block{
      border-radius:18px;
      background:#fff8ea;
      border:1px solid #efdfc4;
      padding:12px;
      margin-top:10px;
    }

    .step-block h4{
      margin:0 0 8px;
      font-size:15px;
      color:#5f4a2c;
    }

    .step-block ul{
      margin:0;
      padding-left:20px;
    }

    .chips{
      display:flex;
      flex-wrap:wrap;
      gap:7px;
      margin-top:10px;
    }

    .chip{
      border:1px solid var(--line);
      background:#fff7e7;
      color:#5f4f3c;
      border-radius:999px;
      padding:6px 9px;
      font-size:13px;
      cursor:pointer;
    }

    .chip.blue{
      background:#e8f1fb;
      color:#345c81;
      border-color:#d4e3f2;
    }

    .chip.green{
      background:#e7f3ea;
      color:#2f6b45;
      border-color:#d3e8d8;
    }

    .chip.red{
      background:#fae8e5;
      color:#934943;
      border-color:#efcfca;
    }

    .mini-note{
      margin-top:12px;
      border-left:4px solid var(--yellow);
      background:#fff6df;
      border-radius:16px;
      padding:12px;
      color:#6d5630;
    }

    .machine-inline{
      border-radius:18px;
      background:#f8efe0;
      border:1px solid #ead8b8;
      padding:12px;
      margin-top:10px;
    }

    .machine-inline h4{
      margin:0 0 6px;
      font-size:16px;
    }

    .machine-inline p{
      margin:4px 0;
      color:var(--muted);
    }

    .materials{
      display:flex;
      flex-wrap:wrap;
      gap:6px;
      margin-top:8px;
    }

    .material{
      background:#eadcc5;
      border-radius:999px;
      padding:5px 8px;
      font-size:13px;
      color:#4e4031;
    }

    .path{
      display:grid;
      gap:6px;
      margin-top:8px;
    }

    .path-line{
      background:#fff;
      border:1px solid var(--line);
      border-radius:16px;
      padding:10px 12px;
      color:#5f4f3c;
    }

    .path-line b{
      color:var(--ink);
    }

    details{
      border:1px solid var(--line);
      background:white;
      border-radius:18px;
      padding:0;
      overflow:hidden;
    }

    details + details{
      margin-top:10px;
    }

    summary{
      cursor:pointer;
      padding:14px 16px;
      font-weight:900;
      background:#fff7e8;
    }

    .detail-body{
      padding:14px 16px;
      color:var(--muted);
      border-top:1px solid var(--line);
    }

    .result-list{
      display:grid;
      gap:10px;
    }

    .result{
      border:1px solid var(--line);
      background:white;
      border-radius:18px;
      padding:12px;
      cursor:pointer;
      display:flex;
      gap:12px;
      align-items:center;
    }

    .mini-icon{
      width:42px;
      height:42px;
      border-radius:14px;
      background:#f0e1c9;
      display:grid;
      place-items:center;
      font-size:23px;
      flex:0 0 auto;
    }

    .result h3{
      margin:0;
      font-size:16px;
    }

    .result p{
      margin:2px 0 0;
      color:var(--muted);
      font-size:13px;
    }

    .problem-buttons{
      display:grid;
      gap:9px;
    }

    .problem-buttons button{
      text-align:left;
      border:1px solid var(--line);
      background:white;
      border-radius:16px;
      padding:12px;
      cursor:pointer;
    }

    .empty{
      padding:28px;
      text-align:center;
      color:var(--muted);
    }

    @media(max-width:860px){
      .layout{
        grid-template-columns:1fr;
      }

      .side{
        position:static;
      }

      .hero{
        padding:22px;
      }

      .hero h1{
        font-size:28px;
      }

      .flow-step{
        grid-template-columns:40px 1fr;
        padding:14px;
      }

      .entity-title h2{
        font-size:26px;
      }
    }
  </style>
</head>

<body>
  <header class="top">
    <div class="top-inner">
      <div class="logo">🌾</div>
      <label class="search">
        <span>🔎</span>
        <input id="search" type="search" placeholder="搜：玉米 / 南瓜 / 罐头瓶 / 蜂蜜 / 小桶">
      </label>
    </div>
  </header>

  <main class="app">
    <section class="hero">
      <small>Stardew Decision Helper</small>
      <h1>搜一个东西，直接看怎么处理</h1>
      <p>先给行动流程，再给设备、献祭路径和补充信息。少翻页，少拼图。</p>
      <div class="quick">
        <button data-search="玉米">🌽 玉米</button>
        <button data-search="南瓜">🎃 南瓜</button>
        <button data-search="蜂蜜">🍯 蜂蜜</button>
        <button data-search="罐头瓶">🛢️ 罐头瓶</button>
        <button data-search="小桶">🍷 小桶</button>
      </div>
    </section>

    <div class="layout">
      <section class="main">
        <div id="answer"></div>

        <section class="panel">
          <div class="panel-head">
            <h2>相关结果</h2>
            <span id="count" class="meta"></span>
          </div>
          <div class="panel-body">
            <div id="results" class="result-list"></div>
            <div id="empty" class="empty" hidden>没搜到。换个关键词，或者继续补数据。</div>
          </div>
        </section>
      </section>

      <aside class="side">
        <section class="panel">
          <div class="panel-head">
            <h2>常见问题</h2>
          </div>
          <div class="panel-body problem-buttons">
            <button data-search="玉米">我拿到玉米后该留还是加工？</button>
            <button data-search="罐头瓶">哪些东西适合进罐头瓶？</button>
            <button data-search="蜂蜜">蜂蜜要不要放小桶？</button>
            <button data-search="南瓜">南瓜应该腌制还是榨汁？</button>
            <button data-search="小桶">小桶优先给谁用？</button>
          </div>
        </section>

        <section class="panel">
          <div class="panel-head">
            <h2>当前版本</h2>
          </div>
          <div class="panel-body">
            <p class="meta">重点先做“作物怎么处理”。后面再继续补 NPC、地图、矿场和食谱。</p>
          </div>
        </section>
      </aside>
    </div>
  </main>

  <script>
    const DATA = {
      corn: {
        id:"corn",
        name:"玉米",
        type:"作物",
        icon:"🌽",
        image:"assets/items/corn.png",
        aliases:["玉米种子","Corn"],
        summary:"夏秋两季连续收获作物。基础价低，产量稳定，优先留献祭，再用罐头瓶处理。",
        conclusion:"先留够献祭和金星需求，多余普通品质进罐头瓶。没有罐头瓶时，金星和铱星可以直接卖，普通品质可以暂存。",
        steps:[
          {
            title:"先留够",
            reason:"错过秋季后再补会很麻烦，第一年尤其要先留。",
            blocks:[
              {
                title:"要留什么",
                items:[
                  "玉米 x1",
                  "金星玉米 x5"
                ]
              },
              {
                title:"具体交到哪里",
                paths:[
                  "社区中心 → 茶水间 → 秋季作物收集包 → 玉米 x1",
                  "社区中心 → 茶水间 → 高品质作物收集包 → 金星玉米 x5"
                ]
              }
            ],
            chips:[
              ["蓝色","献祭优先"],
              ["绿色","第一年重要"]
            ]
          },
          {
            title:"多余普通品质进罐头瓶",
            reason:"玉米基础售价低，罐头瓶公式更适合。普通品质加工更划算，因为加工不吃星级。",
            machine:"preservesJar",
            blocks:[
              {
                title:"处理结果",
                items:[
                  "玉米 → 腌玉米",
                  "收益约 150g",
                  "耗时约 2-3 天"

              }
            ],
            chips:[
              ["绿色","推荐"],
              ["蓝色","普通品质优先"]
            ]
          },
          {
            title:"没有罐头瓶时先直接卖或暂存",
            reason:"前期现金流很重要。机器不够时，不要为了理论收益卡住自己。",
            blocks:[
              {
                title:"怎么判断",
                items:[
                  "金星 / 铱星：可以直接卖",

              }
            ],
            chips:[
              ["黄色","过渡方案"]

          }
        ],
        tip:"不用优先小桶。小桶更适合杨桃、远古果实、甜瓜这类高基础价作物。",
        machines:["preservesJar","oilMaker"],
        bundles:[
          "社区中心 → 茶水间 → 秋季作物收集包 → 玉米 x1",
          "社区中心 → 茶水间 → 高品质作物收集包 → 金星玉米 x5"

        recipes:["墨西哥薄饼：玉米 x1"],

          ["基础售价","普通 50g，银星 62g，金星 75g，铱星 100g"],
          ["来源","皮埃尔杂货店购买种子，农场种植"]
        ],
        tags:["玉米","夏季","秋季","罐头瓶","产油机","献祭","食谱"]
      },

      pumpkin: {
        id:"pumpkin",
        name:"南瓜",
        type:"作物",

        summary:"秋季高价值作物。先留献祭和金星需求，多余的优先罐头瓶，也可小桶榨汁。",
        conclusion:"先留秋季作物包和高品质作物包需要的南瓜，再处理多余的。普通品质优先进罐头瓶，小桶榨汁也可作为次选。",
        steps:[
          {
            title:"先留献祭和金星需求",
            reason:"南瓜同时关系秋季作物收集包和高品质作物收集包。",
            blocks:[
              {
                title:"要留什么",
                items:[
                  "南瓜 x1",
                  "金星南瓜 x5"

              },
              {
                title:"具体交到哪里",
                paths:[
                  "社区中心 → 茶水间 → 秋季作物收集包 → 南瓜 x1",
                  "社区中心 → 茶水间 → 高品质作物收集包 → 金星南瓜 x5"

              }
            ],
            chips:[
              ["蓝色","献祭优先"]

          },
          {

            blocks:[

              }
            ],
            chips:[
              ["绿色","推荐"]
            ]
          },
          {
            title:"罐头瓶不足时用小桶",
            reason:"南瓜基础价高，小桶榨汁收益也不错。",

            blocks:[
              {
                title:"处理结果",
                items:[

            chips:[

          ["基础售价","普通 320g"],
          ["来源","秋季购买种子，农场种植"]

        tags:["南瓜","秋季","罐头瓶","小桶","献祭","食谱"]
      },

      honey: {
        id:"honey",
        name:"蜂蜜",
        type:"工匠品",
        icon:"🍯",

        steps:[
          {
            title:"先判断是不是高价花蜜",
            reason:"蜂蜜进小桶后会统一变成蜂蜜酒，高价花蜜会亏。",
            blocks:[
              {
                title:"直接卖",
                items:[
                  "仙女玫瑰蜂蜜",
                  "罂粟蜂蜜",
                  "其他售价高于蜂蜜酒的花蜜"
                ]
              }
            ],
            chips:[
              ["绿色","推荐"],
              ["红色","别酿"]
            ]
          },
          {
            title:"普通蜂蜜再考虑小桶",
            reason:"野生蜂蜜基础价低，酿成蜂蜜酒更划算。",
            machine:"keg",
            blocks:[
              {
                title:"处理结果",
                items:[
                  "普通蜂蜜 → 蜂蜜酒",
                  "蜂蜜酒约 200g"
                ]
              }
            ],
            chips:[
              ["黄色","看机器空闲"]

    const searchInput = document.getElementById("search");
    const answer = document.getElementById("answer");
    const results = document.getElementById("results");
    const empty = document.getElementById("empty");
    const count = document.getElementById("count");

    const entities = Object.values(DATA);
    let currentId = null;
    let viewStack = [];

    function norm(v){
      return String(v || "").toLowerCase().replace(/\s+/g,"");
    }

    function blob(e){
      return norm(JSON.stringify(e));
    }

    function score(e,q){
      if(!q) return 1;

      const n = norm(e.name);
      const a = norm((e.aliases || []).join(""));
      const t = norm((e.tags || []).join(""));
      const b = blob(e);
      const query = norm(q);

      let s = 0;
      if(n === query) s += 1000;
      if(n.includes(query)) s += 600;
      if(a.includes(query)) s += 420;
      if(t.includes(query)) s += 280;
      if(b.includes(query)) s += 120;

      return s;
    }

    function findResults(q){
      return entities
        .map(e => ({...e, _score:score(e,q)}))
        .filter(e => !q || e._score > 0)
        .sort((a,b) => b._score - a._score || a.name.localeCompare(b.name,"zh-Hans-CN"));
    }

    function imgOrIcon(e, big=false){
      const cls = big ? "icon" : "mini-icon";
      if(!e.image) return `<div class="${cls}">${e.icon || "📦"}</div>`;

      return `
        <div class="${cls}">
          <img src="${e.image}" alt="${e.name}" onerror="this.remove();this.parentElement.textContent='${e.icon || "📦"}';">
        </div>
      `;
    }

    function getMachineHtml(id){
      const m = DATA[id];
      if(!m) return "";

      const craft = m.craft;

      return `
        <div class="machine-inline">
          <h4>${m.icon || "⚙️"} ${m.name}</h4>
          <p>${m.summary || ""}</p>
          ${craft ? `
            <p><b>解锁：</b>${craft.source}</p>
            <div class="materials">
              ${(craft.materials || []).map(x => `<span class="material">${x[0]} x${x[1]}</span>`).join("")}
            </div>
          ` : ""}
          <div class="chips">
            <button class="chip" data-open="${m.id}">查看 ${m.name}</button>
          </div>
        </div>
      `;
    }

    function renderStep(step,index){
      return `
        <article class="flow-step">
          <div class="step-num">${index + 1}</div>
          <div class="step-main">
            <h3>${step.title}</h3>
            <p>${step.reason || ""}</p>

            ${(step.blocks || []).map(block => `
              <div class="step-block">
                <h4>${block.title}</h4>

                ${block.items ? `
                  <ul>
                    ${block.items.map(item => `<li>${item}</li>`).join("")}
                  </ul>
                ` : ""}

                ${block.paths ? `
                  <div class="path">
                    ${block.paths.map(path => {
                      const parts = path.split("→").map(x => x.trim());
                      const last = parts.pop();
                      return `<div class="path-line">${parts.join(" → ")} → <b>${last}</b></div>`;
                    }).join("")}
                  </div>
                ` : ""}
              </div>
            `).join("")}

            ${step.machine ? getMachineHtml(step.machine) : ""}

            ${step.chips ? `
              <div class="chips">
                ${step.chips.map(([type,text]) => {
                  const cls = type === "绿色" ? "green" : type === "蓝色" ? "blue" : type === "红色" ? "red" : "";
                  return `<span class="chip ${cls}">${text}</span>`;
                }).join("")}
              </div>
            ` : ""}
          </div>
        </article>
      `;
    }

    function renderAnswer(e, options={}){
      if(!e){
        currentId = null;
        answer.innerHTML = `
          <section class="panel">
            <div class="panel-body">
              <div class="answer-card">
                <div class="entity-title">
                  <div class="icon">🌾</div>
                  <div>
                    <h2>先搜一个东西</h2>
                    <div class="meta">比如：玉米、南瓜、蜂蜜、罐头瓶、小桶。</div>
                  </div>
                </div>

                <div class="conclusion">
                  <strong>这个网站怎么用</strong>
                  <h3>搜到东西后，先看处理流程</h3>
                  <p>它会按行动顺序告诉你先留什么、再加工什么、设备怎么做、哪里交。</p>
                </div>
              </div>
            </div>
          </section>
        `;
        return;
      }

      currentId = e.id;

      answer.innerHTML = `
        <section class="panel">
          <div class="panel-body">
            ${viewStack.length ? `
              <div class="backbar">
                <button class="backbtn" id="backBtn">← 返回 ${DATA[viewStack[viewStack.length - 1]]?.name || "上一页"}</button>
              </div>
            ` : ""}

            <article class="answer-card">
              <div class="entity-title">
                ${imgOrIcon(e,true)}
                <div>
                  <h2>${e.name}</h2>
                  <div class="meta">${e.type} · ${e.summary}</div>
                </div>
              </div>

              <div class="conclusion">
                <strong>处理结论</strong>
                <h3>${e.name}怎么处理？</h3>
                <p>${e.conclusion || "暂无处理结论。"}</p>
              </div>
            </article>
          </div>
        </section>

        <section class="panel">
          <div class="panel-head">
            <h2>${e.name}处理流程</h2>
          </div>
          <div class="panel-body flow">
            ${(e.steps || []).map((step,index) => renderStep(step,index)).join("")}

            ${e.tip ? `
              <div class="mini-note">
                <b>小提示：</b>${e.tip}
              </div>
            ` : ""}
          </div>
        </section>

        <section class="panel">
          <div class="panel-head">
            <h2>补充信息</h2>
          </div>
          <div class="panel-body">
            ${renderDetails(e)}
          </div>
        </section>
      `;

      const backBtn = document.getElementById("backBtn");
      if(backBtn){
        backBtn.addEventListener("click",()=>{
          const lastId = viewStack.pop();
          const last = DATA[lastId];
          if(last){
            searchInput.value = last.name;
            renderAnswer(last);
            renderResults(findResults(last.name));
            window.scrollTo({top:0,behavior:"smooth"});
          }
        });
      }

      bindOpenButtons();
      bindSearchButtons();

      if(options.scroll !== false){
        window.scrollTo({top:0,behavior:"smooth"});
      }
    }

    function renderDetails(e){
      return `
        <details open>
          <summary>基础数据</summary>
          <div class="detail-body">
            ${(e.details || []).map(row => `<p><b>${row[0]}：</b>${row[1]}</p>`).join("") || "暂无"}
          </div>
        </details>

        <details>
          <summary>献祭 / 留存</summary>
          <div class="detail-body">
            ${(e.bundles || []).map(x => `<p>• ${x}</p>`).join("") || "暂无"}
          </div>
        </details>

        <details>
          <summary>食谱用途</summary>
          <div class="detail-body">
            ${(e.recipes || []).map(x => `<p>• ${x}</p>`).join("") || "暂无"}
          </div>
        </details>

        <details>
          <summary>关键词</summary>
          <div class="detail-body">
            <div class="chips">
              ${(e.tags || []).map(t => `<button class="chip" data-search="${t}">${t}</button>`).join("")}
            </div>
          </div>
        </details>
      `;
    }

    function renderResults(list){
      count.textContent = `${list.length} 条`;

      results.innerHTML = list.map(e => `
        <div class="result" data-open="${e.id}">
          ${imgOrIcon(e,false)}
          <div>
            <h3>${e.name}</h3>
            <p>${e.type} · ${e.conclusion || e.summary}</p>
          </div>
        </div>
      `).join("");

      empty.hidden = list.length !== 0;
      bindOpenButtons();
    }

    function openEntity(id, fromClick=true){
      const entity = DATA[id];
      if(!entity) return;

      if(fromClick && currentId && currentId !== id){
        viewStack.push(currentId);
      }

      searchInput.value = entity.name;
      renderAnswer(entity);
      renderResults(findResults(entity.name));
    }

    function update(){
      const q = searchInput.value.trim();
      const list = findResults(q);

      viewStack = [];

      if(q && list.length){
        renderAnswer(list[0], {scroll:false});
      }else if(!q){
        renderAnswer(null);
      }else{
        currentId = null;
        answer.innerHTML = "";
      }

      renderResults(list);
      bindSearchButtons();
    }

    function bindOpenButtons(){
      document.querySelectorAll("[data-open]").forEach(el=>{
        el.onclick = () => openEntity(el.dataset.open, true);
      });
    }

    function bindSearchButtons(){
      document.querySelectorAll("[data-search]").forEach(btn=>{
        btn.onclick = () => {
          searchInput.value = btn.dataset.search;
          update();
          window.scrollTo({top:0,behavior:"smooth"});
        };
      });
    }

    searchInput.addEventListener("input",update);

    bindSearchButtons();
    update();
  </script>
