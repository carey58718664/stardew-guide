        * { margin:0; padding:0; box-sizing:border-box; }

        .search-wrapper input { width: 100%; padding: 0.8rem 1.4rem; font-size: 1.1rem; border: 3px solid var(--border); border-radius: 50px; background: white; box-shadow: var(--shadow); outline: none; font-family: var(--font); }
        .search-wrapper input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(122,92,58,0.2); }
        .back-button-wrapper { display: flex; justify-content: flex-start; max-width: 1400px; margin: 0 auto 0.5rem auto; padding: 0 1rem; }
        .back-button { background: var(--accent); color: white; border: none; padding: 0.5rem 1.2rem; border-radius: 30px; cursor: pointer; font-weight: 600; font-size: 0.9rem; font-family: var(--font); box-shadow: 0 2px 6px rgba(0,0,0,0.1); display: none; align-items: center; gap: 4px; }
        .back-button.show { display: inline-flex; }
        .categories { display: flex; flex-wrap: wrap; gap: 0.4rem; justify-content: center; margin-bottom: 1rem; }
        .category-btn { background: white; border: 2px solid var(--border); padding: 0.4rem 1rem; border-radius: 30px; font-weight: 600; cursor: pointer; font-size: 0.85rem; transition: all 0.2s; color: var(--accent); box-shadow: 0 2px 6px rgba(0,0,0,0.04); font-family: var(--font); display: flex; align-items: center; gap: 4px; }
        .category-btn:hover, .category-btn.active { background: var(--accent); color: white; border-color: var(--accent); transform: translateY(-2px); }
        .content-area { background: var(--card); border-radius: var(--radius); padding: 1rem; box-shadow: var(--shadow); min-height: 400px; border: 1px solid #e8d8be; }
        .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1rem; }
        .item-card { background: white; border-radius: 12px; padding: 1rem; border: 1px solid #e0cfad; transition: 0.2s; }
        .item-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.1); }
        .item-card h3 { font-size: 1.1rem; color: var(--accent); margin-bottom: 0.3rem; display: flex; align-items: center; gap: 0.4rem; flex-wrap: wrap; }
        .badge { font-size: 0.65rem; background: var(--accent); color: white; padding: 0.1rem 0.6rem; border-radius: 12px; font-weight: 600; }
        .badge.season { background: #6b8c42; }
        .badge.hot { background: var(--red); animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.7;} }
        .meta { font-size: 0.85rem; color: #5f5545; margin: 0.2rem 0; }
        .section-title { font-weight: 700; color: var(--accent); margin-top: 0.8rem; border-bottom: 1px dashed var(--border); padding-bottom: 0.2rem; display: block; }
        .sacrifice-item, .gift-item, .priority-item { font-size: 0.88rem; padding: 0.15rem 0; display: flex; align-items: baseline; }
        .prefix { display: inline-block; width: 2.2em; text-align: left; flex-shrink: 0; }
        .prio { font-weight: 700; }
        .note { font-size: 0.8rem; color: #8a7a62; margin-top: 0.3rem; font-style: italic; }
        .link-inline { color: var(--blue); cursor: pointer; text-decoration: underline; margin: 0 0.2rem; font-weight: 500; transition: 0.2s; }
        .link-inline:visited { color: #5b4a7a; }
        .link-inline:hover { color: #2d5a7a; }
        .static-page { padding: 1rem; line-height: 1.7; }
        .tree { font-family: monospace; font-size: 0.85rem; line-height: 1.6; white-space: pre-wrap; margin: 0.5rem 0; }
        .step-list { padding-left: 1.2rem; margin: 0.5rem 0; }
        .step-list li { margin-bottom: 0.4rem; }
        footer { text-align: center; padding: 1rem; color: #7b6e5a; font-size: 0.8rem; margin-top: 1rem; }
        @media (max-width: 600px) { .card-grid { grid-template-columns: 1fr; } }
    </style>

        // ==================== 核心渲染 ====================
        let currentCategory = 'all';
        const contentArea = document.getElementById('contentArea');
        const searchInput = document.getElementById('searchInput');
        const categoryNav = document.getElementById('categoryNav');
        const backButton = document.getElementById('backButton');

        function getItemsByCategory(cat) {
            switch(cat) {
                case 'all': return allItems;
                case 'fish': return DB.fish;
                case 'crops': return DB.crops_all;
                case 'animal': return DB.animal;
                case 'foraging': return DB.foraging;
                default: return [];
            }
        }

        function renderCard(item) {
            let s = '';
            if (item.sacrifices) {
                s += '<span class="section-title">🎁 献祭需求</span>';
                item.sacrifices.forEach(sc => s += `<div class="sacrifice-item"><span class="prefix">📦</span>${sc.room} → <span class="link-inline" onclick='jumpTo("bundles","#")'>${sc.bundle}</span>${sc.need ? ` ×${sc.need}` : ''}${sc.quality ? ` (${sc.quality})` : ''}</div>`);
            }
            if (item.processing) {
                s += '<span class="section-title">⚙️ 加工建议（优先级从高到低）</span>';
                item.processing.forEach((p,i) => {
                    const eqLink = p.eq ? `<span class="link-inline" onclick='jumpTo("artisan","${p.eq}")'>[${equipmentDB[p.eq]?.name||'设备'}]</span>` : '';
                    s += `<div class="priority-item"><span class="prefix"><span class="prio">P${i+1}</span></span> ${p.m}${p.p ? ` (${p.p}G)` : ''} ${eqLink}</div>`;
                });
            }
            if (item.gifts) {
                s += '<span class="section-title">❤️ 送礼推荐</span>';
                item.gifts.forEach(g => s += `<div class="gift-item"><span class="prefix">🛍️</span><span class="link-inline" onclick='jumpTo("npcs","${g}")'>${npcDB[g]?.name||g}</span></div>`);
            }
            if (item.source) s += `<div class="meta">🏠 来源：${item.source}</div>`;
            if (item.note) s += `<div class="note">💡 ${item.note}</div>`;
            return s;
        }

        function renderContent(cat, term) {
            backButton.classList.toggle('show', cat !== 'all');
            if (cat === 'bundles') { contentArea.innerHTML = bundlesGuide; return; }
            if (cat === 'cooking') { contentArea.innerHTML = cookingGuide; return; }
            if (cat === 'mining') { contentArea.innerHTML = miningGuide; return; }
            if (cat === 'ginger_island') { contentArea.innerHTML = gingerIslandGuide; return; }
            if (cat === 'artisan') {
                let h = '<div class="card-grid">';
                for (let e of Object.values(equipmentDB)) {
                    h += `<div class="item-card" id="card-${e.id}"><h3>${e.name} <span class="badge">工匠设备</span></h3><div class="meta">📜 ${e.source}</div><div class="meta">🔧 ${e.recipe}</div><p>${e.desc}</p></div>`;
                }
                contentArea.innerHTML = h + '</div>'; return;
            }
            if (cat === 'construction') {
                let h = '<div class="card-grid">';
                for (let b of buildingDB) {
                    h += `<div class="item-card" id="card-${b.id}"><h3>${b.name} <span class="badge">${b.type}</span></h3><div class="meta">📍 ${b.source}</div><div class="meta">💰 ${b.cost}</div><p>${b.desc}</p></div>`;
                }
                contentArea.innerHTML = h + '</div>'; return;
            }
            if (cat === 'npcs') {
                let h = '<div class="card-grid">';
                for (let n of Object.values(npcDB)) {
                    h += `<div class="item-card" id="card-${n.id}"><h3>${n.name}</h3><div class="meta">❤️ 最爱礼物: ${n.loves}</div><p>📍 日程位置: ${n.schedule}</p></div>`;
                }
                contentArea.innerHTML = h + '</div>'; return;
            }

            let items = getItemsByCategory(cat);
            if (term) items = items.filter(i => i.name.includes(term) || (i.location||'').includes(term) || (i.type||'').includes(term));
            if (!items.length) { contentArea.innerHTML = '<p style="text-align:center;padding:2rem;">无结果</p>'; return; }
            let h = '<div class="card-grid">';
            items.forEach(i => {
                const dynamicHot = i.hot || isHotItem(i.id);
                const hotTag = dynamicHot ? '<span class="badge hot">HOT</span>' : '';
                h += `<div class="item-card" id="card-${i.id}"><h3>${i.name} <span class="badge">${i.type}</span>${hotTag}${i.season?`<span class="badge season">${i.season}</span>`:''}</h3>`;
                if (i.location) h += `<div class="meta">📍 ${i.location} | 🕒 ${i.time||''}</div>`;
                if (i.basePrice) h += `<div class="meta">💰 基础价: ${i.basePrice}G</div>`;
                h += renderCard(i);
                h += '</div>';
            });
            contentArea.innerHTML = h + '</div>';
        }

        function updateUI() { renderContent(currentCategory, searchInput.value); }

        // ==================== 事件监听 ====================
        categoryNav.addEventListener('click', e => {
            const btn = e.target.closest('.category-btn'); if (!btn) return;
            const cat = btn.dataset.category;
            _applyState(cat, '', false);
        });

        searchInput.addEventListener('input', () => {
            pushHistory(currentCategory, searchInput.value);
            updateUI();
        });

        // 初始加载
        pushHistory('all', '');
        updateUI();
    </script>
