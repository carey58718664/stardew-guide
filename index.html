                { id:"fairy_rose", name:"仙女玫瑰", type:"flower", seasons:["秋季"], growthDays:12, basePrice:290, goldPrice:435,

                { id:"ancient_fruit", name:"远古果实", type:"crop", seasons:["春","夏","秋"], growthDays:28, regrowDays:7, basePrice:550, goldPrice:825,
                  processing:[
                    {method:"小桶", product:"远古果酒", price:1650, days:7, priority:1, note:"陈酿翻倍"},
                    {method:"罐头瓶", product:"远古果酱", price:1150, days:3, priority:2},
                  ],
                  retention:2, isHot:true,
                  gifts:{loves:[], likes:["法师","科罗布斯"], dislikes:[]},

                  ],
                  retention:2, isHot:false,
                  gifts:{loves:["刘易斯","卡洛琳"], likes:[], dislikes:[]},
                  sacrifices:[], cooking:[],
                  decision:"花盆种，每天收，酿绿茶，留2个。" },
                { id:"corn", name:"玉米", type:"crop", seasons:["夏季","秋季"], growthDays:14, regrowDays:4, basePrice:50, goldPrice:75,
                  processing:[
                    {method:"罐头瓶", product:"腌玉米", price:150, days:3, priority:1},
                    {method:"小桶", product:"玉米汁", price:112, days:4, priority:2},
                  ],
                  retention:0, isHot:false, multiSeason:true,
                  gifts:{loves:[], likes:["乔迪","肯特"], dislikes:["阿比盖尔"]},
                  sacrifices:[{room:"茶水间", bundle:"秋季作物收集包", need:1},{room:"茶水间", bundle:"高品质作物收集包", need:5, quality:"金星"}],
                  cooking:[{dish:"墨西哥薄饼", effect:"+90体力 +40生命"}],
                  decision:"留5金星献祭，普通进罐头瓶。" },
            ];

            const npcs = [
                { name:"阿比盖尔", loves:["紫水晶","南瓜","巧克力蛋糕"], likes:["石英"] },
                { name:"塞巴斯蒂安", loves:["泪晶","虚空蛋","生鱼片"], likes:["石英"] },
                { name:"山姆", loves:["仙人掌果子","披萨","虎眼石"], likes:["所有蛋"] },
                { name:"潘妮", loves:["绿宝石","罂粟","甜瓜"], likes:["所有奶类"] },
                { name:"哈维", loves:["咖啡","腌菜","果酒"], likes:["普通蘑菇"] },
                { name:"艾利欧特", loves:["蟹黄糕","鸭毛","石榴"], likes:["章鱼","鱿鱼"] },
                { name:"莉亚", loves:["山羊奶酪","沙拉","松露"], likes:["所有水果"] },
                { name:"玛鲁", loves:["电池组","花椰菜","钻石"], likes:["铜锭","铁锭"] },
            ];

            const bundles = [
                { room:"茶水间", name:"春季作物收集包", items:"防风草、青豆、花椰菜、土豆" },
                { room:"茶水间", name:"夏季作物收集包", items:"番茄、辣椒、蓝莓、甜瓜" },
                { room:"茶水间", name:"秋季作物收集包", items:"玉米、茄子、南瓜、山药" },
                { room:"茶水间", name:"高品质作物收集包", items:"5个金星品质作物" },
                { room:"鱼缸", name:"河鱼收集包", items:"太阳鱼、鲶鱼、小嘴鲈鱼" },
                { room:"鱼缸", name:"湖鱼收集包", items:"大嘴鲈鱼、鲤鱼、鲟鱼" },
                { room:"工艺室", name:"花园收集包", items:"郁金香、蓝爵、金鸡菊、向日葵、罂粟、仙女玫瑰" },
                { room:"布告栏", name:"稀有作物收集包", items:"上古水果、宝石甜莓" },
            ];

            const categoryMap = {
                crops: ['crop','flower'], animal: ['animal_product'], fish: ['fish'],
                mining: ['mineral'], artisan: ['artisan'],
            };

            const contentArea = document.getElementById('contentArea');
            const searchInput = document.getElementById('searchInput');
            const categoryBtns = document.querySelectorAll('.category-btn');
            let currentCat = 'all', searchQuery = '';

            function renderTopics() {
                const ts = [
                    { n:"作物种植", i:"🌽", c:"crops" }, { n:"畜牧产品", i:"🐄", c:"animal" },
                    { n:"钓鱼蟹笼", i:"🎣", c:"fish" }, { n:"矿场战斗", i:"⛏", c:"mining" },
                    { n:"工匠设备", i:"🍷", c:"artisan" }, { n:"献祭收集", i:"🎁", c:"bundles" },
                    { n:"NPC社交", i:"💬", c:"npcs" }
                ];
                return '<div class="topic-grid">'+ts.map(t=>`<div class="topic-card" data-category="${t.c}"><span class="topic-icon">${t.i}</span>${t.n}</div>`).join('')+'</div>';
            }

            function renderSeasonGrid() {
                const seasons = ["春季","夏季","秋季","姜岛"];
                let html = '<div class="season-grid">';
                seasons.forEach(season => {
                    const crops = items.filter(i => (i.type==='crop'||i.type==='flower') && i.seasons?.includes(season));
                    html += `<div class="season-block"><h3>${season}</h3><div class="crop-list">`;
                    crops.forEach(c => {
                        let cls = 'crop-link';
                        if (c.multiSeason) cls += ' multi';
                        html += `<span class="${cls}" data-search="${c.name}">${c.name}${c.isHot?'<span class="hot-tag">🔥</span>':''}</span>`;
                    });
                    html += '</div></div>';
                });
                html += '</div>';
                return html;
            }

            function renderCatList(cat) {
                if(cat==='crops') return renderSeasonGrid();
                if(cat==='bundles') return '<h2>🎁 献祭收集包</h2><div class="info-grid">'+bundles.map(b=>`<div class="info-card"><h4>${b.room} · ${b.name}</h4><p>${b.items}</p></div>`).join('')+'</div>';
                if(cat==='npcs') return '<h2>💬 NPC 最爱礼物</h2><div class="info-grid">'+npcs.map(n=>`<div class="info-card"><h4>${n.name}</h4><p>❤️ ${n.loves.join('、')}</p></div>`).join('')+'</div>';
                if(cat==='all') return renderTopics();
                const types = categoryMap[cat]||[];
                const filtered = items.filter(i=>types.includes(i.type));
                if(!filtered.length) return '<p>暂无数据。</p>';
                return `<h2>📋 列表</h2><table><tr><th>名称</th><th>来源</th><th>基础价</th></tr>
                    ${filtered.map(i=>`<tr><td><span class="link-like" data-search="${i.name}">${i.name}</span></td><td>${i.seasons?.join('、')||'—'}</td><td>${i.basePrice}G</td></tr>`).join('')}</table>`;
            }

            function buildFlow(item) {
                let html = '<div class="decision-flow">';
                // 献祭分支
                if(item.sacrifices?.length){
                    const groups={};
                    item.sacrifices.forEach(s=>{ if(!groups[s.room]) groups[s.room]=[]; groups[s.room].push(s); });
                    html+='<div class="flow-step"><div class="flow-title">🎯 先献祭</div><div class="flow-branch">';
                    for(const[room,sacs] of Object.entries(groups)){
                        html+=`<div class="flow-line"><span class="arrow">→</span><strong>${room}</strong></div>`;
                        sacs.forEach(s=>{
                            const q = s.quality==='金星'?' <span class="quality-tag gold">金星</span>':(s.quality?' <span class="quality-tag">'+s.quality+'</span>':'');
                            html+=`<div class="flow-line" style="margin-left:1.6rem;">${s.bundle}：留 ${s.need} 个${q}</div>`;
                        });
                    }
                    html+='</div></div>';
                }
                // 留存数量
                if(item.retention && item.retention > 0) {
                    html+=`<div class="flow-step"><div class="flow-title">📦 留存</div><div class="flow-branch">`;
                    html+=`<div class="flow-line"><span class="arrow">→</span> 需留存 <strong>${item.retention} 个</strong>（烹饪/任务/礼物）</div>`;
                    html+='</div></div>';
                }
                // 加工分支
                if(item.processing?.length){
                    html+='<div class="flow-step"><div class="flow-title">⚡ 看品质</div><div class="flow-branch">';
                    const goldSell = item.goldPrice||item.basePrice;
                    html+=`<div class="flow-line"><span class="arrow">→</span> ⭐金/铱星 → 直接卖 <span class="price-note">(${goldSell}G)</span></div>`;
                    const mainProc = item.processing[0];
                    html+=`<div class="flow-line"><span class="arrow">→</span> 🟤普通/银星 → 进 <span class="link-like" data-search="${mainProc.method}">${mainProc.method}</span> 做 <strong>${mainProc.product}</strong> <span class="price-note">(${mainProc.price}G)</span></div>`;
                    if(item.processing.length > 1) {
                        const altProc = item.processing[1];
                        html+=`<div class="flow-line" style="margin-left:2rem; font-size:0.85rem;">↳ 备选：${altProc.method} → ${altProc.product} <span class="price-note">(${altProc.price}G, ${altProc.days}天)</span></div>`;
                    }
                    html+=`<div class="flow-line" style="margin-left:2rem; font-size:0.85rem;">↳ 没机器？暂存，急用钱再卖</div>`;
                    html+='</div></div>';
                } else {
                    html+='<div class="flow-step"><div class="flow-title">⚡ 处理</div><div class="flow-branch"><div class="flow-line">根据用途保留或直接出售。</div></div>';
                }
                // NPC喜好
                if(item.gifts && (item.gifts.loves?.length || item.gifts.likes?.length)) {
                    html+='<div class="flow-step"><div class="flow-title">💝 送谁</div><div class="flow-branch">';
                    if(item.gifts.loves?.length) html+=`<div class="flow-line"><span class="arrow">→</span> ❤️ 最爱：${item.gifts.loves.join('、')}</div>`;
                    if(item.gifts.likes?.length) html+=`<div class="flow-line"><span class="arrow">→</span> 👍 喜欢：${item.gifts.likes.join('、')}</div>`;
                    html+='</div></div>';
                }
                html+='</div>';
                return html;
            }

            function performSearch(q){
                if(!q.trim()) return renderCurrent();
                const kw=q.toLowerCase().trim();
                const res=items.filter(i=>i.name.toLowerCase().includes(kw));
                if(!res.length){ contentArea.innerHTML='<p>😕 未找到</p>'; return; }
                contentArea.innerHTML=res.map(item=>`
                    <div class="search-result-item">
                        <div class="item-header">
                            <span class="item-name">${item.name}</span>
                            <span class="item-type-badge">${item.type}</span>
                            ${item.basePrice ? `<span style="color:#b8860b; font-weight:700;">${item.basePrice}G</span>` : ''}
                        </div>
                        ${buildFlow(item)}
                        <div class="info-grid">
                            <div class="info-card"><h4>📅 基础</h4>
                                <p>季节：${item.seasons?.join('、')||'—'}</p>
                                ${item.growthDays?`<p>成熟：${item.growthDays}天</p>`:''}
                                ${item.regrowDays?`<p>再收获：${item.regrowDays}天</p>`:''}
                            </div>
                        </div>
                    </div>`).join('');
            }

            function renderCurrent(){
                if(searchQuery.trim()) performSearch(searchQuery);
                else contentArea.innerHTML = renderCatList(currentCat);
            }

            categoryBtns.forEach(b=>b.addEventListener('click',function(){
                categoryBtns.forEach(x=>x.classList.remove('active'));
                this.classList.add('active');
                currentCat=this.dataset.category;
                searchInput.value='';
                searchQuery='';
                renderCurrent();
            }));

            searchInput.addEventListener('input',function(){
                searchQuery=this.value;
                if(searchQuery.trim()){
                    categoryBtns.forEach(b=>b.classList.remove('active'));
                    document.querySelector('[data-category="all"]').classList.add('active');
                    currentCat='all';
                }
                renderCurrent();
            });

            contentArea.addEventListener('click',function(e){
                const card=e.target.closest('.topic-card');
                if(card?.dataset.category) document.querySelector(`.category-btn[data-category="${card.dataset.category}"]`).click();
                const link=e.target.closest('[data-search]');
                if(link){
                    searchInput.value=link.dataset.search;
                    searchQuery=link.dataset.search;
                    renderCurrent();
                    window.scrollTo({top:0,behavior:'smooth'});
                }
            });

            renderCurrent();
        })();
    </script>
</body>
</html>
