<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>星露谷处理助手</title>

  <style>
    :root{
      --bg:#f6efe3;
      --card:#fffaf3;
      --ink:#211b16;
      --muted:#776b5d;
      --line:#eadcc5;
      --soft:#f4e7d1;
      --green:#2f6b45;
      --blue:#3f73a8;
      --gold:#b98428;
      --red:#b3544e;
      --shadow:0 14px 36px rgba(70,45,20,.12);
      --r:24px;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      color:var(--ink);
      background:linear-gradient(180deg,#fff9ef 0%,var(--bg) 60%,#eee2cf 100%);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
      line-height:1.48;
    }

    button,input{font:inherit}

    .top{
      position:sticky;
      top:0;
      z-index:10;
      padding:12px 14px;
      background:rgba(246,239,227,.88);
      backdrop-filter:blur(18px);
      border-bottom:1px solid rgba(234,220,197,.75);
    }

    .topin{
      max-width:940px;
      margin:auto;
      display:flex;
      gap:10px;
      align-items:center;
    }

    .logo{
      width:42px;
      height:42px;
      border-radius:15px;
      display:grid;
      place-items:center;
      background:#fff4d8;
      border:1px solid var(--line);
      font-size:23px;
      flex:0 0 auto;
    }

    .search{
      flex:1;
      display:flex;
      gap:10px;
      align-items:center;
      border:1px solid var(--line);
      background:white;
      border-radius:999px;
      padding:12px 15px;
      box-shadow:0 8px 22px rgba(70,45,20,.07);
    }

    .search input{
      width:100%;
      border:0;
      outline:0;
      background:transparent;
      font-size:16px;
    }

    .app{
      max-width:940px;
      margin:auto;
      padding:16px 14px 80px;
      display:grid;
      gap:14px;
    }

    .hero{
      border-radius:30px;
      padding:22px;
      color:white;
      background:linear-gradient(135deg,#2f6b45,#9b7438);
      box-shadow:var(--shadow);
    }

    .hero small{
      display:block;
      letter-spacing:.16em;
      text-transform:uppercase;
      opacity:.8;
      font-weight:800;
      margin-bottom:8px;
    }

    .hero h1{
      margin:0 0 8px;
      font-size:30px;
      line-height:1.15;
    }

    .hero p{
      margin:0;
      opacity:.9;
    }

    .quick{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      margin-top:14px;
    }

    .quick button,
    .chip,
    .mini-btn{
      border:1px solid var(--line);
      background:#fff8ea;
      border-radius:999px;
      padding:7px 10px;
      cursor:pointer;
      color:#594934;
    }

    .quick button{
      color:white;
      background:rgba(255,255,255,.16);
      border-color:rgba(255,255,255,.4);
    }

    .panel{
      border:1px solid var(--line);
      background:rgba(255,250,243,.93);
      border-radius:var(--r);
      box-shadow:var(--shadow);
      overflow:hidden;
    }

    .body{padding:18px}

    .back{
      margin-bottom:12px;
    }

    .back button{
      border:1px solid var(--line);
      background:white;
      border-radius:999px;
      padding:8px 12px;
      cursor:pointer;
    }

    .head{
      display:grid;
      grid-template-columns:64px 1fr;
      gap:14px;
      align-items:center;
    }

    .icon{
      width:64px;
      height:64px;
      border-radius:20px;
      background:#f1dfc3;
      border:1px solid var(--line);
      display:grid;
      place-items:center;
      font-size:34px;
      overflow:hidden;
    }

    .icon img{
      width:100%;
      height:100%;
      object-fit:contain;
      padding:8px;
    }

    h2,h3,p{margin-top:0}

    .head h2{
      margin:0;
      font-size:30px;
      line-height:1.1;
    }

    .type{
      color:var(--muted);
      font-size:14px;
      margin-top:5px;
    }

    .one-line{
      margin-top:16px;
      padding:16px;
      border-radius:22px;
      background:linear-gradient(135deg,var(--green),#4c8a5e);
      color:white;
    }

    .one-line b{
      display:block;
      font-size:24px;
      line-height:1.2;
    }

    .one-line span{
      display:block;
      margin-top:6px;
      opacity:.9;
    }

    .section-title{
      padding:16px 18px;
      border-bottom:1px solid var(--line);
      font-size:22px;
      font-weight:900;
    }

    .steps{
      display:grid;
      gap:12px;
    }

    .step{
      border:1px solid var(--line);
      background:white;
      border-radius:22px;
      padding:14px;
      display:grid;
      grid-template-columns:42px 1fr;
      gap:12px;
      align-items:start;
    }

    .num{
      width:38px;
      height:38px;
      border-radius:50%;
      display:grid;
      place-items:center;
      color:white;
      font-weight:900;
      background:var(--green);
    }

    .step:nth-child(2) .num{background:var(--blue)}
    .step:nth-child(3) .num{background:var(--gold)}
    .step:nth-child(4) .num{background:var(--red)}

    .step h3{
      margin:0 0 8px;
      font-size:20px;
      line-height:1.25;
    }

    .compact{
      display:grid;
      gap:7px;
    }

    .line{
      display:flex;
      gap:8px;
      align-items:flex-start;
      color:#4e4439;
    }

    .k{
      flex:0 0 auto;
      color:var(--muted);
      font-weight:800;
    }

    .v b{
      color:var(--ink);
    }

    .tags{
      display:flex;
      flex-wrap:wrap;
      gap:7px;
      margin-top:10px;
    }

    .tag{
      display:inline-flex;
      border-radius:999px;
      padding:5px 8px;
      background:var(--soft);
      color:#5d4d38;
      font-size:13px;
    }

    .tag.green{background:#e5f2e9;color:#2f6b45}
    .tag.blue{background:#e8f1fb;color:#345f87}
    .tag.red{background:#fae6e3;color:#98443e}

    .mini-card{
      margin-top:10px;
      border:1px solid #ead8b8;
      background:#fff8ea;
      border-radius:18px;
      padding:12px;
    }

    .mini-card h4{
      margin:0 0 8px;
      font-size:16px;
    }

    .materials{
      display:flex;
      flex-wrap:wrap;
      gap:6px;
      margin-top:8px;
    }

    .mat{
      background:#e9dac1;
      border-radius:999px;
      padding:5px 8px;
      font-size:13px;
    }

    .sidebox{
      border:1px solid #dfd1bb;
      background:#fffdf8;
      border-radius:22px;
      padding:14px;
      display:grid;
      gap:10px;
    }

    .sidebox h3{
      margin:0;
      font-size:18px;
    }

    .side-item{
      border-top:1px solid var(--line);
      padding-top:10px;
    }

    .side-item:first-of-type{
      border-top:0;
      padding-top:0;
    }

    .side-item b{
      display:block;
      margin-bottom:4px;
    }

    .side-item p{
      margin:0;
      color:var(--muted);
    }

    .tip{
      margin-top:12px;
      border-left:4px solid var(--gold);
      border-radius:16px;
      background:#fff6dc;
      padding:12px;
      color:#69512c;
    }

    details{
      border:1px solid var(--line);
      background:white;
      border-radius:18px;
      overflow:hidden;
    }

    details+details{margin-top:10px}

    summary{
      cursor:pointer;
      padding:14px 16px;
      background:#fff7e8;
      font-weight:900;
    }

    .detail{
      border-top:1px solid var(--line);
      padding:14px 16px;
      color:var(--muted);
      display:grid;
      gap:8px;
    }

    .results{
      display:grid;
      gap:10px;
    }

    .result{
      display:flex;
      gap:12px;
      align-items:center;
      border:1px solid var(--line);
      background:white;
      border-radius:18px;
      padding:12px;
      cursor:pointer;
    }

    .mini-icon{
      width:42px;
      height:42px;
      border-radius:14px;
      background:#f0e1c9;
      display:grid;
      place-items:center;
      font-size:23px;
      flex:0 0 auto;
    }

    .result h3{
      margin:0;
      font-size:17px;
    }

    .result p{
      margin:2px 0 0;
      color:var(--muted);
      font-size:13px;
    }

    .empty{
      text-align:center;
      color:var(--muted);
      padding:24px;
    }

    @media(max-width:700px){
      .hero h1{font-size:26px}
      .head h2{font-size:26px}
      .step{grid-template-columns:38px 1fr}
    }
  </style>
</head>

<body>
  <header class="top">
    <div class="topin">
      <div class="logo">🌾</div>
      <label class="search">
        <span>🔎</span>
        <input id="search" placeholder="搜：玉米 / 罐头瓶 / 小桶 / 蜂蜜">
      </label>
    </div>
  </header>

  <main class="app">

      <h1>主流程只放当前任务</h1>
      <p>并列路线放在旁边，不混进步骤里。</p>
      <div class="quick">
        <button data-search="玉米">🌽 玉米</button>
        <button data-search="南瓜">🎃 南瓜</button>

        <button data-search="小桶">🍷 小桶</button>
      </div>
    </section>

    <div id="answer"></div>

    <section class="panel">
      <div class="section-title">相关结果 <span id="count" class="type"></span></div>
      <div class="body">
        <div id="results" class="results"></div>
        <div id="empty" class="empty" hidden>没搜到。换个关键词。</div>
      </div>
    </section>
  </main>

        aliases:["榨油机","Oil Maker"],
        core:"松露优先，作物做油只是补材料。",
        sub:"玉米、向日葵、向日葵种子能做油，但不是主要赚钱路线。",
        steps:[
          {
            title:"做出来",
            rows:[
              ["解锁","耕种 8 级"],
              ["材料","木材 x50 · 史莱姆 x20 · 金锭 x1"]
            ],
            tags:["设备"]
          },
          {
            title:"主用途",
            rows:[
              ["优先","松露"],
              ["结果","松露油"],
              ["收益","基础 1065g"]
            ],
            tags:["推荐"]
          },
          {
            title:"作物用途",
            rows:[
              ["玉米","油"],
              ["向日葵","油"],
              ["定位","料理材料链"]
            ],
            tags:["补充"]
          }
        ],
        side:[
          {
            title:"玉米主线",
            text:"玉米的主处理还是罐头瓶，产油机只是旁支。",
            link:"corn"
          }
        ],
        tip:"不要把产油机当成玉米的主要收益路线。",
        details:[
          ["效果","特定作物或松露转换成油"],
          ["玉米耗时","约 16 小时"],
          ["向日葵种子耗时","约 53 小时"]
        ],
        deep:[
          ["为什么松露优先","松露油售价高，产油机的主要收益来自这里。"]
        ],
        craft:{
          source:"耕种 8 级",
          materials:[["木材",50],["史莱姆",20],["金锭",1]]
        },
        tags:["产油机","设备","玉米","松露","油"]
      },

      beeHouse:{
        id:"beeHouse",
        name:"蜂房",
        type:"设备",
        icon:"🏠",
        image:"assets/machines/bee-house.png",
        aliases:["Bee House"],
        core:"围着高价花产蜂蜜。",
        sub:"花决定蜂蜜价值，秋季仙女玫瑰最重要。",
        steps:[
          {
            title:"做出来",
            rows:[
              ["解锁","耕种 3 级"],
              ["材料","木材 x40 · 煤炭 x8 · 铁锭 x1 · 枫糖浆 x1"]
            ],
            tags:["设备"]
          },
          {
            title:"摆花",
            rows:[
              ["秋季","仙女玫瑰"],
              ["夏季","罂粟 / 夏季金鸡菊"],
              ["春季","郁金香 / 蓝爵"]
            ],
            tags:["推荐"]
          },
          {
            title:"卖蜂蜜",
            rows:[
              ["高价花蜜","直接卖"],
              ["普通蜂蜜","可酿蜂蜜酒"],
              ["温室","不产蜜"]
            ],
            tags:["结果"]
          }
        ],
        side:[
          {
            title:"蜂蜜处理",
            text:"蜂蜜是否进小桶，要看它是不是高价花蜜。",
            link:"honey"
          }
        ],
        tip:"蜂房可以放温室，但不会产蜂蜜。",
        details:[
          ["效果","生产蜂蜜"],
          ["花朵规则","附近盛开的花会改变蜂蜜种类"],
          ["温室","可放蜂房，但不产蜜"]
        ],
        deep:[
          ["为什么花重要","蜂房附近的花会把普通蜂蜜变成花卉蜂蜜，价值差距很大。"]
        ],
        craft:{
          source:"耕种 3 级",
          materials:[["木材",40],["煤炭",8],["铁锭",1],["枫糖浆",1]]
        },
        tags:["蜂房","蜂蜜","仙女玫瑰","设备"]
      }
    };

    const search = document.getElementById("search");
    const answer = document.getElementById("answer");
    const results = document.getElementById("results");
    const empty = document.getElementById("empty");
    const count = document.getElementById("count");

    const all = Object.values(DATA);
    let currentId = null;
    let stack = [];

    function norm(x){
      return String(x || "").toLowerCase().replace(/\s+/g,"");
    }

    function score(e,q){
      if(!q) return 1;
      const s = norm(JSON.stringify(e));
      const n = norm(e.name);
      const a = norm((e.aliases || []).join(""));
      const t = norm((e.tags || []).join(""));
      const k = norm(q);

      let r = 0;
      if(n === k) r += 1000;
      if(n.includes(k)) r += 600;
      if(a.includes(k)) r += 400;
      if(t.includes(k)) r += 250;
      if(s.includes(k)) r += 100;
      return r;
    }

    function find(q){
      return all
        .map(e => ({...e,_score:score(e,q)}))
        .filter(e => !q || e._score > 0)
        .sort((a,b)=>b._score-a._score || a.name.localeCompare(b.name,"zh-Hans-CN"));
    }

    function icon(e, cls="icon"){
      if(!e.image) return `<div class="${cls}">${e.icon || "📦"}</div>`;
      return `<div class="${cls}"><img src="${e.image}" alt="${e.name}" onerror="this.remove();this.parentElement.textContent='${e.icon || "📦"}';"></div>`;
    }

    function renderEntity(e){
      if(!e){
        currentId = null;
        answer.innerHTML = `
          <section class="panel">
            <div class="body">
              <div class="head">
                <div class="icon">🌾</div>
                <div>
                  <h2>搜一个东西</h2>
                  <div class="type">比如玉米、罐头瓶、小桶、蜂蜜。</div>
                </div>
              </div>
              <div class="one-line">
                <b>主流程只放当前任务</b>
                <span>并列路线放在旁边，不混进步骤里。</span>
              </div>
            </div>
          </section>
        `;
        return;
      }

      currentId = e.id;

      answer.innerHTML = `
        <section class="panel">
          <div class="body">
            ${stack.length ? `
              <div class="back">
                <button id="backBtn">← 返回 ${DATA[stack[stack.length-1]]?.name || "上一页"}</button>
              </div>
            ` : ""}

            <div class="head">
              ${icon(e)}
              <div>
                <h2>${e.name}</h2>
                <div class="type">${e.type} · ${e.sub || ""}</div>
              </div>
            </div>

            <div class="one-line">
              <b>${e.core}</b>
              <span>${e.sub || ""}</span>
            </div>
          </div>
        </section>

        <section class="panel">
          <div class="section-title">${e.name}怎么做</div>
          <div class="body steps">
            ${(e.steps || []).map((step,i)=>renderStep(step,i)).join("")}
            ${e.tip ? `<div class="tip"><b>提示：</b>${e.tip}</div>` : ""}
            ${renderSide(e)}
          </div>
        </section>

        <section class="panel">
          <div class="section-title">补充</div>
          <div class="body">
            ${renderDetails(e)}
          </div>
        </section>
      `;

      const backBtn = document.getElementById("backBtn");
      if(backBtn){
        backBtn.onclick = ()=>{
          const id = stack.pop();
          const last = DATA[id];
          if(last){
            search.value = last.name;
            renderEntity(last);
            renderResults(find(last.name));
            window.scrollTo({top:0,behavior:"smooth"});
          }
        };
      }

      bindButtons();
    }

    function renderStep(step,i){
      return `
        <article class="step">
          <div class="num">${i+1}</div>
          <div>
            <h3>${step.title}</h3>

            <div class="compact">
              ${(step.rows || []).map(([k,v])=>`
                <div class="line">
                  <div class="k">${k}</div>
                  <div class="v">${v}</div>
                </div>
              `).join("")}
            </div>

            ${step.machine ? renderMachine(step.machine) : ""}

            ${step.tags ? `
              <div class="tags">
                ${step.tags.map(t=>`<span class="tag ${tagClass(t)}">${t}</span>`).join("")}
              </div>
            ` : ""}
          </div>
        </article>
      `;
    }

    function tagClass(t){
      if(["推荐","必做","核心设备","重点"].includes(t)) return "green";
      if(["分工","结果","先判断"].includes(t)) return "blue";
      if(["别酿","不要"].includes(t)) return "red";
      return "";
    }

    function renderMachine(id){
      const m = DATA[id];
      if(!m) return "";

      return `
        <div class="mini-card">
          <h4>${m.icon || "⚙️"} ${m.name}</h4>
          <div class="line">
            <div class="k">定位</div>
            <div class="v">${m.core}</div>
          </div>
          ${m.craft ? `
            <div class="line">
              <div class="k">解锁</div>
              <div class="v">${m.craft.source}</div>
            </div>
            <div class="materials">
              ${m.craft.materials.map(x=>`<span class="mat">${x[0]} x${x[1]}</span>`).join("")}
            </div>
          ` : ""}
          <div class="tags">
            <button class="mini-btn" data-open="${m.id}">查看 ${m.name}</button>
          </div>
        </div>
      `;
    }

    function renderSide(e){
      if(!e.side || !e.side.length) return "";

      return `
        <div class="sidebox">
          <h3>旁边看看</h3>
          ${e.side.map(item=>{
            const target = DATA[item.link];
            return `
              <div class="side-item">
                <b>${item.title}</b>
                <p>${item.text}</p>
                ${target ? `
                  <div class="tags">
                    <button class="mini-btn" data-open="${target.id}">查看 ${target.name}</button>
                  </div>
                ` : ""}
              </div>
            `;
          }).join("")}
        </div>
      `;
    }

    function renderDetails(e){
      return `
        <details open>
          <summary>数据</summary>
          <div class="detail">
            ${(e.details || []).map(([k,v])=>`<div><b>${k}：</b>${v}</div>`).join("") || "暂无"}
          </div>
        </details>

        <details>
          <summary>为什么</summary>
          <div class="detail">
            ${(e.deep || []).map(([k,v])=>`<div><b>${k}：</b>${v}</div>`).join("") || "暂无"}
          </div>
        </details>

        <details>
          <summary>关键词</summary>
          <div class="detail">
            <div class="tags">
              ${(e.tags || []).map(t=>`<button class="chip" data-search="${t}">${t}</button>`).join("")}
            </div>
          </div>
        </details>
      `;
    }

    function renderResults(list){
      count.textContent = `· ${list.length} 条`;
      empty.hidden = list.length !== 0;

      results.innerHTML = list.map(e=>`
        <article class="result" data-open="${e.id}">
          ${icon(e,"mini-icon")}
          <div>
            <h3>${e.name}</h3>
            <p>${e.core}</p>
          </div>
        </article>
      `).join("");

      bindButtons();
    }

    function openEntity(id, push=true){
      const e = DATA[id];
      if(!e) return;

      if(push && currentId && currentId !== id){
        stack.push(currentId);
      }

      search.value = e.name;
      renderEntity(e);
      renderResults(find(e.name));
      window.scrollTo({top:0,behavior:"smooth"});
    }

    function update(){
      const q = search.value.trim();
      const list = find(q);

      stack = [];

      if(q && list[0]){
        renderEntity(list[0]);
      }else if(!q){
        renderEntity(null);
      }else{
        answer.innerHTML = "";
      }

      renderResults(list);
    }

    function bindButtons(){
      document.querySelectorAll("[data-search]").forEach(btn=>{
        btn.onclick = ()=>{
          search.value = btn.dataset.search;
          update();
          window.scrollTo({top:0,behavior:"smooth"});
        };
      });

      document.querySelectorAll("[data-open]").forEach(btn=>{
        btn.onclick = ()=>{
          openEntity(btn.dataset.open,true);
        };
      });
    }

    search.addEventListener("input",update);
    bindButtons();
    update();
  </script>
</body>
</html>
