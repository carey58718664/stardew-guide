<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>星露谷处理决策助手</title>

  <style>
    :root{
      --bg:#f6efe3;
      --card:#fffaf1;
      --white:#fff;
      --ink:#211b16;
      --muted:#766b5d;
      --line:#eadcc5;
      --green:#2f6b45;
      --green2:#4f8a5f;
      --blue:#3f73a8;
      --yellow:#b98428;
      --red:#b3544e;
      --purple:#7d5ca7;
      --shadow:0 16px 42px rgba(76,50,20,.13);
      --r:24px;
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
      color:var(--ink);
      background:
        radial-gradient(circle at top left,rgba(255,255,255,.9),transparent 32%),
        linear-gradient(180deg,#fff9ee 0%,var(--bg) 55%,#efe5d4 100%);
      line-height:1.55;
    }

    button,input{
      font:inherit;
    }

    .app{
      max-width:1060px;
      margin:0 auto;
      padding:18px 16px 80px;
    }

    .top{
      position:sticky;
      top:0;
      z-index:20;
      padding:12px 0;
      backdrop-filter:blur(18px);
      background:rgba(246,239,227,.84);
      border-bottom:1px solid rgba(234,220,197,.75);
    }

    .top-inner{
      max-width:1060px;
      margin:auto;
      padding:0 16px;
      display:flex;
      gap:10px;
      align-items:center;
    }

    .logo{
      width:42px;
      height:42px;
      border-radius:15px;
      display:grid;
      place-items:center;
      background:#fff4d8;
      box-shadow:inset 0 0 0 1px var(--line);
      font-size:24px;
      flex:0 0 auto;
    }

    .search{
      flex:1;
      display:flex;
      align-items:center;
      gap:10px;
      background:white;
      border:1px solid var(--line);
      border-radius:999px;
      padding:12px 15px;
      box-shadow:0 8px 22px rgba(70,45,20,.08);
    }

    .search input{
      width:100%;
      border:0;
      outline:0;
      background:transparent;
      font-size:16px;
    }

    .hero{
      margin-top:16px;
      border-radius:32px;
      padding:26px;
      color:white;
      background:linear-gradient(135deg,#2f6b45,#9a7439);
      box-shadow:var(--shadow);
    }

    .hero small{
      display:block;
      letter-spacing:.18em;
      text-transform:uppercase;
      opacity:.82;
      font-weight:800;
      margin-bottom:8px;
    }

    .hero h1{
      margin:0 0 8px;
      font-size:34px;
      line-height:1.12;
    }

    .hero p{
      margin:0;
      opacity:.9;
      max-width:760px;
    }

    .quick{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      margin-top:14px;
    }

    .quick button{
      border:1px solid rgba(255,255,255,.45);
      background:rgba(255,255,255,.14);
      color:white;
      padding:8px 12px;
      border-radius:999px;
      cursor:pointer;
    }

    .layout{
      display:grid;
      grid-template-columns:1fr 320px;
      gap:18px;
      margin-top:18px;
    }

    .main{
      display:grid;
      gap:16px;
    }

    .side{
      display:grid;
      gap:14px;
      align-self:start;
      position:sticky;
      top:82px;
    }

    .panel{
      background:rgba(255,250,241,.9);
      border:1px solid var(--line);
      border-radius:var(--r);
      box-shadow:var(--shadow);
      overflow:hidden;
    }

    .panel-head{
      padding:16px 18px;
      border-bottom:1px solid var(--line);
      display:flex;
      justify-content:space-between;
      gap:12px;
      align-items:center;
    }

    .panel-head h2{
      margin:0;
      font-size:20px;
    }

    .panel-body{
      padding:18px;
    }

    .answer-card{
      background:linear-gradient(135deg,#ffffff,#fff3da);
      border:1px solid var(--line);
      border-radius:28px;
      padding:20px;
      box-shadow:0 12px 28px rgba(75,50,20,.08);
    }

    .entity-title{
      display:flex;
      align-items:center;
      gap:14px;
      margin-bottom:14px;
    }

    .icon{
      width:68px;
      height:68px;
      border-radius:21px;
      background:#f2e2c8;
      border:1px solid var(--line);
      display:grid;
      place-items:center;
      font-size:36px;
      overflow:hidden;
      flex:0 0 auto;
    }

    .icon img{
      width:100%;
      height:100%;
      object-fit:contain;
      padding:8px;
    }

    .entity-title h2{
      margin:0;
      font-size:30px;
      line-height:1.1;
    }

    .meta{
      color:var(--muted);
      font-size:14px;
      margin-top:3px;
    }

    .decision{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:10px;
      margin-top:14px;
    }

    .decision-box{
      border-radius:20px;
      padding:14px;
      color:white;
      min-height:108px;
    }

    .decision-box strong{
      display:block;
      font-size:13px;
      opacity:.84;
      margin-bottom:5px;
    }

    .decision-box b{
      font-size:20px;
      line-height:1.2;
    }

    .decision-box p{
      margin:7px 0 0;
      font-size:13px;
      opacity:.9;
    }

    .green{background:linear-gradient(135deg,var(--green),var(--green2))}
    .blue{background:linear-gradient(135deg,var(--blue),#6897ba)}
    .yellow{background:linear-gradient(135deg,var(--yellow),#c99c4a)}
    .red{background:linear-gradient(135deg,var(--red),#c77467)}
    .purple{background:linear-gradient(135deg,var(--purple),#9d7cc0)}

    .tabs{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:8px;
      margin-top:14px;
    }

    .tab{
      border:1px solid var(--line);
      background:white;
      border-radius:18px;
      padding:12px 8px;
      cursor:pointer;
      font-weight:800;
    }

    .tab.active{
      color:white;
      background:var(--green);
      border-color:transparent;
    }

    .action-content{
      margin-top:12px;
      border:1px solid var(--line);
      background:white;
      border-radius:20px;
      padding:16px;
    }

    .action-content h3{
      margin:0 0 8px;
      font-size:18px;
    }

    .action-content ul{
      margin:8px 0 0;
      padding-left:20px;
    }

    .priority{
      display:grid;
      gap:10px;
    }

    .rank{
      display:grid;
      grid-template-columns:44px 1fr;
      gap:12px;
      background:white;
      border:1px solid var(--line);
      border-radius:20px;
      padding:14px;
    }

    .rank-num{
      width:36px;
      height:36px;
      border-radius:50%;
      display:grid;
      place-items:center;
      color:white;
      font-weight:900;
      background:var(--green);
    }

    .rank:nth-child(2) .rank-num{background:var(--blue)}
    .rank:nth-child(3) .rank-num{background:var(--yellow)}
    .rank:nth-child(4) .rank-num{background:var(--red)}

    .rank h3{
      margin:0 0 4px;
      font-size:18px;
    }

    .rank p{
      margin:0;
      color:var(--muted);
    }

    .chips{
      display:flex;
      flex-wrap:wrap;
      gap:7px;
      margin-top:10px;
    }

    .chip{
      border:1px solid var(--line);
      background:#fff7e7;
      color:#5f4f3c;
      border-radius:999px;
      padding:6px 9px;
      font-size:13px;
      cursor:pointer;
    }

    .chain{
      display:grid;
      gap:10px;
    }

    .machine-card{
      border:1px solid var(--line);
      border-radius:20px;
      background:white;
      padding:14px;
    }

    .machine-card h3{
      margin:0 0 6px;
      display:flex;
      align-items:center;
      gap:8px;
    }

    .machine-card p{
      margin:6px 0;
      color:var(--muted);
    }

    .materials{
      display:flex;
      flex-wrap:wrap;
      gap:6px;
      margin-top:8px;
    }

    .material{
      background:#f0e4d0;
      border-radius:999px;
      padding:5px 8px;
      font-size:13px;
    }

    details{
      border:1px solid var(--line);
      background:white;
      border-radius:18px;
      padding:0;
      overflow:hidden;
    }

    details + details{
      margin-top:10px;
    }

    summary{
      cursor:pointer;
      padding:14px 16px;
      font-weight:900;
      background:#fff7e8;
    }

    .detail-body{
      padding:14px 16px;
      color:var(--muted);
      border-top:1px solid var(--line);
    }

    .result-list{
      display:grid;
      gap:10px;
    }

    .result{
      border:1px solid var(--line);
      background:white;
      border-radius:18px;
      padding:12px;
      cursor:pointer;
      display:flex;
      gap:12px;
      align-items:center;
    }

    .mini-icon{
      width:42px;
      height:42px;
      border-radius:14px;
      background:#f0e1c9;
      display:grid;
      place-items:center;
      font-size:23px;
      flex:0 0 auto;
    }

    .result h3{
      margin:0;
      font-size:16px;
    }

    .result p{
      margin:2px 0 0;
      color:var(--muted);
      font-size:13px;
    }

    .problem-buttons{
      display:grid;
      gap:9px;
    }

    .problem-buttons button{
      text-align:left;
      border:1px solid var(--line);
      background:white;
      border-radius:16px;
      padding:12px;
      cursor:pointer;
    }

    .empty{
      padding:28px;
      text-align:center;
      color:var(--muted);
    }

    @media(max-width:860px){
      .layout{
        grid-template-columns:1fr;
      }

      .side{
        position:static;
      }

      .hero{
        padding:22px;
      }

      .hero h1{
        font-size:28px;
      }

      .decision{
        grid-template-columns:1fr;
      }

      .tabs{
        grid-template-columns:repeat(2,1fr);
      }

      .entity-title h2{
        font-size:26px;
      }
    }
  </style>
</head>

<body>
  <header class="top">
    <div class="top-inner">
      <div class="logo">🌾</div>
      <label class="search">
        <span>🔎</span>
        <input id="search" type="search" placeholder="搜：玉米 / 南瓜 / 罐头瓶 / 蜂蜜 / 小桶">
      </label>
    </div>
  </header>

  <main class="app">
    <section class="hero">
      <small>Stardew Decision Helper</small>
      <h1>别查字典，直接告诉我该怎么处理</h1>
      <p>搜索一个东西后，先给结论，再给优先级、设备材料、留存需求和补充信息。</p>
      <div class="quick">
        <button data-search="玉米">🌽 玉米</button>
        <button data-search="南瓜">🎃 南瓜</button>
        <button data-search="蜂蜜">🍯 蜂蜜</button>
        <button data-search="罐头瓶">🛢️ 罐头瓶</button>
        <button data-search="小桶">🍷 小桶</button>
      </div>
    </section>

    <div class="layout">
      <section class="main">
        <div id="answer"></div>

        <section class="panel">
          <div class="panel-head">
            <h2>相关结果</h2>
            <span id="count" class="meta"></span>
          </div>
          <div class="panel-body">
            <div id="results" class="result-list"></div>
            <div id="empty" class="empty" hidden>没搜到。换个关键词，或者继续补数据。</div>
          </div>
        </section>
      </section>

      <aside class="side">
        <section class="panel">
          <div class="panel-head">
            <h2>常见问题</h2>
          </div>
          <div class="panel-body problem-buttons">
            <button data-search="玉米">我拿到玉米后该留还是加工？</button>
            <button data-search="罐头瓶">哪些东西适合进罐头瓶？</button>
            <button data-search="蜂蜜">蜂蜜要不要放小桶？</button>
            <button data-search="南瓜">南瓜应该腌制还是榨汁？</button>
            <button data-search="小桶">小桶优先给谁用？</button>
          </div>
        </section>

        <section class="panel">
          <div class="panel-head">
            <h2>设计逻辑</h2>
          </div>
          <div class="panel-body">
            <p class="meta">页面优先回答“怎么处理”，而不是先展示全部知识。完整背景放在折叠区里。</p>
          </div>
        </section>
      </aside>
    </div>
  </main>

    function norm(v){
      return String(v || "").toLowerCase().replace(/\s+/g,"");
    }

    function blob(e){
      return norm(JSON.stringify(e));
    }

    function score(e,q){
      if(!q) return 1;

      const n = norm(e.name);
      const a = norm((e.aliases || []).join(""));
      const t = norm((e.tags || []).join(""));
      const b = blob(e);
      const query = norm(q);

      let s = 0;
      if(n === query) s += 1000;
      if(n.includes(query)) s += 600;
      if(a.includes(query)) s += 420;
      if(t.includes(query)) s += 280;
      if(b.includes(query)) s += 120;

      return s;
    }

    function findResults(q){
      return entities
        .map(e => ({...e, _score:score(e,q)}))
        .filter(e => !q || e._score > 0)
        .sort((a,b) => b._score - a._score || a.name.localeCompare(b.name,"zh-Hans-CN"));
    }

      const cls = big ? "icon" : "mini-icon";
      if(!e.image) return `<div class="${cls}">${e.icon || "📦"}</div>`;

        <div class="${cls}">
          <img src="${e.image}" alt="${e.name}" onerror="this.remove();this.parentElement.textContent='${e.icon || "📦"}';">
        </div>
      `;
    }

      `).join("");

      empty.hidden = list.length !== 0;

      document.querySelectorAll("[data-open]").forEach(el=>{
        el.addEventListener("click",()=>{
          const id = el.dataset.open;
          const entity = DATA[id];
          activeTab = "process";
          renderAnswer(entity);
          window.scrollTo({top:0,behavior:"smooth"});
        });
      });
    }

    function update(){
      const q = searchInput.value.trim();
      const list = findResults(q);

      if(q && list.length){
        renderAnswer(list[0]);
      }else if(!q){
        renderAnswer(null);
      }else{
        answer.innerHTML = "";
      }

      renderResults(list);
      bindSearchButtons();
    }

    function bindSearchButtons(){
      document.querySelectorAll("[data-search]").forEach(btn=>{
        btn.addEventListener("click",()=>{
          searchInput.value = btn.dataset.search;
          activeTab = "process";
          update();
          window.scrollTo({top:0,behavior:"smooth"});
        });
      });
    }

    searchInput.addEventListener("input",()=>{
      activeTab = "process";
      update();
    });

    bindSearchButtons();
    update();
  </script>
</body>
</html>
