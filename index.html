                { name:"艾芙琳", loves:"甜菜、巧克力蛋糕、钻石、玫瑰仙子、蜜料面包、郁金香" },
                { name:"玛妮", loves:"钻石、农夫午餐、粉红蛋糕、南瓜派" },
                { name:"桑迪", loves:"番红花、黄水仙、甜豌豆、芒果糯米饭" },
                { name:"法师", loves:"紫蘑菇、太阳精华、大海参、虚空精华" },
                { name:"矮人", loves:"紫水晶、海盗宝石、绿宝石、翡翠、红宝石、万象晶石" },
                { name:"科罗布斯", loves:"钻石、铱锭、南瓜、虚空蛋、虚空蛋黄酱、野山葵" },
                { name:"雷欧", loves:"鸭毛、芒果、鸵鸟蛋、夏威夷芋泥" }
            ];

            function renderNpcGifts() {
                return `<div class="static-page"><h2>💬 NPC最爱礼物速查</h2><div class="card-grid">` +
                    npcGifts.map(npc => `<div class="item-card"><h3>${npc.name}</h3><p>❤️ ${npc.loves}</p>${npc.note ? `<p class="note">${npc.note}</p>` : ''}</div>`).join('') +
                    `</div></div>`;
            }

            // ==================== 核心逻辑 ====================
            let currentCategory = 'all';
            const contentArea = document.getElementById('contentArea');
            const searchInput = document.getElementById('searchInput');
            const categoryNav = document.getElementById('categoryNav');

            function getItemsByCategory(cat) {
                if (cat === 'all') return allItems;
                if (cat === 'fish') return DB.fish;
                if (cat === 'crops') return [...DB.crops_spring, ...DB.crops_summer, ...DB.crops_fall, ...DB.crops_special];
                if (cat === 'animal') return DB.animal;
                if (cat === 'foraging') return DB.foraging;
                if (cat === 'artisan') return DB.artisan_honey;
                return [];
            }

            function renderItems(category, searchTerm) {
                // 静态页面直接显示
                if (category === 'mining') { contentArea.innerHTML = miningGuide; return; }
                if (category === 'bundles') { contentArea.innerHTML = bundlesGuide; return; }
                if (category === 'cooking') { contentArea.innerHTML = cookingGuide; return; }
                if (category === 'npcs') { contentArea.innerHTML = renderNpcGifts(); return; }

                let items = getItemsByCategory(category);
                if (searchTerm) {
                    const term = searchTerm.toLowerCase();
                    items = items.filter(item => item.name.toLowerCase().includes(term) ||
                        (item.location && item.location.toLowerCase().includes(term)) ||
                        (item.season && item.season.toLowerCase().includes(term)));
                }

                if (items.length === 0) {
                    contentArea.innerHTML = '<p style="text-align:center; padding:2rem;">没有找到匹配项，换个关键词试试~</p>';
                    return;
                }

                let html = '<div class="card-grid">';
                items.forEach(item => {
                    const seasonBadge = item.season ? `<span class="badge season">${item.season}</span>` : '';
                    html += `<div class="item-card">
                        <h3>${item.name} <span class="badge">${item.type || '物品'}</span>${seasonBadge}</h3>`;
                    if (item.location) html += `<div class="meta">📍 ${item.location}</div>`;
                    if (item.time) html += `<div class="meta">🕒 ${item.time}</div>`;
                    if (item.basePrice) html += `<div class="meta">💰 基础售价: ${item.basePrice}G</div>`;
                    if (item.processing && item.processing.length > 0) {
                        html += '<div class="priority-list"><strong>处理优先级:</strong>';
                        item.processing.sort((a,b) => (a.priority||9) - (b.priority||9)).forEach(p => {
                            html += `<div class="priority-item"><span class="prio">P${p.priority||'?'}</span> ${p.method} → ${p.product} ${p.price ? `<span style="color:var(--gold);">(${p.price}G)</span>` : ''}${p.note ? ` <small>${p.note}</small>` : ''}</div>`;
                        });
                        html += '</div>';
                    }
                    if (item.note) html += `<div class="note">💡 ${item.note}</div>`;
                    if (item.sacrifices && item.sacrifices.length > 0) {
                        html += '<div class="note">🎁 献祭: ';
                        item.sacrifices.forEach(s => html += `${s.room}→${s.bundle} `);
                        html += '</div>';
                    }
                    html += '</div>';
                });
                html += '</div>';
                contentArea.innerHTML = html;
            }

            function updateUI() {
                renderItems(currentCategory, searchInput.value);
            }

            // 分类按钮
            categoryNav.addEventListener('click', (e) => {
                const btn = e.target.closest('.category-btn');
                if (!btn) return;
                document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentCategory = btn.dataset.category;
                updateUI();
            });

            // 搜索输入 (实时过滤)
            searchInput.addEventListener('input', updateUI);

            // 初始加载
            updateUI();
        })();
    </script>
</body>
</html>
