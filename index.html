<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>杨桃 · 种子模块 Demo</title>
<style>
:root{
  --bg:#fbf3dc;
  --paper:#fffaf0;
  --ink:#30271d;
  --muted:#746858;
  --line:#d8bd82;
  --line-soft:rgba(216,189,130,.55);
  --wood:#6f4728;
  --gold:#c8952d;
  --blue:#426f93;
  --green:#4e845a;
  --red:#bd4b39;
  --shadow:0 12px 32px rgba(81,55,27,.13);
  --radius:20px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  min-height:100vh;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;
  color:var(--ink);
  background:
    radial-gradient(circle at 16% 20%,rgba(200,149,45,.12) 0 2px,transparent 2px 42px),
    linear-gradient(180deg,#fff8e8 0%,var(--bg) 100%);
  padding:14px;
}
.app{
  max-width:900px;
  margin:0 auto;
}
.result-card{
  background:rgba(255,250,240,.98);
  border:1.5px solid rgba(216,189,130,.92);
  border-radius:24px;
  box-shadow:0 7px 20px rgba(81,55,27,.10);
  padding:15px;
}
.item-head{
  display:flex;
  align-items:center;
  gap:9px;
  flex-wrap:wrap;
  padding-bottom:11px;
  border-bottom:1px solid var(--line-soft);
}
.item-head h1{
  font-size:28px;
}
.badge{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  border-radius:999px;
  padding:3px 9px;
  font-size:12px;
  font-weight:900;
  background:#eee1c4;
  color:var(--wood);
}
.badge.red{background:rgba(189,75,57,.13);color:var(--red)}
.badge.green{background:rgba(78,132,90,.14);color:var(--green)}
.badge.blue{background:rgba(66,111,147,.13);color:var(--blue)}
.block{
  margin-top:14px;
}
.block-title{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:20px;
  margin:0 0 9px;
}
.block-title::after{
  content:"";
  flex:1;
  height:1px;
  background:linear-gradient(90deg,var(--line-soft),transparent);
}

/* ===== 新种子模块 ===== */
.main-source-card{
  background:#fff;
  border:1.5px solid var(--line-soft);
  border-radius:18px;
  padding:13px 14px;
  margin-bottom:10px;
}
.main-source-top{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:12px;
}
.main-source-name{
  min-width:0;
}
.main-source-label{
  color:#97866e;
  font-size:12px;
  margin-bottom:3px;
}
.main-source-name b{
  display:block;
  font-size:22px;
  line-height:1.18;
}
.main-source-price{
  text-align:right;
  white-space:nowrap;
}
.main-source-price b{
  display:block;
  font-size:22px;
  line-height:1.18;
}
.main-source-price span{
  display:block;
  color:var(--muted);
  font-size:12px;
  margin-top:3px;
}
.main-source-meta{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:10px;
  padding-top:10px;
  border-top:1px dashed var(--line-soft);
}
.meta-pill{
  background:#fff8e7;
  border:1px solid rgba(216,189,130,.65);
  border-radius:12px;
  padding:8px 9px;
}
.meta-pill span{
  display:block;
  color:#97866e;
  font-size:11px;
}
.meta-pill b{
  display:block;
  font-size:14px;
  margin-top:2px;
}
.list-card{
  background:#fff;
  border:1px solid var(--line-soft);
  border-radius:18px;
  padding:10px 11px;
  margin:0 0 10px;
}
.list-title{
  color:#97866e;
  font-size:12px;
  margin-bottom:6px;
}
.source-row{
  display:grid;
  grid-template-columns:1fr auto;
  gap:12px;
  padding:8px 0;
  border-top:1px dashed var(--line-soft);
  font-size:14px;
  align-items:center;
}
.source-row:first-of-type{
  border-top:0;
}
.source-row span{
  color:var(--muted);
}
.source-row b{
  color:var(--ink);
  font-weight:800;
  text-align:right;
}
.inline-link{
  display:inline-flex;
  align-items:center;
  border:1.5px solid var(--line);
  background:#fff8e7;
  color:var(--blue);
  border-radius:999px;
  padding:2px 7px;
  font-size:13px;
  font-weight:900;
  text-decoration:none;
}
.device-card{
  background:#fff;
  border:1.5px solid rgba(216,189,130,.9);
  border-radius:19px;
  padding:13px;
  box-shadow:0 5px 14px rgba(81,55,27,.07);
  margin-top:18px;
}
.device-card.flash{
  animation:flash 1.1s ease;
}
@keyframes flash{
  0%,100%{box-shadow:0 5px 14px rgba(81,55,27,.07)}
  30%{box-shadow:0 0 0 5px rgba(66,111,147,.22),0 5px 14px rgba(81,55,27,.07)}
}
.device-card h3{
  font-size:21px;
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
}
.device-card p{
  color:var(--muted);
  font-size:15px;
  margin-top:6px;
  line-height:1.55;
}
@media(max-width:640px){
  body{padding:10px}
  .result-card{padding:12px}
  .main-source-top{
    display:block;
  }
  .main-source-price{
    text-align:left;
    margin-top:9px;
  }
  .main-source-meta{
    grid-template-columns:1fr;
  }
  .source-row{
    grid-template-columns:1fr;
    gap:3px;
  }
  .source-row b{
    text-align:left;
  }
}
</style>
</head>

<body>
<main class="app">
  <article class="result-card">
    <div class="item-head">
      <h1>⭐ 杨桃</h1>
      <span class="badge">作物</span>
      <span class="badge red">高价值</span>
      <span class="badge green">夏</span>
      <span class="badge blue">一次收获</span>
    </div>

    <section class="block">
      <h2 class="block-title">🌱 种子</h2>

      <div class="main-source-card">
        <div class="main-source-top">
          <div class="main-source-name">
            <div class="main-source-label">主要来源</div>
            <b>绿洲商店 · Sandy</b>
          </div>
          <div class="main-source-price">
            <b>400G / 1个</b>
            <span>单价 400G</span>
          </div>
        </div>

        <div class="main-source-meta">
          <div class="meta-pill">
            <span>地点</span>
            <b>沙漠</b>
          </div>
          <div class="meta-pill">
            <span>营业时间</span>
            <b>9:00AM-11:50PM</b>
          </div>
        </div>
      </div>

      <div class="list-card">
        <div class="list-title">其他种子获得方式</div>
        <div class="source-row">
          <span>旅行货车</span>
          <b>600-1000G / 1个</b>
        </div>
        <div class="source-row">
          <span>博物馆捐赠15件</span>
          <b>奖励1个</b>
        </div>
        <div class="source-row">
          <span><a class="inline-link" href="#seedmaker" data-jump="seedmaker">种子生产器</a></span>
          <b>杨桃 → 杨桃种子</b>
        </div>
        <div class="source-row">
          <span>骷髅洞穴宝箱层</span>
          <b>5-20个（1/702概率）</b>
        </div>
      </div>

      <div class="list-card">
        <div class="list-title">其他杨桃获得方式</div>
        <div class="source-row">
          <span>夏威夷宴会</span>
          <b>3000G / 1个杨桃</b>
        </div>
      </div>
    </section>
  </article>

  <article class="device-card" id="seedmaker">
    <h3>🌱 种子生产器 <span class="badge">工匠设备</span></h3>
    <p>将作物放入后生成对应种子。杨桃可以放入种子生产器生成杨桃种子。</p>
  </article>
</main>

<script>
document.body.addEventListener("click", e => {
  const jump = e.target.closest("[data-jump]");
  if(!jump) return;
  const el = document.getElementById(jump.dataset.jump);
  if(el){
    setTimeout(() => {
      el.scrollIntoView({behavior:"smooth", block:"center"});
      el.classList.add("flash");
      setTimeout(() => el.classList.remove("flash"), 1200);
    }, 30);
  }
});
</script>
</body>
</html>
