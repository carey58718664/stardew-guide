* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  background:
    linear-gradient(180deg, rgba(255, 250, 240, 0.82), rgba(243, 240, 232, 0.96)),
    repeating-linear-gradient(90deg, rgba(138, 90, 53, 0.035) 0 1px, transparent 1px 18px),
    var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  line-height: 1.5;
}

button,
input { font: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }

.page {
  width: min(1180px, calc(100% - 18px));
  margin: 0 auto;
  padding: 14px 0 34px;
}

.hero {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 16px;
  align-items: end;
  margin-bottom: 10px;
  padding: 16px 18px;
  border: 2px solid var(--wood-dark);
  border-radius: 8px;
  background: linear-gradient(180deg, #a66f42, var(--wood));
  color: #fff7e8;
  box-shadow: var(--shadow);
}

.hero p,
.hero h1 { margin: 0; }

.hero-kicker {
  margin-bottom: 4px !important;
  font-size: 13px;
  font-weight: 800;
  color: #ffe0a2;
}

h1 {
  font-size: clamp(24px, 5vw, 40px);
  line-height: 1.12;
  letter-spacing: 0;
}

.hero-actions {
  display: flex;
  gap: 10px;
  align-items: center;
}

.button {
  min-height: 40px;
  border: 2px solid rgba(255, 255, 255, 0.5);
  border-radius: 8px;
  background: rgba(255, 250, 240, 0.16);
  color: #fff7e8;
  padding: 0 14px;
  font-weight: 800;
}

.button:hover { background: rgba(255, 250, 240, 0.24); }

.assistant-panel {
  display: grid;
  grid-template-columns: 1fr;
  gap: 10px;
  margin-bottom: 10px;
}

.search-panel,
.progress-panel,
.center-map-panel,
.room-map {
  border: 1px solid #e8d8b8;
  border-radius: 8px;
  background: rgba(255, 250, 240, 0.92);
  box-shadow: 0 10px 24px rgba(76, 49, 29, 0.08);
}

.search-panel {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  gap: 12px;
  align-items: center;
  padding: 10px 12px;
}

.panel-title {
  margin: 0 0 10px;
  font-size: 17px;
  font-weight: 900;
}

.search-panel .panel-title {
  margin: 0;
  white-space: nowrap;
}

.search-box {
  display: grid;
  grid-template-columns: 1fr auto auto;
  gap: 8px;
  margin-bottom: 0;
}

.search-input {
  width: 100%;
  min-height: 42px;
  border: 2px solid var(--line);
  border-radius: 8px;
  background: #fffdf8;
  color: var(--ink);
  padding: 0 12px;
  outline: none;
}

.search-input:focus {
  border-color: var(--blue);
  box-shadow: 0 0 0 3px rgba(47, 111, 176, 0.16);
}

.clear-button,
.search-button {
  min-width: 44px;
  border-radius: 8px;
  font-weight: 950;
}

.clear-button {
  border: 2px solid var(--line);
  background: var(--paper-deep);
  color: var(--ink);
}

.search-button {
  border: 2px solid #d39c5f;
  background: #f4c77f;
  color: #5f3a22;
  font-size: 20px;
}

.result-list {
  display: grid;
  gap: 8px;
  grid-column: 2 / 3;
  max-height: 178px;
  overflow: auto;
  padding-right: 3px;
}

.empty-state {
  margin: 0;
  color: var(--muted);
  font-size: 14px;
}

.result-card {
  border: 2px solid #e4d3ae;
  border-radius: 8px;
  background: #fffdf8;
  padding: 10px;
}

.result-card.done {
  border-color: #b8d6ad;
  background: var(--green-soft);
}

.result-head {
  display: grid;
  grid-template-columns: 42px 1fr auto;
  gap: 10px;
  align-items: center;
  margin-bottom: 6px;
}

.result-title {
  margin: 0;
  font-weight: 900;
}

.result-path {
  margin: 1px 0 0;
  color: var(--muted);
  font-size: 13px;
}

.status {
  border-radius: 999px;
  padding: 3px 8px;
  font-size: 12px;
  font-weight: 900;
  white-space: nowrap;
}

.status.need { background: #fff0d2; color: #9c620e; }
.status.done { background: #dff3e4; color: #1c6f45; }

.progress-panel {
  margin-bottom: 10px;
  padding: 12px;
}

.progress-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 8px;
}

.category {
  border: 1px solid #e2d0aa;
  border-radius: 8px;
  background: #fffdf8;
  padding: 9px;
}

.category-top {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 7px;
  font-size: 13px;
  font-weight: 900;
}

.category-count {
  color: var(--muted);
  white-space: nowrap;
}

.bar {
  overflow: hidden;
  height: 10px;
  border-radius: 999px;
  background: #eadfc9;
}

.fill {
  width: 0%;
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg, var(--gold), var(--green));
  transition: width 0.2s ease;
}

.center-map-panel {
  margin-bottom: 10px;
  padding: 10px;
}

.center-map-frame {
  position: relative;
  overflow: hidden;
  border: 1px solid #e0c89b;
  border-radius: 8px;
  background: #fff6df;
  min-height: 280px;
}

.center-map-frame::after {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(255, 246, 224, 0.08);
  pointer-events: none;
}

.center-map-image {
  display: block;
  width: 100%;
  min-height: 280px;
  object-fit: contain;
  image-rendering: pixelated;
  filter: saturate(1.02) contrast(1.02);
}

.center-room-pin {
  position: absolute;
  left: var(--x);
  top: var(--y);
  z-index: 2;
  width: 0;
  height: 0;
  color: #5c3b20;
}

.center-pin-label {
  position: absolute;
  left: var(--dx);
  top: var(--dy);
  transform: translate(-50%, -50%);
  display: grid;
  justify-items: center;
  min-width: 76px;
  border: 1px solid rgba(128, 92, 48, 0.28);
  border-radius: 11px;
  background: rgba(255, 252, 242, 0.9);
  padding: 4px 9px 5px;
  text-align: center;
  box-shadow: 0 6px 14px rgba(76, 49, 29, 0.16);
  text-shadow: 0 1px 0 rgba(255, 255, 255, 0.8);
  backdrop-filter: blur(1px);
}

.center-pin-name {
  color: #5f3518;
  font-size: 13px;
  font-weight: 950;
  line-height: 1.12;
}

.center-pin-note {
  color: #7b5a36;
  font-size: 10px;
  font-weight: 850;
  line-height: 1.15;
  white-space: nowrap;
}

.center-pin-line {
  position: absolute;
  left: 0;
  top: 0;
  width: var(--line-l);
  height: 0;
  border-top: 1px solid rgba(112, 78, 42, 0.42);
  transform: translate(-50%, -50%) rotate(var(--line-a));
  transform-origin: left center;
  pointer-events: none;
}

.center-pin-dot {
  position: absolute;
  left: 0;
  top: 0;
  width: 9px;
  height: 9px;
  border: 2px solid rgba(255, 252, 242, 0.95);
  border-radius: 50%;
  background: #ba6b16;
  box-shadow: 0 2px 6px rgba(76, 49, 29, 0.3);
  transform: translate(-50%, -50%);
}

.room-map { padding: 12px; }

.rooms {
  display: grid;
  grid-template-columns: 1fr;
  gap: 14px;
}

.room {
  position: relative;
  border: 1px solid #e8d8b8;
  border-radius: 8px;
  background: linear-gradient(180deg, #fffaf0, #f7ebd1);
  box-shadow: 0 12px 26px rgba(76, 49, 29, 0.1);
}

.room-header {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 10px;
  align-items: start;
  padding: 10px 12px;
  border-bottom: 1px solid var(--line);
  background: rgba(138, 90, 53, 0.1);
}

.room-title {
  display: flex;
  gap: 8px;
  align-items: center;
  margin: 0 0 5px;
  font-size: 19px;
  font-weight: 950;
}

.room-meta {
  margin: 0;
  color: var(--muted);
  font-size: 13px;
}

.room-badge {
  color: var(--green);
  font-size: 13px;
  font-weight: 950;
  white-space: nowrap;
}

.room-body {
  display: grid;
  grid-template-columns: 1fr;
  padding: 10px;
}

.room-scene-card {
  min-width: 0;
  margin: 0;
  border: 1px solid #e5cfaa;
  border-radius: 20px;
  background: rgba(255, 252, 242, 0.92);
  padding: 10px;
  overflow: hidden;
  box-shadow: 0 8px 20px rgba(80, 50, 20, 0.1);
}

.room-scene {
  position: relative;
  overflow: hidden;
  min-height: 640px;
  aspect-ratio: 16 / 9.8;
  border: 1px solid rgba(184, 143, 84, 0.5);
  border-radius: 18px;
  background:
    linear-gradient(rgba(255, 246, 224, 0.22), rgba(255, 246, 224, 0.22)),
    linear-gradient(180deg, rgba(255, 252, 242, 0.58), rgba(244, 226, 190, 0.42));
  box-shadow: inset 0 0 0 1px rgba(255, 252, 242, 0.55), 0 8px 22px rgba(80, 50, 20, 0.1);
  isolation: isolate;
}

.room-scene::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  background: rgba(255, 246, 224, 0.22);
  backdrop-filter: blur(0.4px);
  pointer-events: none;
}

.room-scene::after {
  content: "";
  position: absolute;
  inset: 14px;
  z-index: 1;
  border: 1px solid rgba(150, 112, 63, 0.24);
  border-radius: 16px;
  pointer-events: none;
}

.room-scene-bg {
  position: absolute;
  inset: 0;
  z-index: -2;
  width: 100%;
  height: 100%;
  object-fit: cover;
  image-rendering: pixelated;
  opacity: 0.78;
  filter: blur(0.45px) saturate(0.95) brightness(0.96);
  transform: scale(1.01);
}

.room[data-room-id="fish"] .room-scene-bg,
.room[data-room-id="boiler"] .room-scene-bg,
.room[data-room-id="board"] .room-scene-bg,
.room[data-room-id="vault"] .room-scene-bg {
  filter: blur(0.35px) saturate(1.03) brightness(0.98);
}

.room-scene .image-fallback {
  position: absolute;
  inset: 16px;
  z-index: -2;
  min-height: auto;
  opacity: 0.5;
}

.map-bundle-grid {
  position: absolute;
  inset: 18px;
  z-index: 3;
}

.map-bundle-node {
  position: absolute;
  left: var(--x);
  top: var(--y);
  width: clamp(250px, 32%, 390px);
  transform: translate(-50%, -50%);
  display: grid;
  align-content: start;
  gap: 8px;
  min-height: 142px;
  border: 1px solid rgba(143, 108, 64, 0.24);
  border-radius: 16px;
  background: rgba(255, 252, 242, 0.94);
  padding: 11px 13px 10px;
  color: #2b2118;
  box-shadow: 0 6px 16px rgba(80, 50, 20, 0.14);
}

.map-bundle-node.done {
  border-color: rgba(76, 145, 91, 0.36);
  background: rgba(248, 254, 242, 0.95);
}

.map-bundle-node[data-slot="a"] { box-shadow: inset 6px 0 0 #8f67cf, 0 6px 16px rgba(80, 50, 20, 0.14); }
.map-bundle-node[data-slot="b"] { box-shadow: inset 6px 0 0 #389d62, 0 6px 16px rgba(80, 50, 20, 0.14); }
.map-bundle-node[data-slot="c"] { box-shadow: inset 6px 0 0 #d88d32, 0 6px 16px rgba(80, 50, 20, 0.14); }
.map-bundle-node[data-slot="d"] { box-shadow: inset 6px 0 0 #2f6fb0, 0 6px 16px rgba(80, 50, 20, 0.14); }
.map-bundle-node[data-slot="e"] { box-shadow: inset 6px 0 0 #b84532, 0 6px 16px rgba(80, 50, 20, 0.14); }
.map-bundle-node[data-slot="f"] { box-shadow: inset 6px 0 0 #6f4b22, 0 6px 16px rgba(80, 50, 20, 0.14); }

.map-bundle-name {
  color: #2f2116;
  font-size: 18px;
  font-weight: 950;
  line-height: 1.16;
  text-align: center;
  white-space: nowrap;
}

.map-bundle-meta {
  justify-self: center;
  border-radius: 999px;
  background: rgba(241, 226, 191, 0.9);
  color: #6f4b22;
  padding: 3px 12px;
  font-size: 12.5px;
  font-weight: 950;
  text-align: center;
}

.map-bundle-node.done .map-bundle-meta {
  background: rgba(223, 243, 228, 0.95);
  color: #1f7549;
}

.map-item-strip {
  display: grid;
  grid-template-columns: repeat(var(--item-cols), minmax(0, 1fr));
  gap: 6px;
  min-width: 0;
  justify-content: center;
  justify-items: center;
}

.map-item {
  position: relative;
  display: grid;
  justify-items: center;
  gap: 2px;
  min-width: 0;
  min-height: 70px;
  border: 1px solid rgba(140, 110, 70, 0.22);
  border-radius: 10px;
  background: rgba(255, 250, 238, 0.9);
  padding: 6px 5px 5px;
  color: #2b2118;
  text-align: center;
  cursor: pointer;
  user-select: none;
}

.map-item:hover {
  border-color: #cda766;
  background: #fff6df;
}

.map-item.checked {
  border-color: rgba(76, 145, 91, 0.4);
  background: rgba(233, 247, 229, 0.9);
}

.map-item.highlight {
  outline: 3px solid rgba(47, 111, 176, 0.3);
  border-color: var(--blue);
}

.map-item input {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  opacity: 0;
  cursor: pointer;
}

.map-item.checked::after {
  content: "✓";
  position: absolute;
  right: 5px;
  bottom: 3px;
  color: var(--green);
  font-size: 12px;
  font-weight: 950;
}

.map-item-name {
  justify-self: center;
  width: 100%;
  max-width: 100%;
  overflow: hidden;
  color: #3c2a1d;
  font-size: 11.5px;
  font-weight: 850;
  line-height: 1.15;
  text-align: center;
  white-space: normal;
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
}

.map-item-count {
  justify-self: center;
  width: 100%;
  color: var(--red);
  font-size: 11px;
  font-weight: 950;
  line-height: 1;
  text-align: center;
}

.map-item .icon-wrap,
.map-item .icon,
.map-item .fallback-icon {
  width: 28px;
  height: 28px;
}

.icon-wrap {
  position: relative;
  display: grid;
  place-items: center;
  justify-self: center;
  width: 28px;
  height: 28px;
}

.icon {
  display: block;
  justify-self: center;
  width: 28px;
  height: 28px;
  margin: 0 auto;
  image-rendering: pixelated;
  object-fit: contain;
  object-position: center center;
}

.quality {
  position: absolute;
  right: -5px;
  bottom: -5px;
  width: 15px;
  height: 15px;
  image-rendering: pixelated;
}

.fallback-icon {
  display: grid;
  place-items: center;
  justify-self: center;
  border-radius: 6px;
  background: #f0dfbd;
  color: #6c4b28;
  font-size: 14px;
  font-weight: 950;
  text-align: center;
}

.map-tree-lines {
  position: absolute;
  inset: 18px;
  z-index: 2;
  width: calc(100% - 36px);
  height: calc(100% - 36px);
  pointer-events: none;
}

.map-tree-lines line {
  stroke: rgba(255, 248, 232, 0.72);
  stroke-width: 2;
  stroke-linecap: round;
  filter: drop-shadow(0 1px 2px rgba(80, 50, 20, 0.24));
}

.map-room-core { display: none; }

.image-fallback {
  display: grid;
  place-items: center;
  min-height: 74px;
  border: 2px dashed #d9bf8b;
  border-radius: 8px;
  background: #f5e7c9;
  color: #6f4b22;
  padding: 8px;
  font-size: 12px;
  font-weight: 900;
  text-align: center;
}

.visual-caption {
  margin: 7px 0 0;
  color: var(--muted);
  font-size: 12px;
  font-weight: 900;
  text-align: center;
}

.room-detail-list {
  display: grid;
  gap: 14px;
}

.bundle-detail-card {
  --bundle-accent: #8f67cf;
  position: relative;
  overflow: hidden;
  border: 2px solid #e1d3ad;
  border-radius: 14px;
  background:
    linear-gradient(180deg, rgba(255, 253, 247, 0.96), rgba(255, 250, 239, 0.94)),
    var(--paper);
  padding: 16px 16px 16px 26px;
  box-shadow: 0 8px 20px rgba(80, 50, 20, 0.08);
}

.bundle-detail-card::before {
  content: "";
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 9px;
  background: var(--bundle-accent);
  box-shadow: 6px 0 14px rgba(80, 50, 20, 0.08);
}

.bundle-detail-card[data-slot="a"] { --bundle-accent: #8f67cf; }
.bundle-detail-card[data-slot="b"] { --bundle-accent: #389d62; }
.bundle-detail-card[data-slot="c"] { --bundle-accent: #d88d32; }
.bundle-detail-card[data-slot="d"] { --bundle-accent: #2f6fb0; }
.bundle-detail-card[data-slot="e"] { --bundle-accent: #b84532; }
.bundle-detail-card[data-slot="f"] { --bundle-accent: #6f4b22; }

.bundle-detail-card.done {
  border-color: rgba(74, 154, 95, 0.45);
  background:
    linear-gradient(180deg, rgba(249, 255, 246, 0.96), rgba(240, 250, 233, 0.94)),
    var(--green-soft);
}

.bundle-detail-head {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 12px;
  align-items: start;
  margin-bottom: 12px;
}

.bundle-detail-title {
  margin: 0;
  color: #231a12;
  font-size: 24px;
  font-weight: 950;
  line-height: 1.16;
  letter-spacing: 0;
}

.bundle-detail-sub {
  margin: 6px 0 0;
  color: #6f6253;
  font-size: 15px;
  font-weight: 750;
  line-height: 1.35;
}

.bundle-detail-index {
  color: #9a6a2b;
  font-weight: 950;
}

.bundle-detail-rule {
  border-radius: 999px;
  background: #eee2c5;
  color: #5f4528;
  padding: 7px 14px;
  font-size: 17px;
  font-weight: 950;
  line-height: 1;
  white-space: nowrap;
}

.bundle-detail-card.done .bundle-detail-rule {
  background: #dff3e4;
  color: #208049;
}

.detail-items {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px 12px;
}

.detail-item {
  position: relative;
  display: grid;
  grid-template-columns: 42px minmax(0, 1fr);
  gap: 10px;
  align-items: center;
  min-height: 62px;
  border: 2px solid #e3d7bb;
  border-radius: 10px;
  background: rgba(255, 252, 244, 0.95);
  padding: 8px 14px 8px 10px;
  color: #221910;
  cursor: pointer;
  user-select: none;
}

.detail-item:hover {
  border-color: #d0ac72;
  background: #fff7e6;
}

.detail-item.checked {
  border-color: rgba(74, 154, 95, 0.46);
  background: rgba(232, 247, 227, 0.92);
}

.detail-item.highlight {
  outline: 3px solid rgba(47, 111, 176, 0.26);
  border-color: var(--blue);
}

.detail-item input {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  opacity: 0;
  cursor: pointer;
}

.detail-item.checked::after {
  content: "✓";
  position: absolute;
  right: 14px;
  top: 50%;
  color: var(--green);
  font-size: 24px;
  font-weight: 950;
  transform: translateY(-50%);
}

.detail-item .icon-wrap,
.detail-item .icon,
.detail-item .fallback-icon {
  width: 36px;
  height: 36px;
}

.detail-item .quality {
  width: 15px;
  height: 15px;
}

.detail-item-name {
  overflow-wrap: anywhere;
  font-size: 19px;
  font-weight: 950;
  line-height: 1.15;
}

.detail-item-count {
  display: inline-block;
  margin-left: 4px;
  color: var(--red);
  font-size: 14px;

  .room[data-room-id="pantry"] .map-bundle-node[data-bundle-id="quality-crops"],
  .room[data-room-id="pantry"] .map-bundle-node[data-bundle-id="animal"],
  .room[data-room-id="fish"] .map-bundle-node[data-bundle-id="night-fish"],
  .room[data-room-id="fish"] .map-bundle-node[data-bundle-id="specialty-fish"] {
    width: 96px !important;
    max-width: 96px !important;
  }

  .room[data-room-id="crafts"] .map-bundle-node[data-bundle-id="exotic-forage"],
  .room[data-room-id="pantry"] .map-bundle-node[data-bundle-id="artisan"],
  .room[data-room-id="fish"] .map-bundle-node[data-bundle-id="crab-pot"] {
    width: 114px !important;
    max-width: 114px !important;
  }

  .visual-caption {
    display: none !important;
  }

  .bundle-detail-card {
    padding: 12px 10px 12px 18px;
  }

  .bundle-detail-head {
    grid-template-columns: minmax(0, 1fr) auto;
    align-items: start;
    gap: 6px;
    margin-bottom: 8px;
  }

  .bundle-detail-title {
    font-size: 18px;
    line-height: 1.1;
  }

  .bundle-detail-sub {
    font-size: 12px;
    line-height: 1.18;
  }

  .bundle-detail-rule {
    justify-self: end;
    align-self: start;
    padding: 5px 10px;
    font-size: 12px;
  }

  .detail-items {
    gap: 6px;
  }

  .detail-item {
    grid-template-columns: 28px minmax(0, 1fr);
    min-height: 43px;
    padding: 5px 22px 5px 8px;
  }

  .detail-item .icon-wrap,
  .detail-item .icon,
  .detail-item .fallback-icon {
    width: 26px;
    height: 26px;
  }

  .detail-item-name {
    font-size: 14px;
    line-height: 1.08;
  }

  .detail-item.checked::after {
    font-size: 18px;
  }

  .bundle-detail-card:not(.active) {
    display: none;
  }

  .room[data-room-id="missing"] .map-bundle-node[data-bundle-id="missing-bundle"] {
    width: 150px !important;
    max-width: 150px !important;
  }

  .room[data-room-id="missing"] .map-bundle-node[data-bundle-id="missing-bundle"] .map-item-strip {
    max-width: 122px !important;
    margin: 0 auto;
    flex-wrap: nowrap;
  }

  .room[data-room-id="missing"] .map-bundle-node[data-bundle-id="missing-bundle"] .map-item .icon-wrap,
  .room[data-room-id="missing"] .map-bundle-node[data-bundle-id="missing-bundle"] .map-item .icon,
  .room[data-room-id="missing"] .map-bundle-node[data-bundle-id="missing-bundle"] .map-item .fallback-icon {
    width: 13px !important;
    height: 13px !important;
  }

  .detail-item-count {
    display: inline;
    margin: 0 0 0 3px;
    font-size: 11px;
    vertical-align: baseline;
  }
}

/* ===== v13：按最新手机批注压缩搜索区、微调字号与树状图留白 ===== */
@media (max-width: 520px) {
  .assistant-panel {
    margin-bottom: 4px !important;
  }

  .search-panel {
    margin-bottom: 2px !important;
    padding: 6px !important;
  }

  .search-box {
    grid-template-columns: minmax(0, 1fr) 38px 38px !important;
    gap: 5px !important;
  }

  .search-input {
    min-height: 36px !important;
    padding: 0 10px !important;
    font-size: 14px !important;
  }

  .clear-button,
  .search-button {
    display: grid !important;
    place-items: center !important;
    width: 38px !important;
    min-width: 38px !important;
    min-height: 36px !important;
    padding: 0 !important;
    line-height: 1 !important;
  }

  .clear-button {
    font-size: 27px !important;
  }

  .search-button {
    font-size: 25px !important;
  }

  .progress-panel {
    margin-bottom: 7px !important;
  }

  .category {
    border: 2px solid #f0d8a8 !important;
    background: linear-gradient(135deg, #fffef9, #fff8e8) !important;
  }

  .center-map-stage-ref .center-ref-title-dom {
    height: calc(var(--box-h) * 0.76) !important;
    padding: 0 3px !important;
    font-size: clamp(7.6px, 2vw, 9.4px) !important;
  }

  .center-map-stage-ref .center-ref-note-dom {

    font-weight: 750 !important;

  }

  .room-title-link {
    border-color: rgba(138, 90, 53, 0.22) !important;
    background: linear-gradient(180deg, rgba(246, 229, 190, 0.98), rgba(232, 207, 156, 0.98)) !important;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.52), 0 2px 7px rgba(95, 58, 34, 0.12) !important;
  }

  .room[data-room-id="crafts"] .map-bundle-node[data-bundle-id="exotic-forage"] {
    width: 126px !important;
    max-width: 126px !important;
  }

  .room[data-room-id="crafts"] .map-bundle-node[data-bundle-id="exotic-forage"] .map-bundle-name {
    font-size: 10.2px !important;
  }

  .bundle-detail-title {
    line-height: 1.18 !important;
  }

  .bundle-detail-sub {
    margin-top: 5px !important;
    color: #6f6254 !important;
    font-weight: 600 !important;
    line-height: 1.36 !important;
  }

  .detail-item {
    border-width: 2px !important;
    border-color: #decca6 !important;
  }
}

/* ===================== 主工具样式 ===================== */
.app-shell {
  width: min(1180px, calc(100% - 18px));
  margin: 0 auto;
  padding: 14px 0 24px;
}

.app-hero {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-bottom: 7px;
  padding: 8px 14px;
  border: 2px solid var(--wood-dark);
  border-radius: 10px;
  background: linear-gradient(180deg, #b07a48, var(--wood));
  color: #fff7e8;
  box-shadow: var(--shadow);
}

.app-hero h1 { margin: 0; font-size: 16px; line-height: 1.12; }
.app-hero p.kicker { display: none; }
.app-hero-actions { display: flex; gap: 8px; }

.app-hero-actions button {
  min-height: 38px;
  padding: 0 14px;
  border: 2px solid rgba(255,255,255,0.5);
  border-radius: 8px;
  background: rgba(255, 250, 240, 0.16);
  color: #fff7e8;
  font-weight: 800;
  font-size: 14px;
}

.app-hero-actions button:hover { background: rgba(255,250,240,0.26); }
.app-hero-actions button.primary { background: #f4c77f; color: #5f3a22; border-color: #d39c5f; }
.app-hero-actions button.primary:hover { background: #f6d294; }

.app-panel {
  margin-bottom: 7px;
  padding: 8px 10px 9px;
  border: 1px solid #e2d0aa;
  border-radius: 10px;
  background: rgba(255, 250, 240, 0.94);
  box-shadow: 0 6px 16px rgba(76, 49, 29, 0.06);
}

.app-panel-title {
  margin: 0 0 6px;
  font-size: 13px;
  font-weight: 900;
  color: var(--wood-dark);
  display: flex;
  align-items: center;
  gap: 6px;
}

.app-panel-title .subtle {
  color: var(--muted);
  font-size: 13px;
  font-weight: 700;
}

/* 季节天气栏 */
.season-bar {
  display: flex;
  flex-wrap: nowrap;
  gap: 4px;
  align-items: center;
  padding: 5px 8px;
  border: 1px solid #e2d0aa;
  border-radius: 10px;
  background: linear-gradient(180deg, #fff7e6, #f9ecc8);
  margin-bottom: 7px;
  overflow-x: auto;
}
.season-bar::-webkit-scrollbar { height: 0; }

.season-current {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 4px;
  font-weight: 900;
  font-size: 12px;
  color: var(--wood-dark);
  margin: 0 3px;
  white-space: nowrap;
}

.season-pill {
  flex-shrink: 0;
  padding: 3px 9px;
  border: 1.5px solid var(--line);
  border-radius: 999px;
  background: var(--paper);
  color: var(--muted);
  font-size: 11px;
  font-weight: 800;
  cursor: pointer;
  white-space: nowrap;
}
.season-pill.active { background: var(--gold); color: #fff; border-color: var(--gold); }
.weather-toggle {
  flex-shrink: 0;
  padding: 3px 9px;
  border: 1.5px solid var(--line);
  border-radius: 999px;
  background: #fffce0;
  font-size: 11px;
  font-weight: 800;
  cursor: pointer;
  white-space: nowrap;
}
.weather-toggle.rainy { background: #d8ecf6; border-color: #8db8d6; }
.day-input { flex-shrink: 0; width: 38px; padding: 2px 4px; border: 1.5px solid var(--line); border-radius: 5px; text-align: center; font-weight: 800; font-size: 12px; }
.day-step { flex-shrink: 0; padding: 2px 7px; border: 1.5px solid var(--line); border-radius: 5px; background: var(--paper); font-weight: 900; cursor: pointer; font-size: 12px; }

/* 当季主线 */
.quest-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 5px;
}
@media (min-width: 720px) {
  .quest-grid { grid-template-columns: repeat(3, 1fr); }
}

.quest-card {
  position: relative;
  min-width: 0;
  padding: 6px 8px 6px 12px;
  border: 1.5px solid #e2d0aa;
  border-radius: 9px;
  background: #fffdf6;
  box-shadow: inset 4px 0 0 var(--gold);
}
.quest-card[data-priority="urgent"] { box-shadow: inset 5px 0 0 var(--red); }
.quest-card[data-priority="festival"] { box-shadow: inset 5px 0 0 #b884c8; }
.quest-card[data-priority="info"] { box-shadow: inset 5px 0 0 var(--blue); }
.quest-card.added { background: var(--green-soft); box-shadow: inset 5px 0 0 var(--green); }

.quest-card-head {
  display: flex;
  justify-content: space-between;
  gap: 6px;
  align-items: flex-start;
  margin-bottom: 2px;
}

.quest-title { font-size: 12.5px; font-weight: 900; color: var(--ink); line-height: 1.2; }
.quest-day { font-size: 10px; font-weight: 800; color: var(--muted); white-space: nowrap; }
.quest-reason { font-size: 11px; color: var(--muted); line-height: 1.35; margin-top: 2px; }

.quest-actions {
  margin-top: 4px;
  display: flex;
  gap: 6px;
}

.quest-add-btn {
  padding: 3px 10px;
  border: 1.5px solid #d39c5f;
  border-radius: 6px;
  background: #f4c77f;
  color: #5f3a22;
  font-size: 11px;
  font-weight: 900;
  cursor: pointer;
}
.quest-add-btn.added { background: var(--green-soft); color: var(--green); border-color: #88c19a; cursor: default; }

/* 目标列表 */
.goals-empty {
  text-align: center;
  padding: 24px 16px;
  color: var(--muted);
  font-size: 13px;
  border: 1.5px dashed var(--line);
  border-radius: 10px;
}

.goal-card {
  border: 1.5px solid #e2d0aa;
  border-radius: 10px;
  background: #fffdf6;
  margin-bottom: 8px;
  overflow: hidden;
}
.goal-card.complete { background: var(--green-soft); border-color: #88c19a; }

.goal-head {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  background: rgba(138, 90, 53, 0.06);
  cursor: pointer;
  border: none;
  width: 100%;
  text-align: left;
  font: inherit;
  color: inherit;
}
.goal-card.complete .goal-head { background: rgba(45, 138, 95, 0.08); }
.goal-emoji { font-size: 22px; }
.goal-info { flex: 1; min-width: 0; }
.goal-title { font-size: 14px; font-weight: 900; color: var(--ink); }
.goal-card.complete .goal-title { color: var(--green); }
.goal-meta { font-size: 11px; color: var(--muted); margin-top: 1px; }
.goal-how {
  display: inline-block;
  margin-top: 2px;
  padding: 1px 7px;
  font-size: 10px;
  font-weight: 800;
  border-radius: 4px;
}
.goal-how.craft   { background: #fff0d2; color: #9c620e; }
.goal-how.build   { background: #e0eef8; color: #2c5d8a; }
.goal-how.upgrade { background: #ecdcf3; color: #6e3a85; }
.goal-how.self    { background: var(--green-soft); color: var(--green); }

.goal-progress { text-align: right; min-width: 60px; }
.goal-frac { font-size: 12px; font-weight: 900; color: var(--gold); }
.goal-card.complete .goal-frac { color: var(--green); }
.goal-bar { width: 56px; height: 5px; background: #eadfc9; border-radius: 999px; overflow: hidden; margin-top: 3px; }
.goal-bar-fill { height: 100%; background: linear-gradient(90deg, var(--gold), var(--green)); transition: width 0.3s ease; }

.goal-body { padding: 4px 12px 12px; }
.goal-note { font-size: 12px; color: var(--gold); font-weight: 800; margin-bottom: 6px; }
.goal-step {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 7px 0;
  border-bottom: 1px solid #f0e3c8;
  cursor: pointer;
  background: none;
  border-left: none;
  border-right: none;
  border-top: none;
  width: 100%;
  text-align: left;
  font: inherit;
  color: inherit;
}
.goal-step:last-of-type { border-bottom: none; }
.goal-step-check {
  width: 20px; height: 20px;
  border: 2px solid var(--line);
  border-radius: 5px;
  display: flex; align-items: center; justify-content: center;
  background: #fff; flex-shrink: 0; margin-top: 1px;
  font-size: 12px; color: #fff; font-weight: 900;
}
.goal-step.done .goal-step-check { background: var(--green); border-color: var(--green); }
.goal-step-text { font-size: 13px; font-weight: 700; }
.goal-step.done .goal-step-text { color: var(--muted); text-decoration: line-through; }
.goal-step-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
.goal-step-have { font-size: 11px; font-weight: 800; color: var(--green); margin-top: 2px; }
.goal-remove {
  margin-top: 8px;
  width: 100%;
  padding: 7px 0;
  border: 1px solid #e8c4be;
  border-radius: 7px;
  background: #fdf0ee;
  color: var(--red);
  font-size: 12px;
  font-weight: 800;
  cursor: pointer;
}

/* 背包 */
.inventory-summary {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 8px;
}
.inv-chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 10px 4px 6px;
  border: 1px solid #e2d0aa;
  border-radius: 999px;
  background: #fffdf6;
  font-size: 12px;
  font-weight: 800;
}
.inv-chip img, .inv-chip .fallback-icon { width: 18px; height: 18px; }
.inv-chip .inv-count { color: var(--gold); }

.inv-suggestion {
  font-size: 12.5px;
  padding: 7px 0;
  display: flex;
  align-items: flex-start;
  gap: 6px;
  line-height: 1.45;
}
.inv-suggestion + .inv-suggestion { border-top: 1px dashed #e2d0aa; }
.inv-suggestion .badge {
  font-size: 10px;
  font-weight: 900;
  padding: 2px 7px;
  border-radius: 4px;
  background: var(--green-soft);
  color: var(--green);
  white-space: nowrap;
  flex-shrink: 0;
  margin-top: 1px;
}
.inv-suggestion .badge.recommend { background: #fff0d2; color: #9c620e; }
.inv-suggestion .badge.bundle { background: #e0eef8; color: #2c5d8a; }
.inv-suggestion .badge.goal { background: var(--green-soft); color: var(--green); }
.inv-empty {
  padding: 14px 8px;
  text-align: center;
  color: var(--muted);
  font-size: 12.5px;
  line-height: 1.6;
}

.add-item-btn {
  width: 100%;
  padding: 10px;
  border: 1.5px dashed var(--gold);
  border-radius: 10px;
  background: #fffce8;
  color: var(--wood-dark);
  font-size: 14px;
  font-weight: 900;
  cursor: pointer;
}
.add-item-btn:hover { background: #fff6db; }

/* 物品录入浮层 */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(60, 40, 20, 0.5);
  z-index: 90;
  display: flex;
  align-items: flex-end;
  justify-content: center;
}
.modal-sheet {
  width: 100%;
  max-width: 720px;
  height: 86vh;
  background: var(--paper);
  border-radius: 18px 18px 0 0;
  padding: 12px 12px 14px;
  border-top: 3px solid var(--wood);
}
@media (min-width: 720px) {
  .modal-backdrop { align-items: center; }
  .modal-sheet { border-radius: 16px; height: 80vh; max-height: 720px; border-top: none; border: 2px solid var(--wood); }
}
.modal-grip { width: 48px; height: 5px; background: var(--wood); opacity: 0.4; border-radius: 999px; margin: 0 auto 12px; cursor: grab; }
.modal-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
}
.modal-title { margin: 0; font-size: 17px; font-weight: 900; color: var(--wood-dark); }
.modal-close {
  width: 32px; height: 32px;
  border: 1.5px solid var(--line);
  border-radius: 8px;
  background: var(--paper-deep);
  font-size: 16px;
  font-weight: 900;
  cursor: pointer;
}

/* 物品大网格 - 信息密度优先 */
.item-cat-tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  padding-bottom: 8px;
  margin-bottom: 8px;
  border-bottom: 1px solid var(--line);
}
.item-cat-tab {
  padding: 4px 9px;
  border: 1.5px solid var(--line);
  border-radius: 999px;
  background: var(--paper);
  font-size: 11.5px;
  font-weight: 800;
  cursor: pointer;
  white-space: nowrap;
  color: var(--muted);
}
.item-cat-tab.active { background: var(--gold); color: #fff; border-color: var(--gold); }

.item-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(64px, 1fr));
  gap: 6px;
}
.item-tile {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 6px 3px 4px;
  border: 1.5px solid #e2d0aa;
  border-radius: 8px;
  background: #fffdf6;
  cursor: pointer;
  min-height: 64px;
}
.item-tile:active { background: #fff3d6; }
.item-tile.has { border-color: var(--green); background: var(--green-soft); }
.item-tile img, .item-tile .fallback-icon { width: 28px; height: 28px; image-rendering: pixelated; }
.item-tile-name {
  font-size: 10px;
  font-weight: 700;
  color: var(--ink);
  text-align: center;
  line-height: 1.1;
  margin-top: 2px;
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
}
.item-tile-count {
  position: absolute;
  top: -6px;
  right: -6px;
  background: var(--gold);
  color: #fff;
  font-size: 11px;
  font-weight: 900;
  padding: 1px 6px;
  border-radius: 999px;
  border: 2px solid var(--paper);
  min-width: 22px;
  text-align: center;
}

/* 数量编辑浮窗 - 紧凑居中 */
.qty-backdrop {
  position: fixed; inset: 0;
  z-index: 200;
  background: rgba(60,40,20,0.35);
  display: flex; align-items: center; justify-content: center;
  padding: 16px;
}
.qty-popover {
  width: 100%;
  max-width: 290px;
  background: #fff;
  border: 2px solid var(--wood);
  border-radius: 14px;
  padding: 12px 12px 10px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.25);
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.qty-popover .qty-title { font-weight: 900; font-size: 14px; text-align: center; display: flex; align-items: center; gap: 6px; justify-content: center; margin-bottom: 2px; }
.qty-popover .qty-title img, .qty-popover .qty-title .fallback-icon { width: 22px; height: 22px; }
.qty-row { display: flex; align-items: center; gap: 4px; }
.qty-btn {
  flex: 1;
  min-width: 0;
  height: 34px;
  border: 1.5px solid var(--line);
  border-radius: 6px;
  background: var(--paper-deep);
  font-size: 13px;
  font-weight: 900;
  cursor: pointer;
  padding: 0;
}
.qty-btn.minus { background: #fde9e6; border-color: #e6b8b0; color: var(--red); }
.qty-btn.plus { background: #e9f6e6; border-color: #a6cf9a; color: var(--green); }
.qty-input {
  flex: 1.4;
  min-width: 0;
  height: 38px;
  text-align: center;
  border: 2px solid var(--line);
  border-radius: 6px;
  font-size: 18px;
  font-weight: 900;
  padding: 0;
}
.qty-actions { display: flex; gap: 6px; margin-top: 4px; }
.qty-actions button { flex: 1; min-height: 36px; border-radius: 6px; font-weight: 900; cursor: pointer; font-size: 13px; }
.qty-confirm { background: var(--green); color: #fff; border: 2px solid var(--green); }
.qty-cancel { background: var(--paper-deep); color: var(--ink); border: 2px solid var(--line); }
.qty-clear { background: #fde9e6; color: var(--red); border: 2px solid #e6b8b0; }
.qty-hint {
  font-size: 11px;
  color: var(--muted);
  text-align: center;
  padding: 4px 6px;
  background: #fffce8;
  border-radius: 6px;
  line-height: 1.35;
}
.qty-hint b { color: var(--gold); }

/* 工具/设备/建筑 */
.equip-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 6px;
}
/* 设备 / 建筑统一行式 */
.equip-row {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 8px;
  border: 1.5px solid var(--line);
  border-radius: 7px;
  background: var(--paper);
  font-size: 12.5px;
  font-weight: 700;
}
.equip-row.has { background: var(--green-soft); border-color: #88c19a; }
.equip-row .tool-icon { font-size: 18px; }
.equip-row .tool-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.equip-mini-btn {
  width: 26px; height: 26px;
  border: 1.5px solid var(--line);
  border-radius: 6px;
  background: var(--paper-deep);
  font-size: 13px;
  font-weight: 900;
  cursor: pointer;
  padding: 0;
  flex-shrink: 0;
}
.equip-mini-btn.minus { background: #fde9e6; border-color: #e6b8b0; color: var(--red); }
.equip-mini-btn.plus { background: #e9f6e6; border-color: #a6cf9a; color: var(--green); }
.equip-mini-btn.check { width: 38px; }
.equip-mini-btn.check.has { background: var(--green); color: #fff; border-color: var(--green); }
.equip-count-display {
  min-width: 28px;
  text-align: center;
  font-weight: 900;
  color: var(--gold);
  font-size: 13px;
}
.equip-row.has .equip-count-display { color: var(--green); }

.tool-level-picker {
  display: flex;
  gap: 4px;
  margin-top: 4px;
}
.tool-level-picker button {
  flex: 1;
  padding: 5px 0;
  border: 1.5px solid var(--line);
  border-radius: 5px;
  background: var(--paper);
  font-size: 11px;
  font-weight: 800;
  cursor: pointer;
}
.tool-level-picker button.active { background: var(--gold); color: #fff; border-color: var(--gold); }

/* 物品决策面板 */
.decision-panel {
  margin-top: 8px;
}
.decision-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 10px;
  border: 1px solid var(--line);
  border-radius: 7px;
  background: #fffdf6;
  margin-bottom: 4px;
  font-size: 13px;
}
.decision-row.best { background: var(--green-soft); border-color: #88c19a; }
.decision-row .badge {
  font-size: 10px;
  font-weight: 900;
  padding: 2px 6px;
  border-radius: 4px;
  background: var(--gold);
  color: #fff;
}
.decision-price { color: var(--gold); font-weight: 900; margin-left: auto; }


/* 添加目标 - 可展开 tile */
.goal-tile-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 6px;
}
@media (min-width: 720px) {
  .goal-tile-grid { grid-template-columns: 1fr 1fr; }
}
.goal-tile-wrap {
  border: 1.5px solid var(--line);
  border-radius: 9px;
  background: var(--paper);
  overflow: hidden;
}
.goal-tile-wrap.has { background: var(--green-soft); border-color: #88c19a; }
.goal-tile {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 9px 11px;
  border: none;
  background: transparent;
  font: inherit;
  cursor: pointer;
  text-align: left;
  font-weight: 700;
}
.goal-tile .tool-icon { font-size: 19px; }
.goal-tile .tool-name { flex: 1; min-width: 0; font-size: 13px; }
.goal-tile .tool-level {
  font-size: 10.5px;
  font-weight: 900;
  padding: 1.5px 8px;
  border-radius: 4px;
  background: var(--paper-deep);
  color: var(--wood-dark);
}
.goal-tile-wrap.has .tool-level { background: var(--green); color: #fff; }
.goal-tile-detail {
  padding: 6px 12px 11px;
  border-top: 1px dashed var(--line);
  background: rgba(255, 252, 242, 0.6);
}
.goal-tile-note {
  font-size: 11px;
  color: var(--gold);
  font-weight: 800;
  margin-bottom: 4px;
}
.goal-tile-step {
  font-size: 12px;
  padding: 3px 0;
  color: var(--ink);
  display: flex;
  align-items: baseline;
  gap: 6px;
}
.goal-tile-step.ok { color: var(--green); font-weight: 800; }
.goal-tile-step .have {
  font-size: 10.5px;
  color: var(--muted);
  font-weight: 700;
}
.goal-tile-step.ok .have { color: var(--green); }
.goal-tile-confirm {
  margin-top: 9px;
  width: 100%;
  padding: 8px 0;
  border: 1.5px solid var(--gold);
  border-radius: 7px;
  background: #f4c77f;
  color: #5f3a22;
  font-size: 13px;
  font-weight: 900;
  cursor: pointer;
}

/* 目标卡片左滑删除 */
.goal-card-container {
  position: relative;
  margin-bottom: 8px;
  border-radius: 12px;
  overflow: hidden;
  background: var(--red);
}
.goal-card-container::before {
  content: "🗑️  松开删除";
  position: absolute;
  top: 0; right: 0; bottom: 0;
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  padding-right: 22px;
  color: #fff;
  font-weight: 900;
  font-size: 13.5px;
  pointer-events: none;
  letter-spacing: 0.5px;
}
.goal-card-container > .goal-card {
  position: relative;
  margin-bottom: 0;
  will-change: transform;
  touch-action: pan-y;
}

/* 浮窗固定高度 - 内部滚动 */
.modal-sheet {
  display: flex !important;
  flex-direction: column;
}
.modal-grip, .modal-head, .item-cat-tabs { flex-shrink: 0; }
#invModalBody, #addGoalBody {
  flex: 1;
  overflow-y: auto;
  padding-right: 3px;
  min-height: 0;
}

/* ===================== 献祭OVERLAY样式 ===================== */
.bundle-overlay {
  position: fixed;
  inset: 0;
  z-index: 80;
  background: var(--bg);
  overflow-y: auto;
  animation: bundleSlideUp 0.22s ease-out;
}
@keyframes bundleSlideUp {
  from { transform: translateY(100%); opacity: 0.5; }
  to   { transform: translateY(0); opacity: 1; }
}
.bundle-overlay[hidden] { display: none; }
.bundle-overlay-close {
  position: sticky;
  top: 0;
  z-index: 5;
  background: var(--wood);
  color: #fff7e8;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 9px 14px;
  border-bottom: 2px solid var(--wood-dark);
}
.bundle-overlay-close .ttl { font-weight: 900; font-size: 14px; letter-spacing: 0.5px; }
.bundle-overlay-close button {
  min-height: 32px;
  padding: 0 14px;
  border: 1.5px solid rgba(255,255,255,0.5);
  border-radius: 7px;
  background: rgba(255,250,240,0.16);
  color: #fff7e8;
  font-weight: 900;
  font-size: 13px;
  cursor: pointer;
}

/* 微瑕修复：禁止地图卡片内勾选 */
.map-item { cursor: pointer !important; }
.map-item input[type="checkbox"] { pointer-events: none !important; }

      return { id, name, rule, reward, required, items };

    function bindEvents() {
      document.addEventListener("change", (event) => {
        const checkbox = event.target.closest("[data-item-id]");
        if (!checkbox) return;
        setChecked(checkbox.dataset.itemId, checkbox.checked);
      });

      document.addEventListener("click", (event) => {
        if (event.target.closest("#resetChecks")) {
          if (!confirm("确定要清空所有勾选吗？")) return;
          state.checked.clear();
          saveCheckedItems();
          render();
          return;
        }

        if (event.target.closest("#showMissing")) {
          state.showMissingOnly = !state.showMissingOnly;
          document.getElementById("showMissing").textContent = state.showMissingOnly ? "显示全部" : "只看未完成";
          applyVisibility();
          scheduleLayout();
          return;
        }

        const result = event.target.closest("[data-jump-id]");
        if (result) focusItem(result.dataset.jumpId);

        const mapBundle = event.target.closest(".map-bundle-node[data-bundle-id]");
        if (mapBundle && !event.target.closest(".map-item")) {
          activateBundleDetail(mapBundle.closest(".room"), mapBundle.dataset.bundleId);
        }

        if (event.target.closest("#jumpSearch")) jumpToFirstSearchResult();
      });

      document.getElementById("itemSearch").addEventListener("input", (event) => {
        state.query = event.target.value.trim();
        renderSearchResults();
        markHighlights();
      });

      document.getElementById("itemSearch").addEventListener("keydown", (event) => {
        if (event.key !== "Enter") return;
        jumpToFirstSearchResult();
      });

      document.getElementById("clearSearch").addEventListener("click", () => {
        state.query = "";
        document.getElementById("itemSearch").value = "";
        renderSearchResults();
        markHighlights();
      });

      window.addEventListener("resize", scheduleLayout);
      window.addEventListener("load", scheduleLayout);
      bindLayoutImages(document);
    }

    function handleImageError(event) {
      const image = event.target;
      if (!(image instanceof HTMLImageElement)) return;
      if (image.dataset.failed) return;
      image.dataset.failed = "true";
      if (image.classList.contains("quality")) {
        image.remove();
        return;
      }

      const label = image.dataset.fallback || image.alt || "图片暂不可用";
      const fallbackClass = image.classList.contains("icon") ? "fallback-icon" : "image-fallback";
      image.replaceWith(fallbackNode(label, fallbackClass));
      scheduleLayout();
    }

    function render() {
      document.getElementById("rooms").innerHTML = rooms.map(renderRoom).join("");

      scheduleLayout();

    function renderRoom(roomData) {
      const checked = countCheckedInRoom(roomData);
      const total = roomData.bundles.reduce((sum, bundleData) => sum + bundleData.required, 0);
      return `
        <article class="room" id="room-${roomData.id}" data-room-id="${roomData.id}">
          <header class="room-header">
            <div>
              <h2 class="room-title"><a class="room-title-link" href="#center-map-section" aria-label="返回社区中心地图"><span>${roomData.icon}</span><span class="room-title-text">${escapeHtml(roomData.name)}</span></a></h2>
              <p class="room-meta">${escapeHtml(roomData.unlock)} · 奖励：${escapeHtml(roomData.reward)}</p>
            </div>
            <div class="room-badge">${checked} / ${total}</div>
          </header>
          <div class="room-body">
            ${renderRoomVisuals(roomData)}
          </div>
        </article>
      `;
    }

    function renderRoomVisuals(roomData) {
      const roomImage = roomImages[roomData.id];
      const mapLayout = getBundleMapLayout(roomData);
      const core = mapLayout.core;
      return `
        <figure class="room-scene-card">
          <div class="room-scene">
            ${roomImage ? renderExternalImage("room-scene-bg", roomImage, `${roomData.name}房间背景`) : renderImageFallback(`${roomData.name}房间背景`)}
            ${renderMapLines(mapLayout)}
            <div class="map-room-core" style="--x:${core.x}%;--y:${core.y}%">${escapeHtml(roomData.name)}</div>
            <div class="map-bundle-grid" data-count="${roomData.bundles.length}">
              ${roomData.bundles.map((bundleData, bundleIndex) => renderMapBundle(roomData, bundleData, bundleIndex, mapLayout)).join("")}
            </div>
          </div>
          <figcaption class="visual-caption">${escapeHtml(roomData.name)}房间位置与收集包分支</figcaption>
        </figure>
        ${renderRoomBundleDetails(roomData)}
      `;
    }

    function renderMapBundle(roomData, bundleData, bundleIndex, mapLayout) {
      const checked = bundleData.items.filter((entry) => isChecked(entry.uid)).length;
      const complete = checked >= bundleData.required;
      const done = Math.min(checked, bundleData.required);
      const slot = getSlot(bundleIndex);
      const point = mapLayout.points[bundleData.id] || { x: 50, y: 50 };
      return `
        <div class="map-bundle-node ${complete ? "done" : ""} ${bundleIndex === 0 ? "active" : ""}" data-bundle-id="${bundleData.id}" data-item-count="${bundleData.items.length}" data-slot="${slot}" style="--x:${point.x}%;--y:${point.y}%" title="${escapeAttribute(bundleData.name)}">
          <div class="map-bundle-name">${escapeHtml(bundleData.name)}</div>
          ${renderMapBundleItems(bundleData)}
          <div class="map-bundle-meta">${escapeHtml(bundleData.rule)} · ${done}/${bundleData.required}</div>
        </div>
      `;
    }

    function renderRoomBundleDetails(roomData) {
      if (roomData.id === "vault") return renderVaultBundleDetail(roomData);

      return `
        <div class="room-detail-list" aria-label="${escapeAttribute(roomData.name)}收集包明细">
          ${roomData.bundles.map((bundleData, bundleIndex) => renderBundleDetail(roomData, bundleData, bundleIndex)).join("")}
        </div>
      `;
    }

    function renderVaultBundleDetail(roomData) {
      const entries = roomData.bundles.flatMap((bundleData) => bundleData.items);
      const checked = entries.filter((entry) => isChecked(entry.uid)).length;
      const total = entries.length;
      return `
        <div class="room-detail-list" aria-label="${escapeAttribute(roomData.name)}收集包明细">
          <section class="bundle-detail-card active" data-detail-bundle-id="vault-summary" data-slot="a">
            <header class="bundle-detail-head">
              <div>
                <h3 class="bundle-detail-title">金库收集包</h3>
                <p class="bundle-detail-sub">总计：42,500G</p>
              </div>
              <div class="bundle-detail-rule">${total}选${total} · ${checked}/${total}</div>
            </header>
            <div class="detail-items">
              ${entries.map((entry) => renderDetailItem(entry)).join("")}
            </div>
          </section>
        </div>
      `;
    }

    function renderBundleDetail(roomData, bundleData, bundleIndex) {
      const checked = bundleData.items.filter((entry) => isChecked(entry.uid)).length;
      const complete = checked >= bundleData.required;
      const done = Math.min(checked, bundleData.required);
      const slot = getSlot(bundleIndex);
      const rewardText = cleanRewardText(bundleData.reward);
      const reward = rewardText ? `<p class="bundle-detail-sub">奖励：${escapeHtml(rewardText)}</p>` : "";
      return `
        <section class="bundle-detail-card ${complete ? "done" : ""} ${bundleIndex === 0 ? "active" : ""}" data-detail-bundle-id="${bundleData.id}" data-slot="${slot}">
          <header class="bundle-detail-head">
            <div>
              <h3 class="bundle-detail-title">${escapeHtml(bundleData.name)}</h3>
              ${reward}
            </div>
            <div class="bundle-detail-rule">${escapeHtml(bundleData.rule)} · ${done}/${bundleData.required}</div>
          </header>
          <div class="detail-items">
            ${bundleData.items.map((entry) => renderDetailItem(entry)).join("")}
          </div>
        </section>
      `;
    }

    function renderDetailItem(entry) {
      const checked = isChecked(entry.uid);
      const title = describeItem(entry);
      return `
        <label class="detail-item ${checked ? "checked" : ""}" data-item-card="${entry.uid}" title="${escapeAttribute(title)}">
          <input type="checkbox" data-item-id="${entry.uid}" ${checked ? "checked" : ""} aria-label="${escapeAttribute(title)}" />
          ${renderIcon(entry)}
          <span class="detail-item-name">
            ${escapeHtml(entry.displayName || entry.name)}
            ${entry.count > 1 && !entry.displayName ? `<span class="detail-item-count">×${entry.count}</span>` : ""}
          </span>
        </label>
      `;
    }

    function activateBundleDetail(roomNode, bundleId) {
      if (!roomNode) return;
      const targetId = roomNode.dataset.roomId === "vault" ? "vault-summary" : bundleId;
      roomNode.querySelectorAll("[data-detail-bundle-id]").forEach((node) => {
        node.classList.toggle("active", node.dataset.detailBundleId === targetId);
      });
      roomNode.querySelectorAll(".map-bundle-node[data-bundle-id]").forEach((node) => {
        node.classList.toggle("active", node.dataset.bundleId === bundleId);
      });
    }

    function cleanRewardText(value) {
      return String(value || "")
        .replace(/奖\s*励[:：]\s*/g, "")
        .trim();
    }

    function renderExternalImage(className, fileName, alt) {
      return `<img class="${className}" src="${iconUrl(fileName)}" alt="${escapeAttribute(alt)}" loading="lazy" data-fallback="${escapeAttribute(alt)}" />`;
    }

    function getBundleMapLayout(roomData) {
      return bundleLayoutByRoom[roomData.id] || { core: { x: 50, y: 52 }, points: {} };
    }

    function renderMapLines(layout) {
      const origin = layout.linkFrom && layout.points[layout.linkFrom]
        ? layout.points[layout.linkFrom]
        : layout.core;
      const points = Object.entries(layout.points)
        .filter(([id]) => id !== layout.linkFrom)
        .map(([, point]) => point);
      return `
        <svg class="map-tree-lines" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
          ${points.map((point) => `<line x1="${origin.x}" y1="${origin.y}" x2="${point.x}" y2="${point.y}" />`).join("")}
        </svg>
      `;
    }

    function renderMapBundleItems(bundleData) {
      const columns = getMapItemColumns(bundleData);
      return `
        <div class="map-item-strip" style="--item-cols:${columns}">
          ${bundleData.items.map((entry) => renderMapItem(entry)).join("")}
        </div>
      `;
    }

    function renderMapItem(entry) {
      const checked = isChecked(entry.uid);
      const title = describeItem(entry);
      return `
        <label class="map-item ${checked ? "checked" : ""}" data-item-card="${entry.uid}" title="${escapeAttribute(title)}">
          <input type="checkbox" data-item-id="${entry.uid}" ${checked ? "checked" : ""} aria-label="${escapeAttribute(title)}" />
          ${renderIcon(entry)}
          <span class="map-item-name">${escapeHtml(entry.displayName || entry.name)}</span>
          ${entry.count > 1 && !entry.displayName ? `<span class="map-item-count">×${entry.count}</span>` : ""}
        </label>
      `;
    }

    function getMapItemColumns(bundleData) {
      const count = bundleData.items.length;
      if (bundleData.id === "summer-forage") return 3;
      if (bundleData.id === "missing-bundle") return 3;
      if (count <= 8) return 4;
      if (count === 9) return 3;
      if (count === 10) return 4;
      if (count === 12) return 4;
      return Math.min(6, Math.ceil(count / 2));
    }

    function renderImageFallback(label) {
      return `<span class="image-fallback">${escapeHtml(label)}</span>`;
    }

    function renderIcon(entry) {
      const fileName = iconFiles[entry.name] || iconFiles[entry.displayName] || "";
      const image = fileName
        ? `<img class="icon" src="${iconUrl(fileName)}" alt="" loading="lazy" onerror="this.replaceWith(fallbackIcon('${escapeAttribute(entry.name)}'))" />`
        : `<span class="fallback-icon">${escapeHtml((entry.name || "?").slice(0, 1))}</span>`;
      const quality = entry.quality && QUALITY_ICON[entry.quality]
        ? `<img class="quality" src="${iconUrl(QUALITY_ICON[entry.quality])}" alt="金星" loading="lazy" />`
        : "";
      return `<span class="icon-wrap">${image}${quality}</span>`;
    }

    function renderProgress() {
      const grid = document.getElementById("progressGrid");
      grid.innerHTML = categories.map(([key, label]) => {
        const entries = flatItems.filter((entry) => entry.category === key);
        const total = entries.length;
        const checked = entries.filter((entry) => isChecked(entry.uid)).length;
        const percent = total ? Math.round((checked / total) * 100) : 0;
        return `
          <div class="category">
            <div class="category-top">
              <span>${escapeHtml(label)}</span>
              <span class="category-count">${checked} / ${total}</span>
            </div>
            <div class="bar"><div class="fill" style="width:${percent}%"></div></div>
          </div>
        `;
      }).join("");
    }

    function renderCenterMap() {
      document.getElementById("centerMap").innerHTML = `
        <div class="center-map-stage center-map-stage-ref">
          ${renderExternalImage("center-map-image center-map-image-ref", CENTER_MAP_IMAGE, "社区中心整体地图")}
          ${centerRoomPins.map((pin) => `
            <a class="center-ref-title-dom" href="#room-${pin.id}" aria-label="跳转到${escapeHtml(pin.name)}" style="--box-x:${pin.boxX}%;--box-y:${pin.boxY}%;--box-w:${pin.boxW}%;--box-h:${pin.boxH}%">${escapeHtml(pin.name)}</a>
            <div class="center-ref-note-dom" style="--note-x:${pin.boxX + pin.boxW / 2}%;--note-y:${pin.noteY}%;--note-w:${pin.boxW}%">${escapeHtml(pin.note)}</div>
          `).join("")}
          <svg class="center-map-overlay-svg" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
            ${centerRoomPins.map((pin) => `
              <polyline class="center-route" points="${pin.path}" />
            `).join("")}
          </svg>
        </div>
      `;
    }

    function renderSearchResults() {
      const list = document.getElementById("resultList");
      if (!state.query) {
        list.innerHTML = "";
        return;
      }

      const query = normalize(state.query);
      const matches = flatItems.filter((entry) => {
        const haystack = [
          entry.name,
          entry.displayName,
          (entry.quality === "gold" ? `金星${entry.name}` : entry.quality === "silver" ? `银星${entry.name}` : ""),
          `${entry.name}×${entry.count}`,
          entry.roomName,
          entry.bundleName
        ].map(normalize).join(" ");
        return haystack.includes(query);
      });

      if (!matches.length) {
        list.innerHTML = `<p class="empty-state">这个物品不在当前献祭清单里，可以放心处理。</p>`;
        return;
      }

      list.innerHTML = matches.map((entry) => {
        const checked = isChecked(entry.uid);
        return `
          <article class="result-card ${checked ? "done" : ""}" data-jump-id="${entry.uid}">
            <div class="result-head">
              ${renderIcon(entry)}
              <div>
                <p class="result-title">${escapeHtml(describeItem(entry))}</p>
                <p class="result-path">${escapeHtml(entry.roomName)} → ${escapeHtml(entry.bundleName)}</p>
              </div>
              <span class="status ${checked ? "done" : "need"}">${checked ? "已献祭" : "要保留"}</span>
            </div>
          </article>
        `;
      }).join("");
    }

    function applyVisibility() {
      document.querySelectorAll("[data-bundle-id]").forEach((node) => {
        const hasMissing = Boolean(node.querySelector("[data-item-id]:not(:checked)"));
        node.hidden = state.showMissingOnly && !hasMissing;
      });

      document.querySelectorAll("[data-detail-bundle-id]").forEach((node) => {
        const hasMissing = Boolean(node.querySelector("[data-item-id]:not(:checked)"));
        node.hidden = state.showMissingOnly && !hasMissing;
      });

      document.querySelectorAll("[data-room-id]").forEach((node) => {
        const hasVisibleBundle = Boolean(node.querySelector("[data-bundle-id]:not([hidden]), [data-detail-bundle-id]:not([hidden])"));
        node.hidden = state.showMissingOnly && !hasVisibleBundle;
      });

      document.querySelectorAll(".map-tree-lines line").forEach((line) => {
        line.style.display = state.showMissingOnly ? "none" : "";
      });
    }

    function markHighlights() {
      document.querySelectorAll("[data-item-card]").forEach((node) => node.classList.remove("highlight"));
      if (!state.query) return;

      const query = normalize(state.query);
      flatItems.forEach((entry) => {
        const name = normalize(`${entry.name} ${entry.displayName} ${entry.quality === "gold" ? `金星${entry.name}` : entry.quality === "silver" ? `银星${entry.name}` : ""}`);
        if (!name.includes(query)) return;
        document.querySelectorAll(`[data-item-card="${entry.uid}"]`).forEach((node) => node.classList.add("highlight"));
      });
    }

    function focusItem(uid) {
      const [roomId, bundleId] = uid.split(":");
      activateBundleDetail(document.querySelector(`.room[data-room-id="${roomId}"]`), bundleId);
      const node = document.querySelector(`.detail-item[data-item-card="${uid}"]`) || document.querySelector(`[data-item-card="${uid}"]`);
      if (!node) return;
      node.scrollIntoView({ behavior: "smooth", block: "center" });
      document.querySelectorAll(`[data-item-card="${uid}"]`).forEach((entryNode) => entryNode.classList.add("highlight"));
    }

    function jumpToFirstSearchResult() {
      if (!state.query) return;
      const query = normalize(state.query);
      const match = flatItems.find((entry) => {
        const haystack = [
          entry.name,
          entry.displayName,
          (entry.quality === "gold" ? `金星${entry.name}` : entry.quality === "silver" ? `银星${entry.name}` : ""),
          `${entry.name}×${entry.count}`,
          entry.roomName,
          entry.bundleName
        ].map(normalize).join(" ");
        return haystack.includes(query);
      });
      if (match) focusItem(match.uid);
    }

    function setChecked(uid, checked) {
      if (checked) state.checked.add(uid);
      else state.checked.delete(uid);
      saveCheckedItems();

      syncCheckedItem(uid, checked);
      updateRoomStats();
      renderProgress();
      renderSearchResults();
      markHighlights();
      scheduleLayout();
    }

    function syncCheckedItem(uid, checked) {
      document.querySelectorAll("[data-item-id]").forEach((input) => {
        if (input.dataset.itemId !== uid) return;
        input.checked = checked;
      });

      document.querySelectorAll("[data-item-card]").forEach((card) => {
        if (card.dataset.itemCard !== uid) return;
        card.classList.toggle("checked", checked);
      });
    }

    function updateRoomStats() {
      rooms.forEach((roomData) => {
        const roomNode = document.querySelector(`.room[data-room-id="${roomData.id}"]`);
        if (!roomNode) return;

        const checked = countCheckedInRoom(roomData);
        const total = roomData.bundles.reduce((sum, bundleData) => sum + bundleData.required, 0);
        const badge = roomNode.querySelector(".room-badge");
        if (badge) badge.textContent = `${checked} / ${total}`;

        roomData.bundles.forEach((bundleData) => {
          const bundleChecked = bundleData.items.filter((entry) => isChecked(entry.uid)).length;
          const complete = bundleChecked >= bundleData.required;
          const done = Math.min(bundleChecked, bundleData.required);

          roomNode.querySelectorAll(`[data-bundle-id="${bundleData.id}"], [data-detail-bundle-id="${bundleData.id}"]`).forEach((bundleNode) => {
            bundleNode.classList.toggle("done", complete);

            const mapMeta = bundleNode.querySelector(".map-bundle-meta");
            if (mapMeta) mapMeta.textContent = `${bundleData.rule} · ${done}/${bundleData.required}`;

            const detailRule = bundleNode.querySelector(".bundle-detail-rule");
            if (detailRule) detailRule.textContent = `${bundleData.rule} · ${done}/${bundleData.required}`;
          });
        });

        if (roomData.id === "vault") {
          const entries = roomData.bundles.flatMap((bundleData) => bundleData.items);
          const checkedEntries = entries.filter((entry) => isChecked(entry.uid)).length;
          const summary = roomNode.querySelector('[data-detail-bundle-id="vault-summary"]');
          if (summary) {
            summary.classList.toggle("done", checkedEntries >= entries.length);
            const detailRule = summary.querySelector(".bundle-detail-rule");
            if (detailRule) detailRule.textContent = `${entries.length}选${entries.length} · ${checkedEntries}/${entries.length}`;
          }
        }
      });
    }

    function flattenItems() {
      const entries = [];
      rooms.forEach((roomData) => {
        roomData.bundles.forEach((bundleData) => {
          bundleData.items.forEach((entry, index) => {
            entry.uid = `${roomData.id}:${bundleData.id}:${index}`;
            entry.roomName = roomData.name;
            entry.bundleName = bundleData.name;
            entries.push(entry);
          });
        });
      });
      return entries;
    }

    function countCheckedInRoom(roomData) {
      return roomData.bundles.reduce((sum, bundleData) => {
        const checked = bundleData.items.filter((entry) => isChecked(entry.uid)).length;
        return sum + Math.min(checked, bundleData.required);
      }, 0);
    }

    function describeItem(entry) {
      const quality = entry.quality === "gold" ? "金星" : entry.quality === "silver" ? "银星" : "";
      if (entry.displayName) return entry.displayName;
      return `${quality}${entry.name}${entry.count > 1 ? ` ×${entry.count}` : ""}`;
    }

    function isChecked(uid) {
      return state.checked.has(uid);
    }

    function bindLayoutImages(root = document) {
      root.querySelectorAll("img").forEach((image) => {
        if (image.dataset.layoutBound) return;
        image.dataset.layoutBound = "true";
        image.addEventListener("load", scheduleLayout, { once: true });
        image.addEventListener("error", scheduleLayout, { once: true });
      });
    }

    function scheduleLayout() {
      requestAnimationFrame(() => requestAnimationFrame(layoutMobileRoomVisuals));
      layoutTimerIds.forEach((timerId) => clearTimeout(timerId));
      layoutTimerIds = [80, 240, 700, 1600].map((delay) => setTimeout(layoutMobileRoomVisuals, delay));
    }

    function layoutMobileRoomVisuals() {
      const isMobile = window.matchMedia("(max-width: 520px)").matches;
      Object.keys(mobileRowsByRoom).forEach((roomId) => layoutRoomRows(roomId, isMobile));
    }

    function layoutRoomRows(roomId, isMobile) {
      const scene = document.querySelector(`.room[data-room-id="${roomId}"] .room-scene`);
      if (!scene) return;

      const grid = scene.querySelector(".map-bundle-grid");
      const lines = scene.querySelector(".map-tree-lines");
      const rows = mobileRowsByRoom[roomId];
      const config = mobileLayoutConfig[roomId] || {};
      const flatIds = rows.flat();
      const cards = Object.fromEntries(flatIds.map((id) => [id, scene.querySelector(`[data-bundle-id="${id}"]`)]));

      if (!grid || !lines || Object.values(cards).some((card) => !card)) return;

      if (!isMobile) {
        scene.style.removeProperty("height");
        scene.style.removeProperty("min-height");
        scene.style.removeProperty("aspect-ratio");

        [grid, lines].forEach((layer) => {
          layer.style.removeProperty("display");
          layer.style.removeProperty("inset");
          layer.style.removeProperty("left");
          layer.style.removeProperty("top");
          layer.style.removeProperty("width");
          layer.style.removeProperty("height");
        });

        Object.values(cards).forEach((card) => {
          card.style.removeProperty("left");
          card.style.removeProperty("top");
          card.style.removeProperty("transform");
          card.style.removeProperty("transform-origin");
        });
        return;
      }

      const sceneWidth = scene.clientWidth;
      if (!sceneWidth) return;

      const visibleRows = rows
        .map((row) => row.filter((id) => cards[id] && !cards[id].hidden))
        .filter((row) => row.length);

      if (!visibleRows.length) {
        lines.querySelectorAll("line").forEach((line) => { line.style.display = "none"; });
        return;
      }

      grid.style.setProperty("inset", "0", "important");
      grid.style.setProperty("left", "0", "important");
      grid.style.setProperty("top", "0", "important");
      grid.style.setProperty("width", "100%", "important");

      const shouldHideLines = roomId === "vault" || roomId === "missing";
      lines.style.setProperty("display", shouldHideLines ? "none" : "block", "important");
      lines.style.setProperty("inset", "0", "important");
      lines.style.setProperty("left", "0", "important");
      lines.style.setProperty("top", "0", "important");
      lines.style.setProperty("width", "100%", "important");

      Object.values(cards).forEach((card) => {
        card.style.setProperty("left", "0px", "important");
        card.style.setProperty("top", "0px", "important");
        card.style.setProperty("transform", "none", "important");
        card.style.setProperty("transform-origin", "top left", "important");
      });

      const minGap = config.minGap ?? 6;
      const wantedScale = config.wantedScale ?? 1;
      const minScale = config.minScale ?? 0.82;
      const vGapBase = config.vGap ?? minGap;

      const rowBaseWidths = visibleRows.map((row) => row.reduce((sum, id) => sum + cards[id].offsetWidth, 0));
      const scaleCandidates = visibleRows.map((row, index) => {
        const available = sceneWidth - minGap * (row.length + 1);
        return available / Math.max(1, rowBaseWidths[index]);
      });

      let scale = Math.min(wantedScale, ...scaleCandidates);
      scale = Math.max(minScale, scale);

      const vGap = Math.max(vGapBase, minGap * scale);
      const rowHeights = visibleRows.map((row) => Math.max(...row.map((id) => cards[id].offsetHeight * scale)));
      const contentHeight = rowHeights.reduce((sum, height) => sum + height, 0) + vGap * Math.max(0, rowHeights.length - 1);
      let sceneHeight = Math.ceil(Math.max(
        contentHeight + minGap * 2,
        config.sceneHeight ?? sceneWidth * (config.heightRatio ?? 0.68)
      ));
      const topBase = config.topOffset ?? Math.max(minGap, (sceneHeight - contentHeight) / 2);
      sceneHeight = Math.ceil(Math.max(sceneHeight, topBase + contentHeight + minGap));
      let top = topBase;
      const positioned = {};

      visibleRows.forEach((row, rowIndex) => {
        const scaledWidth = row.reduce((sum, id) => sum + cards[id].offsetWidth * scale, 0);
        const gap = Math.max(minGap, (sceneWidth - scaledWidth) / (row.length + 1));
        const rowHeight = rowHeights[rowIndex];
        const xOverrides = config.xByRow?.[rowIndex] || {};
        let left = gap;

        row.forEach((id) => {
          const card = cards[id];
          const cardWidth = card.offsetWidth * scale;
          const customX = xOverrides[id];
          const currentLeft = typeof customX === "number"
            ? clamp(sceneWidth * customX - cardWidth / 2, minGap, sceneWidth - cardWidth - minGap)
            : left;

          placeMapCard(card, currentLeft, top, scale);
          positioned[id] = {
            x: currentLeft + cardWidth / 2,
            y: top + card.offsetHeight * scale / 2
          };
          left += cardWidth + gap;
        });

        top += rowHeight + vGap;
      });

      scene.style.setProperty("height", `${sceneHeight}px`, "important");
      scene.style.setProperty("min-height", "0", "important");
      scene.style.setProperty("aspect-ratio", "auto", "important");
      grid.style.setProperty("height", `${sceneHeight}px`, "important");
      lines.style.setProperty("height", `${sceneHeight}px`, "important");

      if (shouldHideLines) {
        lines.querySelectorAll("line").forEach((line) => { line.style.display = "none"; });
      } else {
        updateRoomLines(roomId, lines, positioned, sceneWidth, sceneHeight);
      }
    }

    function placeMapCard(card, left, top, scale) {
      card.style.setProperty("left", `${Math.round(left)}px`, "important");
      card.style.setProperty("top", `${Math.round(top)}px`, "important");
      card.style.setProperty("transform", `scale(${scale})`, "important");
      card.style.setProperty("transform-origin", "top left", "important");
    }

    function updateRoomLines(roomId, lines, positioned, width, height) {
      const layout = bundleLayoutByRoom[roomId];
      if (!layout) return;

      const allLines = Array.from(lines.querySelectorAll("line"));
      allLines.forEach((line) => { line.style.display = "none"; });

      // 只看未完成时，已完成的卡片会隐藏。此时保留树线会指向空位置，干脆隐藏线条，避免画面乱飞。
      if (state.showMissingOnly) return;

      const visibleIds = Object.keys(positioned);
      const originId = positioned[layout.linkFrom] ? layout.linkFrom : visibleIds[0];
      const origin = positioned[originId];
      if (!origin) return;

      const targetIds = Object.keys(layout.points).filter((id) => id !== originId && positioned[id]);
      targetIds.forEach((id, index) => {
        const line = allLines[index];
        const target = positioned[id];
        if (!line || !target) return;

        line.style.display = "";
        line.setAttribute("x1", (origin.x / width) * 100);
        line.setAttribute("y1", (origin.y / height) * 100);
        line.setAttribute("x2", (target.x / width) * 100);
        line.setAttribute("y2", (target.y / height) * 100);
      });
    }

    function md5(input) {
      function add32(a, b) { return (a + b) & 0xffffffff; }
      function cmn(q, a, b, x, s, t) {
        a = add32(add32(a, q), add32(x, t));
        return add32((a << s) | (a >>> (32 - s)), b);
      }
      function ff(a, b, c, d, x, s, t) { return cmn((b & c) | ((~b) & d), a, b, x, s, t); }
      function gg(a, b, c, d, x, s, t) { return cmn((b & d) | (c & (~d)), a, b, x, s, t); }
      function hh(a, b, c, d, x, s, t) { return cmn(b ^ c ^ d, a, b, x, s, t); }
      function ii(a, b, c, d, x, s, t) { return cmn(c ^ (b | (~d)), a, b, x, s, t); }

      function md5cycle(state, block) {

    /* ── localStorage ── */
    const APP_KEY = "stardew.app.v1";
    function loadApp() {
      try { return JSON.parse(localStorage.getItem(APP_KEY)) || {}; } catch { return {}; }
    }
    function saveApp() {
      localStorage.setItem(APP_KEY, JSON.stringify(appState));
    }

    const _appLoaded = loadApp();
    const appState = {
      season: _appLoaded.season || "spring",
      day: _appLoaded.day || 1,
      weather: _appLoaded.weather || "sunny",
      goals: _appLoaded.goals || [],
      inventory: _appLoaded.inventory || {},   // { 玉米: 8, 铜矿石: 25, ... }
      tools: _appLoaded.tools || {},           // { pickaxe: "铜", ... }
      equipment: _appLoaded.equipment || {},   // { preserves_jar: 3, ... }
      buildings: _appLoaded.buildings || {},   // { silo: true, ... }
    };

    /* ── 渲染主入口 ── */
    function renderApp() {
      renderSeasonBar();
      renderQuests();
      renderGoals();
      renderInventorySummary();
      renderSuggestions();
      saveApp();
    }

    /* ── 季节天气栏 ── */
    function renderSeasonBar() {
      document.querySelectorAll("[data-season]").forEach(b => {
        b.classList.toggle("active", b.dataset.season === appState.season);
      });
      document.getElementById("dayInput").value = appState.day;
      const seasonLabel = { spring: "春", summer: "夏", fall: "秋", winter: "冬" }[appState.season];
      document.getElementById("seasonLabel").textContent = `${seasonLabel}季`;
      const wt = document.getElementById("weatherToggle");
      wt.textContent = appState.weather === "rainy" ? "🌧️ 雨" : "☀️ 晴";
      wt.classList.toggle("rainy", appState.weather === "rainy");
    }

    function setSeason(s) { appState.season = s; renderApp(); }
    function setDay(d) {
      d = Math.max(1, Math.min(28, parseInt(d) || 1));
      appState.day = d;
      renderApp();
    }
    function stepDay(delta) {
      let d = appState.day + delta;
      if (d > 28) {
        const order = ["spring", "summer", "fall", "winter"];
        const i = order.indexOf(appState.season);
        appState.season = order[(i + 1) % 4];
        d = 1;
      } else if (d < 1) {
        const order = ["spring", "summer", "fall", "winter"];
        const i = order.indexOf(appState.season);
        appState.season = order[(i + 3) % 4];
        d = 28;
      }
      appState.day = d;
      renderApp();
    }
    function toggleWeather() {
      appState.weather = appState.weather === "rainy" ? "sunny" : "rainy";
      renderApp();
    }
