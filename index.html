<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>星露谷 · 杨桃收益表 Demo</title>
<style>
:root{
  --bg:#f7efd9;
  --paper:#fffaf0;
  --ink:#30271d;
  --muted:#746858;
  --line:#d7bd86;
  --wood:#6f4728;
  --gold:#c8952d;
  --blue:#426f93;
  --red:#bd4b39;
  --shadow:0 10px 28px rgba(81,55,27,.12);
  --radius:18px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  min-height:100vh;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;
  color:var(--ink);
  background:
    radial-gradient(circle at 15% 20%,rgba(214,170,82,.18) 0 2px,transparent 2px 44px),
    linear-gradient(180deg,#fbf4e2 0%,var(--bg) 100%);
  padding:14px;
}
.header{
  max-width:760px;
  margin:0 auto 12px;
  background:linear-gradient(135deg,#3a2719,#704725 64%,#8b5d34);
  color:#fff4d6;
  border:1px solid rgba(255,244,214,.2);
  border-bottom:4px solid var(--gold);
  border-radius:22px;
  box-shadow:var(--shadow);
  padding:18px 16px;
}
.header small{color:#e7bd68;letter-spacing:.12em;text-transform:uppercase}
.header h1{font-size:26px;margin-top:7px}
.header p{color:rgba(255,244,214,.78);font-size:14px;margin-top:6px}
.app{max-width:760px;margin:0 auto}
.search-card{
  background:rgba(255,250,240,.95);
  border:1px solid var(--line);
  border-radius:22px;
  box-shadow:var(--shadow);
  padding:12px;
  position:sticky;
  top:8px;
  z-index:5;
}
.search{position:relative}
.search span{position:absolute;left:14px;top:50%;transform:translateY(-50%)}
.search input{
  width:100%;
  border:2px solid var(--line);
  border-radius:999px;
  padding:12px 14px 12px 42px;
  background:white;
  color:var(--ink);
  outline:none;
  font:inherit;
}
.chips{display:flex;gap:8px;overflow:auto;padding-top:10px}
.chip{
  border:1px solid var(--line);
  background:#fff8e7;
  color:var(--wood);
  border-radius:999px;
  padding:7px 12px;
  font-size:13px;
  white-space:nowrap;
  cursor:pointer;
}
.chip.hot{background:#fff0e8;border-color:#e3a18f;color:var(--red)}
.section-title{margin:20px 2px 10px}
.section-title h2{font-size:22px}
.section-title p{font-size:13px;color:var(--muted);margin-top:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.card{
  background:rgba(255,250,240,.96);
  border:1px solid rgba(215,189,134,.92);
  border-radius:var(--radius);
  box-shadow:0 4px 14px rgba(81,55,27,.08);
  padding:14px;
}
.item{cursor:pointer;background:white}
.item:hover{border-color:#c39148;box-shadow:0 8px 18px rgba(81,55,27,.1)}
.item h3{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:18px}
.meta{color:var(--muted);font-size:14px;line-height:1.55;margin-top:6px}
.badge{
  display:inline-flex;
  border-radius:999px;
  padding:3px 8px;
  background:#eee1c4;
  color:var(--wood);
  font-size:11px;
  font-weight:800;
}
.badge.red{background:rgba(189,75,57,.14);color:var(--red)}
.badge.green{background:rgba(78,132,90,.14);color:#4e845a}
.line{height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent);margin:10px 0}
.profit-table-wrap{overflow-x:auto;margin-top:10px}
.profit-table{
  width:100%;
  min-width:420px;
  border-collapse:separate;
  border-spacing:0;
  overflow:hidden;
  border:1px solid var(--line);
  border-radius:14px;
  background:white;
}
.profit-table th,.profit-table td{
  padding:10px 9px;
  border-bottom:1px solid rgba(215,189,134,.72);
  font-size:13px;
  text-align:left;
  vertical-align:middle;
}
.profit-table tr:last-child td{border-bottom:0}
.profit-table th{background:#f4e6c7;color:var(--wood);font-weight:900}
.profit-table td:nth-child(3),.profit-table td:nth-child(4){text-align:right;white-space:nowrap}
.inline-link{
  border:1px solid var(--line);
  background:#fff8e7;
  color:var(--blue);
  border-radius:999px;
  padding:2px 7px;
  font-size:12px;
  font-weight:800;
}
dialog{
  width:min(680px,calc(100% - 24px));
  border:0;
  border-radius:22px;
  box-shadow:0 28px 80px rgba(0,0,0,.34);
  padding:0;
  background:var(--paper);
  color:var(--ink);
}
dialog::backdrop{background:rgba(30,20,12,.42)}
.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 16px;
  background:linear-gradient(135deg,#fff8e7,#f1dfb7);
  border-bottom:1px solid var(--line);
}
.modal-body{padding:16px;max-height:76vh;overflow:auto}
.close-btn{border:0;background:rgba(111,71,40,.12);color:var(--wood);border-radius:12px;width:34px;height:34px;font-size:20px}
@media(max-width:520px){body{padding:10px}.header{border-radius:20px}.profit-table th,.profit-table td{font-size:12px;padding:9px 7px}}
</style>
</head>
<body>
<header class="header">
  <small>Stardew Valley · Profit Table Demo</small>
  <h1>⭐ 杨桃收益对比</h1>
  <p>先只改杨桃：不写建议，不替玩家决定，只展示处理方式、产物、价格、收益率。</p>
</header>

<main class="app">
  <section class="search-card">
    <div class="search">
      <span>🔍</span>
      <input id="search" value="杨桃" placeholder="搜：杨桃、小桶、陈酿桶">
    </div>
    <div class="chips">
      <button class="chip hot" data-search="杨桃">杨桃</button>
      <button class="chip" data-search="小桶">小桶</button>
      <button class="chip" data-search="陈酿桶">陈酿桶</button>
    </div>
  </section>

  <section>
    <div class="section-title">
      <h2>搜索结果</h2>
      <p id="count">0 个结果</p>
    </div>
    <div class="grid" id="results"></div>
  </section>

  <section id="equipment">
    <div class="section-title">
      <h2>设备</h2>
      <p>收益表里的设备名可以跳到这里。</p>
    </div>
    <div class="grid" id="equipments"></div>
  </section>
</main>

<dialog id="modal">
  <div class="modal-head">
    <strong id="modalTitle">详情</strong>
    <button class="close-btn" id="modalClose">×</button>
  </div>
  <div class="modal-body" id="modalBody"></div>
</dialog>

<script>
const DATA = [
  {
    id:"starfruit",
    name:"杨桃",
    emoji:"⭐",
    type:"作物",
    season:"夏",
    price:750,
    hot:true,
    profit:[
      {method:"直接卖掉", output:"杨桃", price:750},
      {method:"杨桃 + <button class='inline-link' data-jump='keg'>小桶</button>", output:"杨桃酒", price:2250},
      {method:"杨桃酒 + <button class='inline-link' data-jump='cask'>陈酿桶</button>", output:"铱星杨桃酒", price:4500}
    ]
  },
  {
    id:"keg",
    name:"小桶",
    emoji:"🍷",
    type:"工匠设备",
    source:"耕种8级解锁",
    recipe:"木材×30 + 铜锭×1 + 铁锭×1 + 橡树树脂×1",
    desc:"水果→酒，蔬菜→汁。"
  },
  {
    id:"cask",
    name:"陈酿桶",
    emoji:"🍾",
    type:"工匠设备",
    source:"房屋升级到地窖后可用",
    recipe:"木材×20 + 硬木×1",
    desc:"酒和奶酪可以陈酿提升品质。"
  }
];

function $(id){return document.getElementById(id)}

function rate(price, base){
  const n = Math.round((price / base - 1) * 100);
  return `${n > 0 ? "+" : ""}${n}%`;
}

function profitTable(item){
  const base = item.price || item.profit[0].price;
  return `
    <div class="profit-table-wrap">
      <table class="profit-table">
        <thead>
          <tr>
            <th>处理方式</th>
            <th>产物</th>
            <th>价格</th>
            <th>收益率</th>
          </tr>
        </thead>
        <tbody>
          ${item.profit.map(row => `
            <tr>
              <td>${row.method}</td>
              <td>${row.output}</td>
              <td>${row.price}G</td>
              <td>${rate(row.price, base)}</td>
            </tr>
          `).join("")}
        </tbody>
      </table>
    </div>
  `;
}

function card(item){
  return `
    <article class="card item" data-id="${item.id}">
      <h3>${item.emoji} ${item.name}
        <span class="badge">${item.type}</span>
        ${item.hot ? `<span class="badge red">HOT</span>` : ""}
        ${item.season ? `<span class="badge green">${item.season}</span>` : ""}
      </h3>
      <p class="meta">${item.profit ? "点开查看收益对比。" : item.desc || "点开查看详情。"}</p>
    </article>
  `;
}

function detail(item){
  if(item.profit){
    return `
      <h3>${item.emoji} ${item.name}</h3>
      <div class="line"></div>
      <p class="meta">基础价：${item.price}G</p>
      ${profitTable(item)}
    `;
  }
  return `
    <h3>${item.emoji} ${item.name}</h3>
    <div class="line"></div>
    <p class="meta">来源：${item.source}</p>
    <p class="meta">配方：${item.recipe}</p>
    <p class="meta">${item.desc}</p>
  `;
}

function render(){
  const q = $("search").value.trim();
  const items = DATA.filter(item => [item.name,item.type,item.source,item.desc,JSON.stringify(item.profit || [])].join(" ").includes(q));
  $("count").textContent = `${items.length} 个结果`;
  $("results").innerHTML = items.map(card).join("");
  $("equipments").innerHTML = DATA.filter(i => i.type === "工匠设备").map(card).join("");
}

function openDetail(id){
  const item = DATA.find(i => i.id === id);
  if(!item) return;
  $("modalTitle").textContent = item.name;
  $("modalBody").innerHTML = detail(item);
  $("modal").showModal();
}

$("search").addEventListener("input", render);
$("modalClose").addEventListener("click", () => $("modal").close());

 document.body.addEventListener("click", e => {
  const searchBtn = e.target.closest("[data-search]");
  if(searchBtn){
    $("search").value = searchBtn.dataset.search;
    render();
    return;
  }

  const jump = e.target.closest("[data-jump]");
  if(jump){
    e.stopPropagation();
    $("modal").close();
    const el = document.querySelector(`[data-id="${jump.dataset.jump}"]`);
    if(el){
      el.scrollIntoView({behavior:"smooth", block:"center"});
      el.style.outline = "3px solid rgba(66,111,147,.35)";
      setTimeout(() => el.style.outline = "", 900);
    }
    return;
  }

  const item = e.target.closest(".item");
  if(item) openDetail(item.dataset.id);
});

render();
</script>
</body>
</html>
