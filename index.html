        header p { font-size: 0.9rem; opacity: 0.9; margin-top: 0.2rem; }

            display: flex; align-items: center; gap: 0.8rem; margin-bottom: 1rem;
            padding: 0.5rem 0; flex-wrap: wrap;
        }

            background: var(--accent); color: white; border: none; padding: 0.4rem 1rem;
            border-radius: 20px; cursor: pointer; font-weight: 600; font-size: 0.9rem;
            font-family: var(--font); display: flex; align-items: center; gap: 4px;

        .back-btn:hover { background: #5e3e1c; transform: translateY(-1px); }
        .current-path { font-size: 0.9rem; color: #6b5e4f; font-weight: 500; }

        .search-wrapper { position: relative; max-width: 680px; margin: 0 auto 1.2rem auto; z-index: 10; }

            width: 100%; padding: 0.9rem 1.5rem; font-size: 1.1rem; border: 3px solid var(--border);
            border-radius: 50px; background: white; box-shadow: var(--shadow); outline: none;
            font-family: var(--font);

        .search-wrapper input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(122,92,58,0.2); }
        .search-icon { position: absolute; right: 20px; top: 50%; transform: translateY(-50%); font-size: 1.3rem; color: var(--accent); }

            background: white; border: 2px solid var(--border); padding: 0.5rem 1.1rem;
            border-radius: 40px; font-weight: 600; cursor: pointer; font-size: 0.85rem;
            transition: all 0.2s; color: var(--accent); box-shadow: 0 2px 6px rgba(0,0,0,0.04);
            font-family: var(--font); display: flex; align-items: center; gap: 4px;
        }
        .category-btn:hover, .category-btn.active {
            background: var(--accent); color: white; border-color: var(--accent); transform: translateY(-2px);
        }
        .content-area {
            background: var(--card); border-radius: var(--radius); padding: 1rem 1rem;
            box-shadow: var(--shadow); min-height: 400px; border: 1px solid #e8d8be;
        }
        .season-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 1rem; }
        .season-block { background: #fff; border-radius: 12px; padding: 1rem; border: 1px solid #e0cfad; }

            background: #f5ede0; padding: 0.2rem 0.7rem; border-radius: 12px; cursor: pointer;
            font-size: 0.9rem; font-weight: 500; transition: 0.1s; border: 1px solid transparent;

        .hot-tag { font-size: 0.65rem; background: #e0553d; color: white; padding: 0 4px; border-radius: 6px; margin-left: 2px; }
        .search-result-item {
            background: white; border-radius: 14px; padding: 1.2rem; margin-bottom: 1.5rem;
            box-shadow: 0 4px 16px rgba(0,0,0,0.05); border-left: 5px solid var(--gold);

            background: #fdf9f2; border-radius: 12px; padding: 0.9rem 1.1rem;

        }

        .flow-step:last-child { margin-bottom: 0; }
        .flow-title { font-weight: 700; font-size: 0.95rem; margin-bottom: 0.3rem; }
        .flow-branch { margin-left: 0.6rem; border-left: 2px dashed #d0b894; padding-left: 0.9rem; }
        .flow-line { padding: 0.2rem 0; font-size: 0.9rem; display: flex; align-items: baseline; gap: 0.3rem; flex-wrap: wrap; }
        .flow-line .arrow { color: #b08968; }
        .price-note { font-size: 0.75rem; color: #6b5e4f; }
        .quality-tag { font-size: 0.75rem; padding: 0.1rem 0.4rem; border-radius: 6px; background: #e5d5bb; margin-left: 0.1rem; }

        .info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 0.8rem; margin-top: 0.8rem; }
        .info-card { background: #faf6ee; border-radius: 10px; padding: 0.7rem 0.8rem; border: 1px solid #e0cfad; }
        .info-card h4 { margin-bottom: 0.3rem; color: var(--accent); font-size: 0.9rem; }
        footer { text-align: center; padding: 1.2rem; color: #7b6e5a; font-size: 0.8rem; margin-top: 1.5rem; }

                { id:"sturgeon", name:"鲟鱼", type:"fish", seasons:["夏","冬"], basePrice:200, location:"深山湖泊·6AM-7PM",
                  processing:[{method:"鱼塘→鱼子酱", product:"鱼子酱", price:500, days:4, priority:1}],
                  sacrifices:[{room:"鱼缸", bundle:"湖鱼收集包", need:1}] },
                { id:"sunfish", name:"太阳鱼", type:"fish", seasons:["春","夏"], basePrice:30, location:"河流·晴天·6AM-7PM",
                  processing:[{method:"生鱼片", product:"生鱼片", price:75, days:0, priority:1, note:"售价<75G适用"}],
                  sacrifices:[{room:"鱼缸", bundle:"河鱼收集包", need:1}] },
                { id:"lava_eel", name:"岩浆鳗鱼", type:"fish", seasons:["全季"], basePrice:700, location:"矿井100层",
                  processing:[{method:"熏鱼机", product:"熏岩浆鳗鱼", price:1400, days:0.04, priority:1}], sacrifices:[] },
                { id:"carp", name:"鲤鱼", type:"fish", seasons:["全季"], basePrice:30, location:"深山湖泊·全天",
                  processing:[{method:"生鱼片", product:"生鱼片", price:75, days:0, priority:1}],
                  sacrifices:[{room:"鱼缸", bundle:"湖鱼收集包", need:1}] },

                // ===== 觅食 (照攻略逻辑) =====
                { id:"common_mushroom", name:"普通蘑菇", type:"foraging", seasons:["春","秋"], basePrice:40,
                  processing:[{method:"烘干机", product:"干蘑菇", price:80, days:0.04, priority:1, note:"1.6版本"}], sacrifices:[] },
                { id:"salmonberry", name:"美洲大树莓", type:"foraging", seasons:["春季15-18"], basePrice:5,
                  processing:[{method:"罐头瓶", product:"树莓果酱", price:60, days:3, priority:1}], sacrifices:[] },
                { id:"blackberry", name:"黑莓", type:"foraging", seasons:["秋季8-11"], basePrice:20,
                  processing:[{method:"罐头瓶", product:"黑莓果酱", price:90, days:3, priority:1}], sacrifices:[] },
                { id:"cave_carrot", name:"山洞萝卜", type:"foraging", seasons:["矿井"], basePrice:25,
                  processing:[{method:"烹饪", product:"生存汉堡/红火汤", price:0, days:0, priority:1, note:"下矿料理"}], sacrifices:[] },

                // ===== 蜂蜜逻辑 (照攻略逻辑) =====
                { id:"fairy_rose_honey", name:"仙女玫瑰蜂蜜", type:"artisan_good", basePrice:680,
                  processing:[], sacrifices:[], decision:"直接卖，绝对不要酿酒。" },
                { id:"wild_honey", name:"野生蜂蜜", type:"artisan_good", basePrice:100,
                  processing:[{method:"小桶", product:"蜂蜜酒", price:200, days:0.42, priority:1}], sacrifices:[] },

                // ===== 矿场逻辑 (照矿场攻略.md) =====
                { id:"cheese", name:"奶酪", type:"food", basePrice:230,
                  processing:[], sacrifices:[], decision:"下矿回血性价比之王。" },
                { id:"spicy_eel", name:"香辣鳗鱼", type:"food", basePrice:175,
                  processing:[], sacrifices:[], decision:"+1运气+1速度，冲层必备。" },
                { id:"coffee", name:"咖啡", type:"food", basePrice:150,
                  processing:[], sacrifices:[], decision:"加速可与食物叠加，三倍浓缩咖啡更佳。" },
                { id:"bomb", name:"炸弹", type:"tool", basePrice:50,
                  processing:[], sacrifices:[], decision:"冲层核心工具，清理密集石头堆。" },
                { id:"staircase", name:"楼梯", type:"tool", basePrice:0,
                  processing:[], sacrifices:[], decision:"怪物层直接放楼梯跳过。" },
            ];

            const npcs = [
                { id:"maru", name:"玛鲁", birthday:"夏季10日", address:"山路24号（罗宾木匠铺）", schedule:"周二/周四在诊所。",
                  loves:["电池组","花椰菜","钻石","金锭","铱锭","草莓"], likes:["铜锭","铁锭","石英"], dislikes:["蜂蜜","枫糖浆"] },
                { id:"abigail", name:"阿比盖尔", birthday:"秋季13日", address:"皮埃尔杂货店二楼", schedule:"白天在杂货店或图书馆。",
                  loves:["紫水晶","南瓜","巧克力蛋糕"], likes:["石英"], dislikes:[] },
                { id:"harvey", name:"哈维", birthday:"冬季14日", address:"哈维诊所", schedule:"周二/周四在诊所，周六去博物馆。",
                  loves:["咖啡","腌菜","松露油","果酒"], likes:["普通蘑菇","鸭蛋","羊奶"], dislikes:["奶酪"] },
            ];

            const categoryMap = {
                crops: ['crop','flower'], animal: ['animal_product'], fish: ['fish'],
                mining: ['mineral','tool','food'], artisan: ['artisan','artisan_good'],
                foraging: ['foraging'],
            };

            const contentArea = document.getElementById('contentArea');
            const searchInput = document.getElementById('searchInput');
            const categoryBtns = document.querySelectorAll('.category-btn');
            const backBtn = document.getElementById('backBtn');
            const currentPath = document.getElementById('currentPath');
            let currentCat = 'all', searchQuery = '';
            let historyStack = [];

            function updatePath(text) { currentPath.textContent = text; }

            function pushState(cat, query) {
                historyStack.push({ cat: currentCat, query: searchQuery });
                currentCat = cat;
                searchQuery = query;
            }

            function goBack() {
                if (historyStack.length === 0) {
                    currentCat = 'all'; searchQuery = ''; searchInput.value = '';
                    updatePath('主页'); renderCurrent(); return;
                }
                const prev = historyStack.pop();
                currentCat = prev.cat; searchQuery = prev.query;
                searchInput.value = searchQuery;
                updatePath(searchQuery ? `搜索: ${searchQuery}` : currentCat==='all'?'主页':currentCat);
                renderCurrent();
            }
            backBtn.addEventListener('click', goBack);

            function renderTopics() {
                const ts = [
                    { n:"作物种植", i:"🌽", c:"crops" }, { n:"畜牧产品", i:"🐄", c:"animal" },
                    { n:"钓鱼蟹笼", i:"🎣", c:"fish" }, { n:"矿场战斗", i:"⛏", c:"mining" },
                    { n:"工匠设备", i:"🍷", c:"artisan" }, { n:"觅食物品", i:"🍄", c:"foraging" },
                    { n:"献祭收集", i:"🎁", c:"bundles" }, { n:"NPC社交", i:"💬", c:"npcs" }
                ];
                return '<div class="topic-grid">'+ts.map(t=>`<div class="topic-card" data-category="${t.c}"><span class="topic-icon">${t.i}</span>${t.n}</div>`).join('')+'</div>';
            }

            function renderSeasonGrid() {
                const seasons = ["春季","夏季","秋季"];
                let html = '<div class="season-grid">';
                seasons.forEach(season => {
                    const crops = items.filter(i => (i.type==='crop'||i.type==='flower') && i.seasons?.includes(season));
                    html += `<div class="season-block"><h3>${season}</h3><div class="crop-list">`;
                    crops.forEach(c => {
                        let cls = 'crop-link';
                        if (c.multiSeason) cls += ' multi';
                        html += `<span class="${cls}" data-search="${c.name}">${c.name}${c.isHot?'<span class="hot-tag">🔥</span>':''}</span>`;
                    });
                    html += '</div></div>';
                });
                return html;
            }

            function renderCatList(cat) {
                if(cat==='bundles') return '<h2>🎁 献祭收集包</h2><p>（第三批次将补齐全部收集包）</p>';
                if(cat==='npcs') return `<h2>💬 居民速查</h2><div class="info-grid">${npcs.map(n=>`<div class="info-card" style="cursor:pointer;" data-search="${n.name}"><h4>${n.name} <small>${n.birthday}</small></h4><p>🏠 ${n.address}</p><p>❤️ ${n.loves.slice(0,3).join('、')}等</p></div>`).join('')}</div>`;
                if(cat==='all') return renderTopics();
                const types = categoryMap[cat]||[];
                const filtered = items.filter(i=>types.includes(i.type));
                if(!filtered.length) return '<p>暂无数据，后续批次补充。</p>';
                return `<h2>📋 列表</h2><table><tr><th>名称</th><th>来源</th><th>基础价</th></tr>
                    ${filtered.map(i=>`<tr><td><span class="link-like" data-search="${i.name}">${i.name}</span></td><td>${i.seasons?.join('、')||i.location||'—'}</td><td>${i.basePrice}G</td></tr>`).join('')}</table>`;
            }

            function buildFlow(item) {
                let html = '<div class="decision-flow">';
                if(item.sacrifices?.length){
                    const groups={};
                    item.sacrifices.forEach(s=>{ if(!groups[s.room]) groups[s.room]=[]; groups[s.room].push(s); });
                    html+='<div class="flow-step"><div class="flow-title">🎯 先献祭</div><div class="flow-branch">';
                    for(const[room,sacs] of Object.entries(groups)){
                        html+=`<div class="flow-line"><span class="arrow">→</span><strong>${room}</strong></div>`;
                        sacs.forEach(s=>{
                            const q = s.quality ? (s.quality==='金星'?' <span class="quality-tag gold">金星</span>':' <span class="quality-tag">'+s.quality+'</span>') : '';
                            html+=`<div class="flow-line" style="margin-left:1.6rem;">${s.bundle}：留 ${s.need} 个${q}</div>`;
                        });
                    }
                    html+='</div></div>';
                }
                if(item.retention && item.retention > 0) {
                    html+=`<div class="flow-step"><div class="flow-title">📦 额外留存</div><div class="flow-branch"><div class="flow-line"><span class="arrow">→</span> 需留存 <strong>${item.retention} 个</strong></div></div></div>`;
                }
                if(item.decision) {
                    html+=`<div class="flow-step"><div class="flow-title">🧭 建议</div><div class="flow-branch"><div class="flow-line">${item.decision}</div></div></div>`;
                }
                if(item.processing?.length){
                    html+='<div class="flow-step"><div class="flow-title">⚡ 处理</div><div class="flow-branch">';
                    item.processing.forEach(p => {
                        html+=`<div class="flow-line"><span class="arrow">→</span> <span class="link-like" data-search="${p.method.split('→')[0].trim()}">${p.method}</span> → <strong>${p.product}</strong> <span class="price-note">(${p.price}G)</span> ${p.note?'<small>'+p.note+'</small>':''}</div>`;
                    });
                    html+='</div></div>';
                }
                if(item.gifts && (item.gifts.loves?.length || item.gifts.likes?.length)) {
                    html+='<div class="flow-step"><div class="flow-title">💝 送谁</div><div class="flow-branch">';
                    if(item.gifts.loves?.length) html+=`<div class="flow-line"><span class="arrow">→</span> ❤️ 最爱：${item.gifts.loves.map(n=>`<span class="link-like" data-search="${n}">${n}</span>`).join('、')}</div>`;
                    if(item.gifts.likes?.length) html+=`<div class="flow-line"><span class="arrow">→</span> 👍 喜欢：${item.gifts.likes.map(n=>`<span class="link-like" data-search="${n}">${n}</span>`).join('、')}</div>`;
                    html+='</div></div>';
                }
                html+='</div>';
                return html;
            }

            function renderNPC(npc) {
                return `<div class="search-result-item">
                    <div class="item-header"><span class="item-name">${npc.name}</span><span class="item-type-badge">NPC</span></div>
                    <div class="decision-flow">
                        <div class="flow-step"><div class="flow-title">📅 生日</div><div class="flow-branch"><div class="flow-line">${npc.birthday}</div></div></div>
                        <div class="flow-step"><div class="flow-title">🏠 住址</div><div class="flow-branch"><div class="flow-line">${npc.address}</div></div></div>
                        <div class="flow-step"><div class="flow-title">🗺️ 行程</div><div class="flow-branch"><div class="flow-line">${npc.schedule}</div></div></div>
                        <div class="flow-step"><div class="flow-title">❤️ 最爱</div><div class="flow-branch"><div class="flow-line">${npc.loves.join('、')}</div></div></div>
                        <div class="flow-step"><div class="flow-title">👍 喜欢</div><div class="flow-branch"><div class="flow-line">${npc.likes.join('、')||'—'}</div></div></div>
                        <div class="flow-step"><div class="flow-title">👎 讨厌</div><div class="flow-branch"><div class="flow-line">${npc.dislikes.join('、')||'—'}</div></div></div>
                    </div>
                </div>`;
            }

            function renderCurrent() {
                if(searchQuery.trim()) {
                    const kw = searchQuery.toLowerCase().trim();
                    const itemRes = items.filter(i=>i.name.toLowerCase().includes(kw));
                    const npcRes = npcs.filter(n=>n.name.toLowerCase().includes(kw));
                    if(!itemRes.length && !npcRes.length) { contentArea.innerHTML='<p>😕 未找到</p>'; return; }
                    let html = '';
                    itemRes.forEach(item => {
                        html += `<div class="search-result-item">
                            <div class="item-header"><span class="item-name">${item.name}</span><span class="item-type-badge">${item.type}</span>${item.basePrice?`<span style="color:#b8860b;font-weight:700;">${item.basePrice}G</span>`:''}</div>
                            ${buildFlow(item)}
                            <div class="info-grid">
                                <div class="info-card"><h4>📅 基础</h4><p>季节/来源：${item.seasons?.join('、')||item.location||'—'}</p>${item.growthDays?`<p>成熟：${item.growthDays}天</p>`:''}</div>
                            </div>
                        </div>`;
                    });
                    npcRes.forEach(npc => { html += renderNPC(npc); });
                    contentArea.innerHTML = html;
                } else {
                    contentArea.innerHTML = renderCatList(currentCat);
                }
            }

            categoryBtns.forEach(b=>b.addEventListener('click',function(){
                categoryBtns.forEach(x=>x.classList.remove('active'));
                this.classList.add('active');
                pushState(this.dataset.category, '');
                searchInput.value = '';
                updatePath(currentCat==='all'?'主页':currentCat);
                renderCurrent();
            }));

            searchInput.addEventListener('input',function(){
                searchQuery = this.value;
                if(searchQuery.trim()) {
                    categoryBtns.forEach(b=>b.classList.remove('active'));
                    document.querySelector('[data-category="all"]').classList.add('active');
                    pushState('all', searchQuery);
                    updatePath(`搜索: ${searchQuery}`);
                }
                renderCurrent();
            });

            contentArea.addEventListener('click',function(e){
                const link = e.target.closest('[data-search]');
                if(link){
                    pushState(currentCat, searchQuery);
                    searchInput.value = link.dataset.search;
                    searchQuery = link.dataset.search;
                    updatePath(`搜索: ${searchQuery}`);
                    renderCurrent();
                    window.scrollTo({top:0,behavior:'smooth'});
                }
            });

            renderCurrent();
            updatePath('主页');
        })();
    </script>
</body>
</html>
