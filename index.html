        }
        header {
            background: linear-gradient(135deg, #5e3e1c, #8b5d34);

        header h1 { font-size: 2rem; font-weight: 800; letter-spacing: 1px; }
        header p { font-size: 0.9rem; opacity: 0.9; margin-top: 0.2rem; }
        .container { width: 100%; max-width: 1300px; margin: 0 auto; padding: 0.6rem 1.2rem; flex: 1; }
        .search-wrapper { position: relative; max-width: 680px; margin: -30px auto 1.5rem auto; z-index: 10; }
        .search-wrapper input {
            width: 100%; padding: 0.9rem 1.5rem; font-size: 1.1rem; border: 3px solid var(--border);
            border-radius: 50px; background: white; box-shadow: var(--shadow); outline: none;
            font-family: var(--font); transition: 0.2s;
        }
        .search-wrapper input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(122,92,58,0.2); }
        .search-icon { position: absolute; right: 20px; top: 50%; transform: translateY(-50%); font-size: 1.3rem; color: var(--accent); }
        .categories { display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: center; margin-bottom: 1.2rem; }
        .category-btn {
            background: white; border: 2px solid var(--border); padding: 0.5rem 1.1rem;
            border-radius: 40px; font-weight: 600; cursor: pointer; font-size: 0.85rem;
            transition: all 0.2s; color: var(--accent); box-shadow: 0 2px 6px rgba(0,0,0,0.04);
            font-family: var(--font); display: flex; align-items: center; gap: 4px;
        }
        .category-btn:hover, .category-btn.active {
            background: var(--accent); color: white; border-color: var(--accent); transform: translateY(-2px);
        }
        .content-area {
            background: var(--card); border-radius: var(--radius); padding: 1rem 1rem;
            box-shadow: var(--shadow); min-height: 400px; border: 1px solid #e8d8be;
        }

        .season-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 1rem; }
        .season-block { background: #fff; border-radius: 12px; padding: 1rem; border: 1px solid #e0cfad; }
        .season-block h3 { font-size: 1.1rem; margin-bottom: 0.6rem; color: var(--accent); }
        .crop-list { display: flex; flex-wrap: wrap; gap: 0.4rem; }
        .crop-link {
            background: #f5ede0; padding: 0.2rem 0.7rem; border-radius: 12px; cursor: pointer;
            font-size: 0.9rem; font-weight: 500; transition: 0.1s; border: 1px solid transparent;
            display: inline-flex; align-items: center; gap: 3px;
        }
        .crop-link:hover { background: var(--accent); color: white; border-color: var(--accent); }
        .crop-link.multi { font-style: italic; border-color: #c9ad7a; }
        .hot-tag { font-size: 0.65rem; background: #e0553d; color: white; padding: 0 4px; border-radius: 6px; margin-left: 2px; }

        .search-result-item {
            background: white; border-radius: 14px; padding: 1.2rem; margin-bottom: 1.5rem;
            box-shadow: 0 4px 16px rgba(0,0,0,0.05); border-left: 5px solid var(--gold);

        .item-header { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.2rem; flex-wrap: wrap; }
        .item-name { font-size: 1.7rem; font-weight: 800; color: #3e2b14; }
        .item-type-badge { background: var(--accent); color: white; padding: 0.15rem 0.7rem; border-radius: 20px; font-size: 0.8rem; font-weight: 600; }

        .decision-flow {
            background: #fdf9f2; border-radius: 12px; padding: 0.9rem 1.1rem;
            margin: 0.7rem 0 0.8rem; border: 1px solid #e6d0b3;
        }
        .flow-step { margin-bottom: 0.5rem; }
        .flow-step:last-child { margin-bottom: 0; }
        .flow-title { font-weight: 700; font-size: 0.95rem; margin-bottom: 0.3rem; display: flex; align-items: center; gap: 0.4rem; }
        .flow-branch { margin-left: 0.6rem; border-left: 2px dashed #d0b894; padding-left: 0.9rem; }
        .flow-line { padding: 0.2rem 0; font-size: 0.9rem; display: flex; align-items: baseline; gap: 0.3rem; flex-wrap: wrap; }
        .flow-line .arrow { color: #b08968; }
        .price-note { font-size: 0.75rem; color: #6b5e4f; }
        .quality-tag { font-size: 0.75rem; padding: 0.1rem 0.4rem; border-radius: 6px; background: #e5d5bb; margin-left: 0.1rem; }
        .quality-tag.gold { background: #fbe5b3; color: #7a5800; }
        .link-like { color: var(--blue); text-decoration: underline; cursor: pointer; font-weight: 500; }
        .info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 0.8rem; margin-top: 0.8rem; }
        .info-card { background: #faf6ee; border-radius: 10px; padding: 0.7rem 0.8rem; border: 1px solid #e0cfad; }
        .info-card h4 { margin-bottom: 0.3rem; color: var(--accent); font-size: 0.9rem; }
        footer { text-align: center; padding: 1.2rem; color: #7b6e5a; font-size: 0.8rem; margin-top: 1.5rem; }
        .fish-location { font-size: 0.8rem; color: #6b5e4f; margin-top: 0.2rem; }

            .item-name { font-size: 1.4rem; }
            header h1 { font-size: 1.6rem; }
            .container { padding: 0.3rem; }
            .content-area { padding: 0.7rem 0.5rem; }

                  sacrifices:[{room:"鱼缸", bundle:"河鱼收集包", need:1}] },
                { id:"smallmouth_bass", name:"小嘴鲈鱼", type:"fish", seasons:["春季","秋季"], basePrice:50, location:"河流·湖泊·全天",
                  sacrifices:[] },
                { id:"sardine", name:"沙丁鱼", type:"fish", seasons:["春季","秋季","冬季"], basePrice:40, location:"海洋·6AM-7PM",
                  sacrifices:[{room:"鱼缸", bundle:"海鱼收集包", need:1}] },
                { id:"anchovy", name:"鳀鱼", type:"fish", seasons:["春季","秋季"], basePrice:30, location:"海洋·全天",
                  sacrifices:[] },
                { id:"herring", name:"鲱鱼", type:"fish", seasons:["春季","冬季"], basePrice:30, location:"海洋·全天",
                  sacrifices:[] },
                { id:"halibut", name:"大比目鱼", type:"fish", seasons:["春季","夏季","冬季"], basePrice:80, location:"海洋·6AM-11AM·7PM-2AM",
                  sacrifices:[] },
                { id:"eel", name:"鳗鱼", type:"fish", seasons:["春季","秋季"], basePrice:85, location:"海洋·雨天·4PM-2AM",
                  sacrifices:[{room:"鱼缸", bundle:"夜间垂钓收集包", need:1}] },
                { id:"largemouth_bass", name:"大嘴鲈鱼", type:"fish", seasons:["全季"], basePrice:100, location:"深山湖泊·6AM-7PM",
                  sacrifices:[{room:"鱼缸", bundle:"湖鱼收集包", need:1}] },
                { id:"carp", name:"鲤鱼", type:"fish", seasons:["全季"], basePrice:30, location:"深山湖泊·全天",
                  sacrifices:[{room:"鱼缸", bundle:"湖鱼收集包", need:1}] },
                { id:"sturgeon", name:"鲟鱼", type:"fish", seasons:["夏季","冬季"], basePrice:200, location:"深山湖泊·6AM-7PM",
                  sacrifices:[{room:"鱼缸", bundle:"湖鱼收集包", need:1}] },
                { id:"rainbow_trout", name:"虹鳟鱼", type:"fish", seasons:["夏季"], basePrice:65, location:"河流·晴天·6AM-7PM",
                  sacrifices:[{room:"鱼缸", bundle:"特色鱼类收集包", need:1}] },
                { id:"dorado", name:"麻哈脂鲤", type:"fish", seasons:["夏季"], basePrice:100, location:"煤矿森林河流·晴天·6AM-7PM",
                  sacrifices:[] },
                { id:"pufferfish", name:"河豚", type:"fish", seasons:["夏季"], basePrice:200, location:"海洋·晴天·12PM-4PM",
                  sacrifices:[{room:"鱼缸", bundle:"特色鱼类收集包", need:1}] },
                { id:"tuna", name:"金枪鱼", type:"fish", seasons:["夏季","冬季"], basePrice:100, location:"海洋·6AM-7PM",
                  sacrifices:[{room:"鱼缸", bundle:"海鱼收集包", need:1}] },
                { id:"red_snapper", name:"红鲫鱼", type:"fish", seasons:["夏季","秋季"], basePrice:50, location:"海洋·雨天·6AM-7PM",
                  sacrifices:[{room:"鱼缸", bundle:"海鱼收集包", need:1}] },
                { id:"tilapia", name:"罗非鱼", type:"fish", seasons:["夏季","秋季"], basePrice:75, location:"海洋·6AM-2PM",
                  sacrifices:[{room:"鱼缸", bundle:"海鱼收集包", need:1}] },
                { id:"walleye", name:"大眼鱼", type:"fish", seasons:["秋季","冬季"], basePrice:105, location:"河流·雨天·12PM-2AM",
                  sacrifices:[{room:"鱼缸", bundle:"夜间垂钓收集包", need:1}] },
                { id:"midnight_carp", name:"午夜鲤鱼", type:"fish", seasons:["秋季","冬季"], basePrice:150, location:"深山湖泊·10PM-2AM",
                  sacrifices:[] },
                { id:"salmon", name:"鲑鱼", type:"fish", seasons:["秋季"], basePrice:75, location:"河流·6AM-7PM",
                  sacrifices:[] },
                { id:"sea_cucumber", name:"海参", type:"fish", seasons:["秋季","冬季"], basePrice:75, location:"海洋·6AM-7PM",
                  sacrifices:[] },
                { id:"lingcod", name:"蛇齿单线鱼", type:"fish", seasons:["冬季"], basePrice:120, location:"河流·全天",
                  sacrifices:[] },
                { id:"perch", name:"河鲈", type:"fish", seasons:["冬季"], basePrice:55, location:"河流·全天",
                  sacrifices:[] },
                { id:"squid", name:"鱿鱼", type:"fish", seasons:["冬季"], basePrice:80, location:"海洋·6PM-2AM",
                  sacrifices:[] },

                // ===== 矿物/战斗 =====
                { id:"copper_ore", name:"铜矿石", type:"mineral", basePrice:5, processing:[{method:"熔炉", product:"铜锭", price:60}], sacrifices:[] },
                { id:"iron_ore", name:"铁矿石", type:"mineral", basePrice:10, processing:[{method:"熔炉", product:"铁锭", price:120}], sacrifices:[] },
                { id:"gold_ore", name:"金矿石", type:"mineral", basePrice:25, processing:[{method:"熔炉", product:"金锭", price:250}], sacrifices:[] },
                { id:"iridium_ore", name:"铱矿石", type:"mineral", basePrice:100, processing:[{method:"熔炉", product:"铱锭", price:1000}], sacrifices:[] },
                { id:"prismatic_shard", name:"五彩碎片", type:"mineral", basePrice:2000, processing:[], sacrifices:[] },

                // ===== 工匠设备 =====
                { id:"keg", name:"小桶", type:"artisan", basePrice:0, processing:[], sacrifices:[] },
                { id:"jar", name:"罐头瓶", type:"artisan", basePrice:0, processing:[], sacrifices:[] },
            ];

            const npcs = [
                { name:"阿比盖尔", loves:["紫水晶","南瓜","巧克力蛋糕"] },
                { name:"塞巴斯蒂安", loves:["泪晶","虚空蛋","生鱼片"] },
                { name:"山姆", loves:["仙人掌果子","披萨","虎眼石"] },
                { name:"潘妮", loves:["绿宝石","罂粟","甜瓜"] },
                { name:"哈维", loves:["咖啡","腌菜","果酒"] },
            ];

            const bundles = [
                { room:"茶水间", name:"春季作物收集包", items:"防风草、青豆、花椰菜、土豆" },
                { room:"茶水间", name:"夏季作物收集包", items:"番茄、辣椒、蓝莓、甜瓜" },
                { room:"茶水间", name:"秋季作物收集包", items:"玉米、茄子、南瓜、山药" },
                { room:"茶水间", name:"高品质作物收集包", items:"5个金星品质作物" },
                { room:"鱼缸", name:"河鱼收集包", items:"太阳鱼、鲶鱼、小嘴鲈鱼" },
                { room:"鱼缸", name:"湖鱼收集包", items:"大嘴鲈鱼、鲤鱼" },
                { room:"工艺室", name:"花园收集包", items:"郁金香、蓝爵、金鸡菊等" },
                { room:"布告栏", name:"稀有作物收集包", items:"上古水果、宝石甜莓" },
            ];

            const categoryMap = {
                crops: ['crop','flower'], animal: ['animal_product'], fish: ['fish'],
                mining: ['mineral'], artisan: ['artisan'],
            };

            const contentArea = document.getElementById('contentArea');
            const searchInput = document.getElementById('searchInput');
            const categoryBtns = document.querySelectorAll('.category-btn');
            let currentCat = 'all', searchQuery = '';

            function renderTopics() {
                const ts = [
                    { n:"作物种植", i:"🌽", c:"crops" }, { n:"畜牧产品", i:"🐄", c:"animal" },
                    { n:"钓鱼蟹笼", i:"🎣", c:"fish" }, { n:"矿场战斗", i:"⛏", c:"mining" },
                    { n:"工匠设备", i:"🍷", c:"artisan" }, { n:"献祭收集", i:"🎁", c:"bundles" },
                    { n:"NPC社交", i:"💬", c:"npcs" }
                ];
                return '<div class="topic-grid">'+ts.map(t=>`<div class="topic-card" data-category="${t.c}"><span class="topic-icon">${t.i}</span>${t.n}</div>`).join('')+'</div>';
            }

            function renderSeasonGrid() {
                const seasons = ["春季","夏季","秋季","姜岛"];
                let html = '<div class="season-grid">';
                seasons.forEach(season => {
                    const crops = items.filter(i => (i.type==='crop'||i.type==='flower') && i.seasons.includes(season));
                    html += `<div class="season-block"><h3>${season}</h3><div class="crop-list">`;
                    crops.forEach(c => {
                        let cls = 'crop-link';
                        if (c.multiSeason) cls += ' multi';
                        html += `<span class="${cls}" data-search="${c.name}">${c.name}${c.isHot?'<span class="hot-tag">🔥</span>':''}</span>`;
                    });
                    html += '</div></div>';
                });
                html += '</div>';
                return html;
            }

            function renderCatList(cat) {
                if(cat==='crops') return renderSeasonGrid();
                if(cat==='bundles') return '<h2>🎁 献祭收集包</h2><div class="info-grid">'+bundles.map(b=>`<div class="info-card"><h4>${b.room} · ${b.name}</h4><p>${b.items}</p></div>`).join('')+'</div>';
                if(cat==='npcs') return '<h2>💬 NPC 最爱</h2><div class="info-grid">'+npcs.map(n=>`<div class="info-card"><h4>${n.name}</h4><p>❤️ ${n.loves.join('、')}</p></div>`).join('')+'</div>';
                if(cat==='all') return renderTopics();
                const types = categoryMap[cat]||[];
                const filtered = items.filter(i=>types.includes(i.type));
                if(!filtered.length) return '<p>暂无数据。</p>';
                return `<h2>📋 列表</h2><table><tr><th>物品</th><th>来源/季节</th><th>基础价</th></tr>
                    ${filtered.map(i=>`<tr><td><span class="link-like" data-search="${i.name}">${i.name}</span></td><td>${i.seasons?.join('、') || i.location || '—'}</td><td>${i.basePrice}G</td></tr>`).join('')}</table>`;
            }

            function buildFlow(item) {
                let html = '<div class="decision-flow">';
                if(item.sacrifices?.length){
                    const groups={};
                    item.sacrifices.forEach(s=>{ if(!groups[s.room]) groups[s.room]=[]; groups[s.room].push(s); });
                    html+='<div class="flow-step"><div class="flow-title">🎯 先献祭</div><div class="flow-branch">';
                    for(const[room,sacs] of Object.entries(groups)){
                        html+=`<div class="flow-line"><span class="arrow">→</span><strong>${room}</strong></div>`;
                        sacs.forEach(s=>{
                            const q = s.quality==='金星'?' <span class="quality-tag gold">金星</span>':(s.quality?' <span class="quality-tag">'+s.quality+'</span>':'');
                            html+=`<div class="flow-line" style="margin-left:1.6rem;">${s.bundle}：留 ${s.need} 个${q}</div>`;
                        });
                    }
                    html+='</div></div>';
                }
                const mainProc = item.processing?.[0];
                if(mainProc){
                    html+='<div class="flow-step"><div class="flow-title">⚡ 看品质</div><div class="flow-branch">';
                    const goldSell = item.goldPrice||item.basePrice;
                    html+=`<div class="flow-line"><span class="arrow">→</span> ⭐金/铱星 → 直接卖 <span class="price-note">(${goldSell}G)</span></div>`;
                    html+=`<div class="flow-line"><span class="arrow">→</span> 🟤普通/银星 → 进 <span class="link-like" data-search="${mainProc.method}">${mainProc.method}</span> 做 <strong>${mainProc.product}</strong> <span class="price-note">(${mainProc.price}G)</span>`;
                    html+=`<div class="flow-line" style="margin-left:2rem; font-size:0.85rem;">↳ 没机器？暂存，急用钱再卖</div>`;
                    html+='</div></div>';
                } else if(item.type === 'fish') {
                    html+='<div class="flow-step"><div class="flow-title">🎣 垂钓信息</div><div class="flow-branch">';
                    html+=`<div class="flow-line"><span class="arrow">→</span> 地点/条件：${item.location || '查看详情'}</div>`;
                    html+=`<div class="flow-line"><span class="arrow">→</span> 售价：${item.basePrice}G</div>`;
                    html+='</div></div>';
                }
                html+='</div>';
                return html;
            }

            function performSearch(q){
                if(!q.trim()) return renderCurrent();
                const kw=q.toLowerCase().trim();
                const res=items.filter(i=>i.name.toLowerCase().includes(kw));
                if(!res.length){ contentArea.innerHTML='<p>😕 未找到</p>'; return; }
                contentArea.innerHTML=res.map(item=>`
                    <div class="search-result-item">
                        <div class="item-header"><span class="item-name">${item.name}</span><span class="item-type-badge">${item.type}</span></div>
                        ${buildFlow(item)}
                        <div class="info-grid">
                            <div class="info-card"><h4>📅 基础</h4>
                                <p>季节：${item.seasons?.join('、')||'—'}</p>
                                ${item.growthDays?`<p>成熟：${item.growthDays}天</p>`:''}
                                ${item.location?`<p>地点：${item.location}</p>`:''}
                            </div>
                        </div>
                    </div>`).join('');
            }

            function renderCurrent(){
                if(searchQuery.trim()) performSearch(searchQuery);
                else contentArea.innerHTML = renderCatList(currentCat);
            }

            categoryBtns.forEach(b=>b.addEventListener('click',function(){
                categoryBtns.forEach(x=>x.classList.remove('active'));
                this.classList.add('active');
                currentCat=this.dataset.category;
                searchInput.value='';
                searchQuery='';
                renderCurrent();
            }));

            searchInput.addEventListener('input',function(){
                searchQuery=this.value;
                if(searchQuery.trim()){
                    categoryBtns.forEach(b=>b.classList.remove('active'));
                    document.querySelector('[data-category="all"]').classList.add('active');
                    currentCat='all';
                }
                renderCurrent();
            });

            contentArea.addEventListener('click',function(e){
                const card=e.target.closest('.topic-card');
                if(card?.dataset.category) document.querySelector(`.category-btn[data-category="${card.dataset.category}"]`).click();
                const link=e.target.closest('[data-search]');
                if(link){
                    searchInput.value=link.dataset.search;
                    searchQuery=link.dataset.search;
                    renderCurrent();
                    window.scrollTo({top:0,behavior:'smooth'});
                }
            });

            renderCurrent();
        })();
    </script>
</body>
</html>
