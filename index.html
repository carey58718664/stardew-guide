            ];

            const npcs = [
                { id:"maru", name:"玛鲁", birthday:"夏季10日", address:"山路24号", schedule:"周二/周四诊所。", loves:["电池组","花椰菜","钻石","草莓"], likes:["铜锭","石英"] },
                { id:"abigail", name:"阿比盖尔", birthday:"秋季13日", address:"皮埃尔杂货店二楼", schedule:"白天杂货店或图书馆。", loves:["紫水晶","南瓜","巧克力蛋糕"], likes:["石英"] },
                { id:"harvey", name:"哈维", birthday:"冬季14日", address:"哈维诊所", schedule:"周二/周四诊所。", loves:["咖啡","腌菜","果酒"], likes:["普通蘑菇"] },
                { id:"willy", name:"威利", birthday:"夏季24日", address:"沙滩鱼店", schedule:"鱼店9AM-5PM。", loves:["鲟鱼","鲶鱼","章鱼","海参"], likes:["金锭"] },
                { id:"elliott", name:"艾利欧特", birthday:"秋季5日", address:"沙滩小屋", schedule:"白天在家或沙滩。", loves:["蟹黄糕","鸭毛","龙虾","鱿鱼墨汁"], likes:["章鱼","鱿鱼"] },
            ];

            const categoryMap = { crops: ['crop','flower'], animal: ['animal_product'], fish: ['fish'], mining: ['mineral','tool'], artisan: ['artisan','artisan_good'], foraging: ['foraging'] };
            const contentArea = document.getElementById('contentArea');
            const searchInput = document.getElementById('searchInput');
            const categoryBtns = document.querySelectorAll('.category-btn');
            const backBtn = document.getElementById('backBtn');
            const currentPath = document.getElementById('currentPath');
            let currentCat = 'all', searchQuery = '';
            let historyStack = [];

            function updatePath(t) { currentPath.textContent = t; }
            function pushState(c, q) { historyStack.push({cat:currentCat, query:searchQuery}); currentCat=c; searchQuery=q; }
            function goBack() {
                if (!historyStack.length) { currentCat='all'; searchQuery=''; searchInput.value=''; updatePath('主页'); renderCurrent(); return; }
                const p = historyStack.pop(); currentCat=p.cat; searchQuery=p.query; searchInput.value=searchQuery;
                updatePath(searchQuery?`搜索: ${searchQuery}`:currentCat==='all'?'主页':currentCat); renderCurrent();
            }
            backBtn.addEventListener('click', goBack);

            function renderTopics(){
                const ts=[{n:"作物种植",i:"🌽",c:"crops"},{n:"畜牧产品",i:"🐄",c:"animal"},{n:"钓鱼蟹笼",i:"🎣",c:"fish"},{n:"矿场战斗",i:"⛏",c:"mining"},{n:"工匠设备",i:"🍷",c:"artisan"},{n:"觅食物品",i:"🍄",c:"foraging"},{n:"献祭收集",i:"🎁",c:"bundles"},{n:"NPC社交",i:"💬",c:"npcs"}];
                return '<div class="topic-grid">'+ts.map(t=>`<div class="topic-card" data-category="${t.c}"><span class="topic-icon">${t.i}</span>${t.n}</div>`).join('')+'</div>';
            }

            function renderSeasonGrid(){
                const seasons=["春季","夏季","秋季"];
                let html='<div class="season-grid">';
                seasons.forEach(season=>{
                    const crops=items.filter(i=>(i.type==='crop'||i.type==='flower')&&i.seasons?.includes(season));
                    html+=`<div class="season-block"><h3>${season}</h3><div class="crop-list">`;
                    crops.forEach(c=>{ let cls='crop-link'; if(c.multiSeason) cls+=' multi'; html+=`<span class="${cls}" data-search="${c.name}">${c.name}${c.isHot?'<span class="hot-tag">🔥</span>':''}</span>`; });
                    html+='</div></div>';
                });
                return html+'</div>';
            }

            function renderAnimalCol(type){
                const list=items.filter(i=>i.type==='animal_product'&&i.sourceLink===type);
                return list.map(i=>`<span class="item-link" data-search="${i.name}">${i.name}</span>`).join(' ');
            }

            function renderCatList(cat){
                if(cat==='crops') return renderSeasonGrid();
                if(cat==='animal') return `<div class="animal-grid"><div class="animal-col"><h3>🐔 鸡舍产品</h3><div class="animal-list">${renderAnimalCol('鸡舍')}</div></div><div class="animal-col"><h3>🐄 畜棚产品</h3><div class="animal-list">${renderAnimalCol('畜棚')}</div></div></div>`;
                if(cat==='fish'){
                    const groups=[
                        {title:"🏞️ 河流",locs:["鹈鹕镇河流","煤矿森林河流"]},{title:"🏔️ 湖泊",locs:["深山湖泊"]},{title:"🌊 海洋",locs:["沙滩"]},
                        {title:"⛏️ 矿井",locs:["矿井20/60/100层"]},{title:"🦀 蟹笼",locs:["蟹笼（海洋）","蟹笼（淡水）"]},
                    ];
                    return '<div class="fish-grid">'+groups.map(g=>{ const list=items.filter(i=>i.type==='fish'&&g.locs.includes(i.location)); return `<div class="fish-block"><h3>${g.title}</h3><div class="fish-list">${list.map(i=>`<span class="item-link" data-search="${i.name}">${i.name}</span>`).join(' ')}</div></div>`; }).join('')+'</div>';
                }
                if(cat==='artisan') return `<h2>🍷 工匠设备</h2><div class="info-grid">${items.filter(i=>i.type==='artisan').map(i=>`<div class="info-card" style="cursor:pointer;" data-search="${i.name}"><h4>${i.name}</h4><p>${i.unlock||''}</p><small>${i.desc?.substring(0,30)}…</small></div>`).join('')}</div>`;
                if(cat==='npcs') return `<h2>💬 居民速查</h2><div class="info-grid">${npcs.map(n=>`<div class="info-card" style="cursor:pointer;" data-search="${n.name}"><h4>${n.name} <small>${n.birthday}</small></h4><p>🏠 ${n.address}</p><p>❤️ ${n.loves.slice(0,3).join('、')}等</p></div>`).join('')}</div>`;
                if(cat==='bundles') return '<p>献祭包将在后续批次补全。</p>';
                if(cat==='all') return renderTopics();
                const types=categoryMap[cat]||[];
                const filtered=items.filter(i=>types.includes(i.type));
                if(!filtered.length) return '<p>暂无数据。</p>';
                return `<h2>📋 列表</h2><div class="fish-list">${filtered.map(i=>`<span class="item-link" data-search="${i.name}">${i.name}</span>`).join(' ')}</div>`;
            }

            function buildFlow(item){
                let html='<div class="decision-flow">';
                if(item.sacrifices?.length){ html+='<div class="flow-step"><div class="flow-title">🎯 献祭</div><div class="flow-branch">'; item.sacrifices.forEach(s=>{ const q=s.quality?' <span class="price-note">('+s.quality+')</span>':''; html+=`<div class="flow-line"><span class="arrow">→</span> ${s.room} · ${s.bundle}：留 ${s.need} 个${q}</div>`; }); html+='</div></div>'; }
                if(item.desc){ html+=`<div class="flow-step"><div class="flow-title">🛠️ 用途</div><div class="flow-branch"><div class="flow-line">${item.desc}</div></div></div>`; }
                if(item.recipe){ html+=`<div class="flow-step"><div class="flow-title">🔧 配方</div><div class="flow-branch"><div class="flow-line">${item.recipe}</div></div></div>`; }
                if(item.unlock){ html+=`<div class="flow-step"><div class="flow-title">📌 解锁</div><div class="flow-branch"><div class="flow-line">${item.unlock}</div></div></div>`; }
                if(item.processing?.length){ html+='<div class="flow-step"><div class="flow-title">⚡ 加工</div><div class="flow-branch">'; item.processing.forEach(p=>{ html+=`<div class="flow-line"><span class="arrow">→</span> <span class="link-like" data-search="${p.method}">${p.method}</span> → <strong>${p.product}</strong> <span class="price-note">(${p.price}G)</span></div>`; }); html+='</div></div>'; }
                if(item.source){ html+=`<div class="flow-step"><div class="flow-title">📦 来源</div><div class="flow-branch"><div class="flow-line"><span class="arrow">→</span> <span class="link-like" data-search="${item.sourceLink}">${item.source}</span></div></div></div>`; }
                if(item.location){ html+=`<div class="flow-step"><div class="flow-title">🎣 垂钓</div><div class="flow-branch"><div class="flow-line"><span class="arrow">→</span> ${item.location} · ${item.time}</div></div></div>`; }
                if(item.note) html+=`<div class="flow-step"><div class="flow-title">💡 提示</div><div class="flow-branch"><div class="flow-line">${item.note}</div></div></div>`;
                html+='</div>'; return html;
            }

            function renderCurrent(){
                if(searchQuery.trim()){
                    const kw=searchQuery.toLowerCase().trim();
                    const res=items.filter(i=>i.name.toLowerCase().includes(kw));
                    const npcRes=npcs.filter(n=>n.name.toLowerCase().includes(kw));
                    if(!res.length&&!npcRes.length){ contentArea.innerHTML='<p>😕 未找到</p>'; return; }
                    contentArea.innerHTML=res.map(item=>`<div class="search-result-item"><div class="item-header"><span class="item-name">${item.name}</span><span class="item-type-badge">${item.type}</span></div>${buildFlow(item)}</div>`).join('')+npcRes.map(n=>`<div class="search-result-item"><div class="item-header"><span class="item-name">${n.name}</span><span class="item-type-badge">NPC</span></div><div class="decision-flow"><div class="flow-step"><div class="flow-title">📅 生日</div><div class="flow-branch"><div class="flow-line">${n.birthday}</div></div></div><div class="flow-step"><div class="flow-title">🏠 住址</div><div class="flow-branch"><div class="flow-line">${n.address}</div></div></div><div class="flow-step"><div class="flow-title">❤️ 最爱</div><div class="flow-branch"><div class="flow-line">${n.loves.join('、')}</div></div></div></div></div>`).join('');
                } else { contentArea.innerHTML = renderCatList(currentCat); }
            }

            categoryBtns.forEach(b=>b.addEventListener('click',function(){ categoryBtns.forEach(x=>x.classList.remove('active')); this.classList.add('active'); pushState(this.dataset.category, ''); searchInput.value=''; updatePath(currentCat); renderCurrent(); }));
            searchInput.addEventListener('input',function(){ searchQuery=this.value; if(searchQuery.trim()){ categoryBtns.forEach(b=>b.classList.remove('active')); document.querySelector('[data-category="all"]').classList.add('active'); pushState('all', searchQuery); updatePath(`搜索: ${searchQuery}`); } renderCurrent(); });
            contentArea.addEventListener('click',function(e){ const link=e.target.closest('[data-search]'); if(link){ pushState(currentCat, searchQuery); searchInput.value=link.dataset.search; searchQuery=link.dataset.search; updatePath(`搜索: ${searchQuery}`); renderCurrent(); window.scrollTo({top:0,behavior:'smooth'}); } });
            renderCurrent(); updatePath('主页');
        })();
    </script>
</body>
</html>
