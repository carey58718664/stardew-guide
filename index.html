        header h1 { font-size: 2rem; font-weight: 800; }
        header p { font-size: 0.9rem; opacity: 0.9; margin-top: 0.2rem; }
        .container { width: 100%; max-width: 1300px; margin: 0 auto; padding: 0.6rem 1.2rem; flex: 1; }
        .search-wrapper { position: relative; max-width: 680px; margin: -30px auto 1.5rem auto; z-index: 10; }
        .search-wrapper input {
            width: 100%; padding: 0.9rem 1.5rem; font-size: 1.1rem; border: 3px solid var(--border);
            border-radius: 50px; background: white; box-shadow: var(--shadow); outline: none;
            font-family: var(--font);
        }
        .search-wrapper input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(122,92,58,0.2); }
        .search-icon { position: absolute; right: 20px; top: 50%; transform: translateY(-50%); font-size: 1.3rem; color: var(--accent); }
        .categories { display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: center; margin-bottom: 1.2rem; }
        .category-btn {
            background: white; border: 2px solid var(--border); padding: 0.5rem 1.1rem;
            border-radius: 40px; font-weight: 600; cursor: pointer; font-size: 0.85rem;
            transition: all 0.2s; color: var(--accent); box-shadow: 0 2px 6px rgba(0,0,0,0.04);
            font-family: var(--font); display: flex; align-items: center; gap: 4px;
        }
        .category-btn:hover, .category-btn.active {
            background: var(--accent); color: white; border-color: var(--accent); transform: translateY(-2px);
        }
        .content-area {
            background: var(--card); border-radius: var(--radius); padding: 1rem 1rem;
            box-shadow: var(--shadow); min-height: 400px; border: 1px solid #e8d8be;
        }
        .season-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 1rem; }
        .season-block { background: #fff; border-radius: 12px; padding: 1rem; border: 1px solid #e0cfad; }
        .season-block h3 { font-size: 1.1rem; margin-bottom: 0.6rem; color: var(--accent); }
        .crop-list { display: flex; flex-wrap: wrap; gap: 0.4rem; }
        .crop-link {
            background: #f5ede0; padding: 0.2rem 0.7rem; border-radius: 12px; cursor: pointer;
            font-size: 0.9rem; font-weight: 500; transition: 0.1s; border: 1px solid transparent;
            display: inline-flex; align-items: center; gap: 3px;
        }
        .crop-link:hover { background: var(--accent); color: white; border-color: var(--accent); }
        .crop-link.multi { font-style: italic; border-color: #c9ad7a; }
        .hot-tag { font-size: 0.65rem; background: #e0553d; color: white; padding: 0 4px; border-radius: 6px; margin-left: 2px; }
        .search-result-item {
            background: white; border-radius: 14px; padding: 1.2rem; margin-bottom: 1.5rem;

        .item-type-badge { background: var(--accent); color: white; padding: 0.15rem 0.7rem; border-radius: 20px; font-size: 0.8rem; font-weight: 600; }
        .decision-flow {
            background: #fdf9f2; border-radius: 12px; padding: 0.9rem 1.1rem;
            margin: 0.7rem 0 0.8rem; border: 1px solid #e6d0b3;
        }
        .flow-step { margin-bottom: 0.5rem; }
        .flow-step:last-child { margin-bottom: 0; }
        .flow-title { font-weight: 700; font-size: 0.95rem; margin-bottom: 0.3rem; }
        .flow-branch { margin-left: 0.6rem; border-left: 2px dashed #d0b894; padding-left: 0.9rem; }
        .flow-line { padding: 0.2rem 0; font-size: 0.9rem; display: flex; align-items: baseline; gap: 0.3rem; flex-wrap: wrap; }
        .flow-line .arrow { color: #b08968; }
        .price-note { font-size: 0.75rem; color: #6b5e4f; }
        .quality-tag { font-size: 0.75rem; padding: 0.1rem 0.4rem; border-radius: 6px; background: #e5d5bb; margin-left: 0.1rem; }

        .link-like { color: var(--blue); text-decoration: underline; cursor: pointer; font-weight: 500; }
        .info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 0.8rem; margin-top: 0.8rem; }

        .info-card h4 { margin-bottom: 0.3rem; color: var(--accent); font-size: 0.9rem; }
        footer { text-align: center; padding: 1.2rem; color: #7b6e5a; font-size: 0.8rem; margin-top: 1.5rem; }
        @media (max-width: 600px) {

    </style>
</head>

            function renderSeasonGrid() {

                let html = '<div class="season-grid">';
                seasons.forEach(season => {
                    const crops = items.filter(i => (i.type==='crop'||i.type==='flower') && i.seasons?.includes(season));
                    html += `<div class="season-block"><h3>${season}</h3><div class="crop-list">`;
                    crops.forEach(c => {
                        let cls = 'crop-link';
                        if (c.multiSeason) cls += ' multi';
                        html += `<span class="${cls}" data-search="${c.name}">${c.name}${c.isHot?'<span class="hot-tag">🔥</span>':''}</span>`;

                    html += '</div></div>';
                });
                html += '</div>';
                return html;

            function buildFlow(item) {
                let html = '<div class="decision-flow">';
                
                // 献祭分支
                if(item.sacrifices?.length){
                    const groups={};
                    item.sacrifices.forEach(s=>{ if(!groups[s.room]) groups[s.room]=[]; groups[s.room].push(s); });
                    html+='<div class="flow-step"><div class="flow-title">🎯 先献祭</div><div class="flow-branch">';
                    for(const[room,sacs] of Object.entries(groups)){
                        html+=`<div class="flow-line"><span class="arrow">→</span><strong>${room}</strong></div>`;
                        sacs.forEach(s=>{
                            const q = s.quality==='金星'?' <span class="quality-tag gold">金星</span>':(s.quality?' <span class="quality-tag">'+s.quality+'</span>':'');
                            html+=`<div class="flow-line" style="margin-left:1.6rem;">${s.bundle}：留 ${s.need} 个${q}</div>`;
                        });
                    }
                    html+='</div></div>';
                }

                // 加工/处理分支
                if(item.type === 'artisan') {
                    html += '<div class="flow-step"><div class="flow-title">🛠 设备详情</div><div class="flow-branch">';
                    if(item.recipe) html += `<div class="flow-line"><span class="arrow">→</span> 配方：${item.recipe}</div>`;
                    if(item.unlock) html += `<div class="flow-line"><span class="arrow">→</span> 解锁：${item.unlock}</div>`;
                    if(item.desc) html += `<div class="flow-line"><span class="arrow">→</span> 用途：${item.desc}</div>`;
                    html += '</div></div>';
                } else if(item.type === 'mineral') {
                    html += '<div class="flow-step"><div class="flow-title">⚒ 处理方式</div><div class="flow-branch">';
                    if(item.processing?.length) {
                        const p = item.processing[0];
                        html += `<div class="flow-line"><span class="arrow">→</span> 放入<span class="link-like" data-search="熔炉">熔炉</span>烧制 <strong>${p.product}</strong> <span class="price-note">(${p.price}G, +1煤炭, ${p.days}天)</span></div>`;
                    } else {
                        html += `<div class="flow-line">直接出售或用于合成/送礼。</div>`;
                    }
                    html += '</div></div>';
                } else if(item.type === 'fish') {
                    html += '<div class="flow-step"><div class="flow-title">🎣 垂钓指南</div><div class="flow-branch">';
                    html += `<div class="flow-line"><span class="arrow">→</span> 位置/条件：${item.location || '—'}</div>`;
                    html += `<div class="flow-line"><span class="arrow">→</span> 售价：${item.basePrice}G</div>`;
                    if(item.basePrice <= 75) html += `<div class="flow-line"><span class="arrow">→</span> 低价鱼可做成<span class="link-like" data-search="生鱼片">生鱼片</span> (75G) 增值。</div>`;
                    html += '</div></div>';
                } else {
                    const mainProc = item.processing?.[0];
                    if(mainProc) {
                        html += '<div class="flow-step"><div class="flow-title">⚡ 看品质</div><div class="flow-branch">';
                        const goldSell = item.goldPrice || item.basePrice;
                        html += `<div class="flow-line"><span class="arrow">→</span> ⭐金/铱星 → 直接卖 <span class="price-note">(${goldSell}G)</span></div>`;
                        html += `<div class="flow-line"><span class="arrow">→</span> 🟤普通/银星 → 进 <span class="link-like" data-search="${mainProc.method}">${mainProc.method}</span> 做 <strong>${mainProc.product}</strong> <span class="price-note">(${mainProc.price}G)</span></div>`;
                        html += `<div class="flow-line" style="margin-left:2rem; font-size:0.85rem;">↳ 没机器？暂存，急用钱再卖</div>`;
                        html += '</div></div>';
                    }
                }
                html += '</div>';
                return html;
            }

                const kw=q.toLowerCase().trim();
                const res=items.filter(i=>i.name.toLowerCase().includes(kw));
                if(!res.length){ contentArea.innerHTML='<p>😕 未找到，试试"玉米""小桶""传说之鱼"</p>'; return; }
                contentArea.innerHTML=res.map(item=>{
                    let infoHtml = '';
                    if(item.type === 'artisan' && item.recipe) {
                        infoHtml = `<div class="info-card"><h4>🔧 合成配方</h4><p>${item.recipe}</p></div>
                                    <div class="info-card"><h4>📌 解锁方式</h4><p>${item.unlock}</p></div>`;
                    } else {
                        infoHtml = `<div class="info-card"><h4>📅 基础</h4>
                            <p>季节：${item.seasons?.join('、')||'—'}</p>
                            ${item.growthDays?`<p>成熟：${item.growthDays}天</p>`:''}
                            ${item.location?`<p>地点：${item.location}</p>`:''}
                        </div>`;
                    }
                    return `
                    <div class="search-result-item">
                        <div class="item-header">
                            <span class="item-name">${item.name}</span>
                            <span class="item-type-badge">${item.type}</span>
                            ${item.basePrice > 0 ? `<span style="color:#b8860b; font-weight:700;">${item.basePrice}G</span>` : ''}
                        </div>
                        ${buildFlow(item)}
                        <div class="info-grid">${infoHtml}</div>
                    </div>`;
                }).join('');
            }

            function renderCurrent(){
                if(searchQuery.trim()) performSearch(searchQuery);
                else contentArea.innerHTML = renderCatList(currentCat);
            }

            categoryBtns.forEach(b=>b.addEventListener('click',function(){
                categoryBtns.forEach(x=>x.classList.remove('active'));
                this.classList.add('active');
                currentCat=this.dataset.category;
                searchInput.value='';
                searchQuery='';
                renderCurrent();
            }));

            searchInput.addEventListener('input',function(){
                searchQuery=this.value;
                if(searchQuery.trim()){
                    categoryBtns.forEach(b=>b.classList.remove('active'));
                    document.querySelector('[data-category="all"]').classList.add('active');
                    currentCat='all';
                }
                renderCurrent();
            });

            contentArea.addEventListener('click',function(e){
                const card=e.target.closest('.topic-card');
                if(card?.dataset.category) document.querySelector(`.category-btn[data-category="${card.dataset.category}"]`).click();
                const link=e.target.closest('[data-search]');
                if(link){
                    searchInput.value=link.dataset.search;
                    searchQuery=link.dataset.search;
                    renderCurrent();
                    window.scrollTo({top:0,behavior:'smooth'});
                }
            });

            renderCurrent();
        })();
    </script>
</body>
</html>
