<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>星露谷攻略百科</title>
  <style>
    :root{
      --bg:#f5efe3;
      --paper:#fffaf1;
      --paper2:#fff;
      --ink:#241f1a;
      --muted:#756c60;
      --line:#e5d9c5;
      --green:#356a43;
      --green2:#557a3d;
      --gold:#b08435;
      --red:#b8564d;
      --blue:#47708f;
      --shadow:0 16px 45px rgba(75,52,24,.12);
      --radius:26px;
    }

    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      color:var(--ink);
      background:
        radial-gradient(circle at 12% 5%,rgba(255,255,255,.85),transparent 30%),
        linear-gradient(180deg,#fff9ef 0%,var(--bg) 42%,#efe8d9 100%);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
      line-height:1.55;
    }

    button,input,select{
      font:inherit;
    }

    .app{
      max-width:1180px;
      margin:0 auto;
      padding:22px 18px 90px;
    }

    .topbar{
      position:sticky;
      top:0;
      z-index:30;
      padding:12px 0;
      backdrop-filter:blur(18px);
      background:rgba(245,239,227,.78);
      border-bottom:1px solid rgba(229,217,197,.7);
    }

    .topbar-inner{
      max-width:1180px;
      margin:auto;
      padding:0 18px;
      display:flex;
      align-items:center;
      gap:12px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:10px;
      min-width:max-content;
      font-weight:900;
      letter-spacing:.04em;
    }

    .brand-icon{
      width:36px;
      height:36px;
      display:grid;
      place-items:center;
      border-radius:12px;
      background:linear-gradient(135deg,#e9d6a8,#fff7df);
      box-shadow:inset 0 0 0 1px rgba(80,60,25,.08);
    }

    .search-wrap{
      flex:1;
      display:flex;
      align-items:center;
      gap:10px;
      padding:10px 14px;
      border:1px solid var(--line);
      border-radius:999px;
      background:rgba(255,255,255,.82);
      box-shadow:0 8px 24px rgba(80,55,25,.06);
    }

    .search-wrap input{
      width:100%;
      border:0;
      outline:0;
      background:transparent;
      color:var(--ink);
    }

    .layout{
      display:grid;
      grid-template-columns:250px 1fr;
      gap:22px;
      margin-top:24px;
    }

    .sidebar{
      position:sticky;
      top:78px;
      align-self:start;
      border:1px solid var(--line);
      border-radius:var(--radius);
      background:rgba(255,250,241,.84);
      box-shadow:var(--shadow);
      overflow:hidden;
    }

    .side-title{
      padding:18px 18px 10px;
      font-weight:900;
      color:var(--muted);
      font-size:13px;
      letter-spacing:.12em;
      text-transform:uppercase;
    }

    .navbtn{
      width:100%;
      border:0;
      background:transparent;
      text-align:left;
      padding:13px 18px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      cursor:pointer;
      color:var(--ink);
      border-top:1px solid rgba(229,217,197,.65);
    }

    .navbtn:hover,
    .navbtn.active{
      background:#f1e4cd;
    }

    .navbtn small{
      color:var(--muted);
    }

    .hero{
      border-radius:34px;
      padding:34px;
      min-height:250px;
      color:white;
      background:
        linear-gradient(135deg,rgba(47,105,66,.95),rgba(154,117,56,.94)),
        url("assets/maps/farm-map.png");
      background-size:cover;
      background-position:center;
      box-shadow:var(--shadow);
      position:relative;
      overflow:hidden;
    }

    .hero:after{
      content:"";
      position:absolute;
      inset:auto -60px -80px auto;
      width:230px;
      height:230px;
      border-radius:50%;
      background:rgba(255,255,255,.12);
    }

    .hero-kicker{
      text-transform:uppercase;
      letter-spacing:.22em;
      opacity:.82;
      font-weight:800;
      font-size:13px;
    }

    .hero h1{
      margin:12px 0 10px;
      font-size:44px;
      line-height:1.08;
      max-width:760px;
    }

    .hero p{
      max-width:760px;
      margin:0;
      font-size:18px;
      opacity:.9;
    }

    .panel{
      margin-top:18px;
      border:1px solid var(--line);
      border-radius:var(--radius);
      background:rgba(255,250,241,.86);
      box-shadow:var(--shadow);
      overflow:hidden;
    }

    .panel-head{
      padding:18px 20px;
      border-bottom:1px solid var(--line);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }

    .panel-head h2{
      margin:0;
      font-size:22px;
    }

    .toolbar{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
    }

    .pill,
    .chip{
      border:1px solid var(--line);
      background:#fff;
      border-radius:999px;
      padding:8px 12px;
      cursor:pointer;
      color:var(--ink);
    }

    .pill.active,
    .chip.active{
      color:white;
      border-color:transparent;
      background:linear-gradient(135deg,var(--green),var(--green2));
    }

    .content{
      padding:20px;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:14px;
    }

    .card{
      border:1px solid var(--line);
      background:rgba(255,255,255,.82);
      border-radius:22px;
      padding:16px;
      display:flex;
      gap:14px;
      cursor:pointer;
      transition:.18s ease;
      min-height:128px;
    }

    .card:hover{
      transform:translateY(-2px);
      box-shadow:0 16px 30px rgba(70,45,20,.10);
    }

    .thumb{
      width:62px;
      height:62px;
      flex:0 0 62px;
      border-radius:18px;
      background:#f2e6cf;
      display:grid;
      place-items:center;
      font-size:32px;
      overflow:hidden;
      border:1px solid rgba(80,60,25,.08);
    }

    .thumb img{
      width:100%;
      height:100%;
      object-fit:contain;
      padding:6px;
    }

    .card h3{
      margin:0 0 6px;
      font-size:20px;
    }

    .meta{
      color:var(--muted);
      font-size:14px;
    }

    .tagrow{
      display:flex;
      flex-wrap:wrap;
      gap:6px;
      margin-top:10px;
    }

    .tag{
      display:inline-flex;
      align-items:center;
      gap:4px;
      padding:4px 8px;
      border-radius:999px;
      font-size:12px;
      background:#f1e7d4;
      color:#5f513d;
    }

    .detail{
      display:grid;
      gap:18px;
    }

    .entity-head{
      display:grid;
      grid-template-columns:120px 1fr;
      gap:20px;
      align-items:center;
      padding:22px;
      border-radius:26px;
      background:linear-gradient(135deg,#fff,#fff8ea);
      border:1px solid var(--line);
    }

    .entity-icon{
      width:120px;
      height:120px;
      border-radius:28px;
      background:#f2e6cf;
      display:grid;
      place-items:center;
      font-size:58px;
      overflow:hidden;
      border:1px solid var(--line);
    }

    .entity-icon img{
      width:100%;
      height:100%;
      object-fit:contain;
      padding:12px;
    }

    .entity-head h2{
      margin:0;
      font-size:36px;
      line-height:1.05;
    }

    .entity-head p{
      margin:8px 0 0;
      color:var(--muted);
    }

    .quick-facts{
      display:grid;
      grid-template-columns:repeat(4,minmax(0,1fr));
      gap:10px;
      margin-top:14px;
    }

    .fact{
      padding:10px 12px;
      border-radius:16px;
      background:#f5ead7;
      border:1px solid rgba(229,217,197,.9);
    }

    .fact strong{
      display:block;
      font-size:12px;
      color:var(--muted);
      margin-bottom:3px;
    }

    .section{
      border:1px solid var(--line);
      border-radius:24px;
      background:rgba(255,255,255,.78);
      overflow:hidden;
    }

    .section h3{
      margin:0;
      padding:16px 18px;
      border-bottom:1px solid var(--line);
      background:#fff7e8;
      font-size:20px;
    }

    .section-body{
      padding:18px;
    }

    .timeline{
      display:grid;
      gap:12px;
    }

    .step{
      display:grid;
      grid-template-columns:46px 1fr;
      gap:12px;
      align-items:start;
    }

    .step-num{
      width:38px;
      height:38px;
      border-radius:14px;
      display:grid;
      place-items:center;
      background:linear-gradient(135deg,var(--green),var(--gold));
      color:white;
      font-weight:900;
    }

    .step-card{
      border:1px solid var(--line);
      border-radius:18px;
      padding:14px;
      background:#fff;
    }

    .step-card h4{
      margin:0 0 4px;
      font-size:17px;
    }

    .step-card p{
      margin:0;
      color:var(--muted);
    }

    .priority-list{
      display:grid;
      gap:12px;
    }

    .priority{
      border:1px solid var(--line);
      border-radius:20px;
      background:#fff;
      padding:14px;
      display:grid;
      grid-template-columns:44px 1fr;
      gap:12px;
    }

    .rank{
      width:36px;
      height:36px;
      border-radius:999px;
      display:grid;
      place-items:center;
      color:white;
      background:var(--green);
      font-weight:900;
    }

    .priority:nth-child(2) .rank{background:var(--gold)}
    .priority:nth-child(3) .rank{background:var(--blue)}
    .priority:nth-child(4) .rank{background:var(--red)}

    .priority h4{
      margin:0 0 4px;
    }

    .priority p{
      margin:0 0 8px;
      color:var(--muted);
    }

    .formula{
      padding:8px 10px;
      border-radius:12px;
      background:#f4ead8;
      display:inline-block;
      color:#5b4b32;
      font-size:13px;
    }

    .chain{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      align-items:center;
    }

    .node{
      border:1px solid var(--line);
      background:#fff;
      border-radius:18px;
      padding:10px 12px;
      display:flex;
      align-items:center;
      gap:8px;
      cursor:pointer;
    }

    .arrow{
      color:var(--muted);
      font-weight:900;
    }

    .two{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:14px;
    }

    .mini-table{
      width:100%;
      border-collapse:separate;
      border-spacing:0;
      overflow:hidden;
      border-radius:16px;
      border:1px solid var(--line);
      background:#fff;
    }

    .mini-table th,
    .mini-table td{
      text-align:left;
      padding:10px 12px;
      border-bottom:1px solid var(--line);
      vertical-align:top;
    }

    .mini-table tr:last-child th,
    .mini-table tr:last-child td{
      border-bottom:0;
    }

    .mini-table th{
      width:128px;
      color:var(--muted);
      background:#fff7e8;
      font-weight:700;
    }

    .mapbox{
      position:relative;
      min-height:220px;
      border-radius:24px;
      overflow:hidden;
      border:1px solid var(--line);
      background:#efe2ca;
    }

    .mapbox img{
      width:100%;
      height:260px;
      object-fit:cover;
      display:block;
    }

    .pin{
      position:absolute;
      left:var(--x);
      top:var(--y);
      transform:translate(-50%,-100%);
      background:var(--red);
      color:white;
      padding:6px 9px;
      border-radius:999px;
      font-size:12px;
      font-weight:800;
      white-space:nowrap;
      box-shadow:0 8px 18px rgba(0,0,0,.18);
    }

    .pin:after{
      content:"";
      position:absolute;
      left:50%;
      bottom:-6px;
      transform:translateX(-50%);
      border-left:6px solid transparent;
      border-right:6px solid transparent;
      border-top:7px solid var(--red);
    }

    .empty{
      padding:34px;
      text-align:center;
      color:var(--muted);
    }

    .note{
      margin-top:14px;
      padding:12px 14px;
      border-radius:16px;
      background:#fff3d8;
      color:#6d5630;
      border:1px solid #ecd8a8;
    }

    @media(max-width:860px){
      .topbar-inner{align-items:stretch}
      .brand span{display:none}
      .layout{grid-template-columns:1fr}
      .sidebar{position:static}
      .grid{grid-template-columns:1fr}
      .hero{padding:26px 22px}
      .hero h1{font-size:34px}
      .entity-head{grid-template-columns:1fr;text-align:left}
      .quick-facts{grid-template-columns:repeat(2,minmax(0,1fr))}
      .two{grid-template-columns:1fr}
    }
  </style>
</head>

<body>
  <div class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="brand-icon">🌾</div>
        <span>星露谷攻略百科</span>
      </div>
      <label class="search-wrap" for="searchInput">
        <span>🔎</span>
        <input id="searchInput" type="search" autocomplete="off" placeholder="搜索：玉米 / 罐头瓶 / 小桶 / 蜂蜜 / 献祭" />
      </label>
    </div>
  </div>

  <main class="app">
    <section class="hero">
      <div class="hero-kicker">Stardew Valley Guide</div>
      <h1>把攻略变成能搜、能串联、能扩展的百科库</h1>
      <p>搜索一个作物时，系统会按“来源 → 种植 → 收获 → 留存 → 加工 → 送礼 → 献祭 → 食谱 → 设备材料 → 地点”整合，不再只是一堆信息。</p>
    </section>

    <div class="layout">
      <aside class="sidebar">
        <div class="side-title">分类</div>
        <button class="navbtn active" data-filter="all">全部攻略 <small id="countAll">0</small></button>
        <button class="navbtn" data-filter="crop">作物 <small></small></button>
        <button class="navbtn" data-filter="machine">设备 <small></small></button>
        <button class="navbtn" data-filter="place">地点 <small></small></button>
        <button class="navbtn" data-filter="npc">NPC <small></small></button>
        <button class="navbtn" data-filter="bundle">献祭 <small></small></button>
        <button class="navbtn" data-filter="recipe">食谱 <small></small></button>

        <div class="side-title">快捷搜索</div>
        <button class="navbtn quick" data-query="玉米">🌽 玉米</button>
        <button class="navbtn quick" data-query="罐头瓶">🛢️ 罐头瓶</button>
        <button class="navbtn quick" data-query="小桶">🍷 小桶</button>
        <button class="navbtn quick" data-query="蜂蜜">🍯 蜂蜜</button>
        <button class="navbtn quick" data-query="秋季作物收集包">🏛️ 秋季作物收集包</button>
      </aside>

      <section>
        <div id="detailMount"></div>

        <section class="panel">
          <div class="panel-head">
            <h2 id="resultTitle">全部攻略</h2>
            <div class="toolbar">
              <button class="pill active" data-sort="score">相关优先</button>
              <button class="pill" data-sort="name">名称排序</button>
              <button class="pill" id="clearBtn">清空筛选</button>
            </div>
          </div>
          <div class="content">
            <div id="resultGrid" class="grid"></div>
            <div id="emptyState" class="empty" hidden>没搜到。换个关键词，或者把这个条目补进 DATA 里。</div>
          </div>
        </section>
      </section>
    </div>
  </main>

  <script>
    const ASSET = {
      item: "assets/items/",
      npc: "assets/npcs/",
      machine: "assets/machines/",
      map: "assets/maps/"
    };

    /*
      图片使用方式：
      1. 在 GitHub 仓库里建 assets 文件夹：
         assets/items/corn.png
         assets/machines/preserves-jar.png
         assets/maps/town-map.png
      2. 下面每个实体都有 image 字段。
      3. 没有图片时会自动显示 emoji，不影响网站使用。
    */

    const DATA = {
      rules: [
        {
          id:"rule-artisan",
          name:"加工收益黄金规则",
          icon:"📐",
          type:"rule",
          summary:"高基础价优先小桶，低基础价或高产量优先罐头瓶。",
          body:[
            "小桶：水果约 3 × 基础售价，蔬菜约 2.25 × 基础售价，处理时间较长。",
            "罐头瓶：2 × 基础售价 + 50，处理时间较短。",
            "星级通常不影响加工品价值，所以低品质作物优先加工，高品质可直接卖。"
          ],
          tags:["加工","收益","小桶","罐头瓶"]
        }
      ],

      entities:{
        corn:{
          id:"corn",
          name:"玉米",
          aliases:["玉米种子","玉米作物","Corn"],
          type:"crop",
          icon:"🌽",
          image:"assets/items/corn.png",
          summary:"夏秋两季作物，可连续收获。基础售价低、产量稳定，所以优先走罐头瓶或留献祭。",
          tags:["夏季","秋季","多季节","可再生","罐头瓶","产油机","献祭","食谱"],
          seasons:["夏季","秋季"],
          category:"作物",
          source:[
            {
              title:"购买种子",
              place:"皮埃尔杂货店",
              placeRef:"pierre",
              detail:"夏季和秋季可买玉米种子。种子价格建议你按游戏版本核对后填入，这里预留字段。",
              price:"150g",
              method:"买种子种植"
            }
          ],
          grow:{
            method:"种植",
            days:"14天成熟",
            regrow:"成熟后每4天再次收获",
            location:"农场 / 姜岛农场",
            notes:"跨夏秋两季，夏季早种可以吃满两个季节的再生收益。"
          },
          sell:{
            base:"50g",
            silver:"62g",
            gold:"75g",
            iridium:"100g"
          },
          retain:[
            {
              title:"社区中心秋季作物收集包",
              count:"1个",
              reason:"秋季作物收集包需要玉米。"
            },
            {
              title:"高品质作物收集包",
              count:"金星玉米 x5",
              reason:"高品质收集包可选项之一，建议提前留够金星。"
            },
            {
              title:"食谱材料",
              count:"按需求留",
              reason:"墨西哥薄饼等食谱会用到玉米。"
            }
          ],
          priorities:[
            {
              rank:1,
              action:"罐头瓶",
              target:"腌菜",
              deviceRef:"preserves-jar",
              why:"玉米基础售价低且产量稳定，罐头瓶公式更适合。",
              result:"约 150g",
              formula:"2 × 50 + 50 = 150g",
              time:"2-3天"
            },
            {
              rank:2,
              action:"留存",
              target:"献祭 / 食谱",
              why:"先保证秋季作物收集包和高品质作物收集包，再处理多余玉米。",
              result:"避免后期返工",
              formula:"秋季作物包 1个；高品质包金星 x5"
            },
            {
              rank:3,
              action:"产油机",
              target:"油",
              deviceRef:"oil-maker",
              why:"可以转成油，但时间和价值不一定比罐头瓶更优，主要用于料理或补材料链。",
              result:"100g",
              formula:"玉米 → 油",
              time:"16小时"
            },
            {
              rank:4,
              action:"直接出售",
              target:"金币",
              why:"前期缺现金、机器产能不足时可直接卖，金星和铱星更适合直接卖。",
              result:"50g 起",
              formula:"普通 50g，金星 75g，铱星 100g"
            }
          ],
          processing:["preserves-jar","oil-maker","keg"],
          bundles:["fall-crops-bundle","quality-crops-bundle"],
          recipes:["tortilla"],
          maps:[
            {
              title:"皮埃尔杂货店",
              image:"assets/maps/town-map.png",
              pins:[{label:"皮埃尔",x:"45%",y:"45%"}]
            }
          ],
          related:["preserves-jar","oil-maker","keg","fall-crops-bundle","quality-crops-bundle","tortilla","pierre","farm"]
        },

        starfruit:{
          id:"starfruit",
          name:"杨桃",
          aliases:["Starfruit"],
          type:"crop",
          icon:"⭐",
          image:"assets/items/starfruit.png",
          summary:"夏季高价值作物，单体价值极高，优先小桶酿酒，有条件进地窖陈酿。",
          tags:["夏季","高价值","小桶","陈酿"],

    const TYPE_LABEL = {
      crop:"作物",
      machine:"设备",
      item:"物品",
      place:"地点",
      npc:"NPC",
      bundle:"献祭",
      recipe:"食谱",
      rule:"规则"
    };

    const els = {
      input: document.getElementById("searchInput"),
      grid: document.getElementById("resultGrid"),
      empty: document.getElementById("emptyState"),
      detail: document.getElementById("detailMount"),
      title: document.getElementById("resultTitle"),
      countAll: document.getElementById("countAll"),
      clear: document.getElementById("clearBtn")
    };

    let currentFilter = "all";
    let currentSort = "score";

    const entities = Object.values(DATA.entities);
    els.countAll.textContent = entities.length;

    function normalize(s){
      return String(s || "").toLowerCase().replace(/\s+/g,"");
    }

    function textBlob(entity){
      return normalize(JSON.stringify(entity));
    }

    function scoreEntity(entity, query){
      if(!query) return 1;
      const q = normalize(query);
      const name = normalize(entity.name);
      const aliases = normalize((entity.aliases || []).join(" "));
      const tags = normalize((entity.tags || []).join(" "));
      const blob = textBlob(entity);

      let score = 0;
      if(name === q) score += 1000;
      if(name.includes(q)) score += 600;
      if(aliases.includes(q)) score += 420;
      if(tags.includes(q)) score += 260;
      if(blob.includes(q)) score += 120;

      const chars = [...q];
      const loose = chars.every(ch => blob.includes(ch));
      if(loose) score += Math.max(0, 80 - q.length * 3);

      return score;
    }

    function getFiltered(){
      const q = els.input.value.trim();
      let list = entities.map(e => ({...e, _score: scoreEntity(e,q)}));

      if(q){
        list = list.filter(e => e._score > 0);
      }

      if(currentFilter !== "all"){
        list = list.filter(e => e.type === currentFilter);
      }

      if(currentSort === "name"){
        list.sort((a,b) => a.name.localeCompare(b.name,"zh-Hans-CN"));
      }else{
        list.sort((a,b) => b._score - a._score || a.name.localeCompare(b.name,"zh-Hans-CN"));
      }

      return list;
    }

    function safeImg(src, alt, icon){
      if(!src){
        return `<div class="thumb">${icon || "📦"}</div>`;
      }
      return `
        <div class="thumb">
          <img src="${src}" alt="${alt}" onerror="this.remove();this.parentElement.textContent='${icon || "📦"}';">
        </div>
      `;
    }

    function bigImg(src, alt, icon){
      if(!src){
        return `<div class="entity-icon">${icon || "📦"}</div>`;
      }
      return `
        <div class="entity-icon">
          <img src="${src}" alt="${alt}" onerror="this.remove();this.parentElement.textContent='${icon || "📦"}';">
        </div>
      `;
    }

    function renderGrid(list){
      els.grid.innerHTML = list.map(entity => `
        <article class="card" data-open="${entity.id}">
          ${safeImg(entity.image, entity.name, entity.icon)}
          <div>
            <h3>${entity.name}</h3>
            <div class="meta">${TYPE_LABEL[entity.type] || entity.category || "条目"} · ${entity.summary || ""}</div>
            <div class="tagrow">
              ${(entity.tags || []).slice(0,6).map(tag => `<span class="tag">${tag}</span>`).join("")}
            </div>
          </div>
        </article>
      `).join("");

      els.empty.hidden = list.length !== 0;

      document.querySelectorAll("[data-open]").forEach(card => {
        card.addEventListener("click", () => openEntity(card.dataset.open));
      });
    }

    function linkedName(id, fallback){
      if(!id || !DATA.entities[id]) return fallback || "";
      const e = DATA.entities[id];
      return `<button class="chip" data-query="${e.name}">${e.icon || "🔗"} ${e.name}</button>`;
    }

    function renderFacts(entity){
      const facts = [];

      if(entity.seasons) facts.push(["季节", entity.seasons.join(" / ")]);
      if(entity.grow?.days) facts.push(["成熟", entity.grow.days]);
      if(entity.grow?.regrow) facts.push(["再收获", entity.grow.regrow]);
      if(entity.sell?.base) facts.push(["基础售价", entity.sell.base]);
      if(entity.craft?.source) facts.push(["配方来源", entity.craft.source]);
      if(entity.reward) facts.push(["奖励", entity.reward]);
      if(entity.home) facts.push(["住所", entity.home]);

      if(!facts.length) return "";

      return `
        <div class="quick-facts">
          ${facts.map(([k,v]) => `
            <div class="fact">
              <strong>${k}</strong>
              <span>${v}</span>
            </div>
          `).join("")}
        </div>
      `;
    }

    function renderJourney(entity){
      if(entity.type !== "crop" && entity.type !== "item") return "";

      const steps = [];

      if(entity.source?.length){
        steps.push({
          title:"怎么来",
          body:entity.source.map(s => {
            const place = s.placeRef ? linkedName(s.placeRef,s.place) : s.place;
            return `${s.method || "来源"}：${s.detail || ""} ${s.price ? `价格：${s.price}。` : ""} ${place ? `地点：${place}` : ""}`;
          }).join("<br>")
        });
      }

      if(entity.grow){
        steps.push({
          title:"怎么种 / 怎么获得",
          body:`${entity.grow.method || ""}。${entity.grow.days || ""}。${entity.grow.regrow || ""}。地点：${entity.grow.location || "待补"}。${entity.grow.notes || ""}`
        });
      }

      if(entity.retain?.length){
        steps.push({
          title:"先留什么",
          body:entity.retain.map(r => `留 ${r.count || ""}：${r.title}。${r.reason || ""}`).join("<br>")
        });
      }

      if(entity.priorities?.length){
        steps.push({
          title:"收获后怎么处理",
          body:"看下面的优先级，不要只按单价卖。"
        });
      }

      if(entity.processing?.length){
        steps.push({
          title:"加工链路",
          body:entity.processing.map(id => linkedName(id)).join(" ")
        });
      }

      if(entity.bundles?.length){
        steps.push({
          title:"献祭 / 收集包",
          body:entity.bundles.map(id => linkedName(id)).join(" ")
        });
      }

      if(entity.recipes?.length){
        steps.push({
          title:"食谱用途",
          body:entity.recipes.map(id => linkedName(id)).join(" ")
        });
      }

      return `
        <section class="section">
          <h3>来龙去脉</h3>
          <div class="section-body">
            <div class="timeline">
              ${steps.map((s,i) => `
                <div class="step">
                  <div class="step-num">${i+1}</div>
                  <div class="step-card">
                    <h4>${s.title}</h4>
                    <p>${s.body}</p>
                  </div>
                </div>
              `).join("")}
            </div>
          </div>
        </section>
      `;
    }

    function renderPriorities(entity){
      if(!entity.priorities?.length) return "";

      return `
        <section class="section">
          <h3>处理优先级</h3>
          <div class="section-body">
            <div class="priority-list">
              ${entity.priorities.map(p => `
                <div class="priority">
                  <div class="rank">${p.rank}</div>
                  <div>
                    <h4>${p.action}${p.target ? ` → ${p.target}` : ""}</h4>
                    <p>${p.why || ""}</p>
                    <div class="tagrow">
                      ${p.result ? `<span class="tag">收益：${p.result}</span>` : ""}
                      ${p.time ? `<span class="tag">耗时：${p.time}</span>` : ""}
                      ${p.deviceRef ? linkedName(p.deviceRef) : ""}
                    </div>
                    ${p.formula ? `<div class="formula">${p.formula}</div>` : ""}
                  </div>
                </div>
              `).join("")}
            </div>
          </div>
        </section>
      `;
    }

    function renderCraft(entity){
      if(!entity.craft && !entity.effects) return "";

      return `
        <section class="section">
          <h3>设备材料与作用</h3>
          <div class="section-body two">
            <table class="mini-table">
              <tbody>
                <tr>
                  <th>配方来源</th>
                  <td>${entity.craft?.source || "待补"}</td>
                </tr>
                <tr>
                  <th>合成材料</th>
                  <td>
                    ${(entity.craft?.materials || []).map(m => `${m[0]} x${m[1]}`).join("<br>") || "待补"}
                  </td>
                </tr>
              </tbody>
            </table>
            <div>
              ${(entity.effects || []).map(e => `<p>• ${e}</p>`).join("")}
              ${entity.bestFor ? `<div class="note">适合处理：${entity.bestFor.join(" / ")}</div>` : ""}
            </div>
          </div>
        </section>
      `;
    }

    function renderBundle(entity){
      if(entity.type !== "bundle") return "";

      return `
        <section class="section">
          <h3>收集包需求</h3>
          <div class="section-body">
            <table class="mini-table">
              <tbody>
                ${(entity.needs || []).map(n => `
                  <tr>
                    <th>${n[0]}</th>
                    <td>${n[1] ? `数量：${n[1]}` : ""} ${n[2] ? linkedName(n[2]) : ""}</td>
                  </tr>
                `).join("")}
                <tr>
                  <th>奖励</th>
                  <td>${entity.reward || "待补"}</td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>
      `;
    }

    function renderRecipe(entity){
      if(entity.type !== "recipe") return "";

      return `
        <section class="section">
          <h3>食谱链路</h3>
          <div class="section-body">
            <table class="mini-table">
              <tbody>
                <tr>
                  <th>配方来源</th>
                  <td>${entity.source || "待补"}</td>
                </tr>
                <tr>
                  <th>材料</th>
                  <td>
                    ${(entity.ingredients || []).map(i => `${i[0]} x${i[1]} ${i[2] ? linkedName(i[2]) : ""}`).join("<br>")}
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>
      `;
    }

    function renderNpc(entity){
      if(entity.type !== "npc") return "";

      return `
        <section class="section">
          <h3>NPC 礼物与作息</h3>
          <div class="section-body two">
            <table class="mini-table">
              <tbody>
                <tr><th>住所</th><td>${entity.home || "待补"}</td></tr>
                <tr><th>喜欢</th><td>${entity.likes?.length ? entity.likes.join(" / ") : "等 NPC 文件上传后补全"}</td></tr>
              </tbody>
            </table>
            <div>
              ${(entity.schedule || []).map(s => `<p>• ${s}</p>`).join("")}
            </div>
          </div>
        </section>
      `;
    }

    function renderMap(entity){
      const maps = [];

      if(entity.map) maps.push(entity.map);
      if(entity.maps) maps.push(...entity.maps);

      if(!maps.length) return "";

      return `
        <section class="section">
          <h3>地图位置</h3>
          <div class="section-body">
            ${maps.map(m => `
              <div>
                <h4>${m.title || entity.name}</h4>
                <div class="mapbox">
                  <img src="${m.image}" alt="${m.title || entity.name}" onerror="this.style.display='none'; this.parentElement.style.minHeight='180px';">
                  ${(m.pins || []).map(pin => `
                    <span class="pin" style="--x:${pin.x};--y:${pin.y};">${pin.label}</span>
                  `).join("")}
                </div>
              </div>
            `).join("")}
            <div class="note">把攻略里的地图图片导出到 assets/maps/ 后，定位会直接显示在这里。</div>
          </div>
        </section>
      `;
    }

    function renderRelated(entity){
      const related = entity.related || [];
      if(!related.length) return "";

      return `
        <section class="section">
          <h3>相关条目</h3>
          <div class="section-body">
            <div class="chain">
              ${related.map((id,i) => `
                ${i ? `<span class="arrow">→</span>` : ""}
                ${linkedName(id,id)}
              `).join("")}
            </div>
          </div>
        </section>
      `;
    }

    function renderEntity(entity){
      return `
        <section class="panel">
          <div class="content detail">
            <div class="entity-head">
              ${bigImg(entity.image, entity.name, entity.icon)}
              <div>
                <div class="meta">${TYPE_LABEL[entity.type] || entity.category || "条目"}</div>
                <h2>${entity.name}</h2>
                <p>${entity.summary || ""}</p>
                <div class="tagrow">
                  ${(entity.tags || []).map(tag => `<button class="chip" data-query="${tag}">${tag}</button>`).join("")}
                </div>
                ${renderFacts(entity)}
              </div>
            </div>

            ${renderJourney(entity)}
            ${renderPriorities(entity)}
            ${renderCraft(entity)}
            ${renderBundle(entity)}
            ${renderRecipe(entity)}
            ${renderNpc(entity)}
            ${renderMap(entity)}
            ${renderRelated(entity)}
          </div>
        </section>
      `;
    }

    function openEntity(id){
      const entity = DATA.entities[id];
      if(!entity) return;
      els.detail.innerHTML = renderEntity(entity);
      bindQueryButtons();
      window.scrollTo({top:0,behavior:"smooth"});
    }

    function bindQueryButtons(){
      document.querySelectorAll("[data-query]").forEach(btn => {
        btn.addEventListener("click", () => {
          els.input.value = btn.dataset.query;
          update();
        });
      });
    }

    function renderRules(){
      return `
        <section class="panel">
          <div class="panel-head">
            <h2>黄金规则</h2>
          </div>
          <div class="content">
            ${DATA.rules.map(rule => `
              <div class="section">
                <h3>${rule.icon} ${rule.name}</h3>
                <div class="section-body">
                  <p>${rule.summary}</p>
                  ${(rule.body || []).map(x => `<p>• ${x}</p>`).join("")}
                </div>
              </div>
            `).join("")}
          </div>
        </section>
      `;
    }

    function update(){
      const q = els.input.value.trim();
      const list = getFiltered();

      els.title.textContent = q ? `搜索：${q}` : (currentFilter === "all" ? "全部攻略" : TYPE_LABEL[currentFilter]);

      if(q && list[0]){
        els.detail.innerHTML = renderEntity(list[0]);
      }else if(!q){
        els.detail.innerHTML = renderRules();
      }else{
        els.detail.innerHTML = "";
      }

      renderGrid(list);
      bindQueryButtons();
    }

    document.querySelectorAll(".navbtn[data-filter]").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".navbtn[data-filter]").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentFilter = btn.dataset.filter;
        update();
      });
    });

    document.querySelectorAll(".pill[data-sort]").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".pill[data-sort]").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentSort = btn.dataset.sort;
        update();
      });
    });

    els.input.addEventListener("input", update);

    els.clear.addEventListener("click", () => {
      els.input.value = "";
      currentFilter = "all";
      document.querySelectorAll(".navbtn[data-filter]").forEach(b => b.classList.toggle("active", b.dataset.filter === "all"));
      update();
    });

    bindQueryButtons();
    update();
  </script>
</body>
</html>
